<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VBLL62GBHC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VBLL62GBHC');
  </script>
  <title>Ciclo Fértil — Conceitos de Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0e6da;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 60px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #4a2e1a;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .variants {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .label {
      font-size: 13px;
      font-weight: 700;
      color: #4a2e1a;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .sub {
      font-size: 11px;
      color: #8c5a32;
      text-align: center;
      font-style: italic;
    }
    .tag {
      font-size: 10px;
      color: #c8956c;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }
    svg { display: block; }
  </style>
</head>
<body>

<h1>Ciclo Fértil — Conceitos de Logo</h1>

<div class="row">

  <!-- ═══════════════════════════════════════
       CONCEITO 1: A VIRADA
       Representa a curva de temperatura basal —
       o momento em que a ovulação acontece.
       3 barras baixas (fase folicular) → salto
       abrupto para 2 barras altas (fase lútea).
  ══════════════════════════════════════════ -->
  <div class="card">
    <div class="variants">

      <!-- Fundo claro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#fdf8f2"/>
        <!-- 5 barras ascendentes, baseline y=138 -->
        <!-- w=22, gap=8, total=142, startX=9 -->
        <rect x="9"   y="98" width="22" height="40"  rx="3" fill="#4a2e1a"/>
        <rect x="39"  y="86" width="22" height="52"  rx="3" fill="#4a2e1a"/>
        <rect x="69"  y="74" width="22" height="64"  rx="3" fill="#4a2e1a"/>
        <rect x="99"  y="30" width="22" height="108" rx="3" fill="#6c391d"/>
        <rect x="129" y="38" width="22" height="100" rx="3" fill="#6c391d"/>
        <!-- ponto indicador no pico -->
        <circle cx="110" cy="22" r="7" fill="#6c391d"/>
      </svg>

      <!-- Fundo escuro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#1a0d06"/>
        <rect x="9"   y="98" width="22" height="40"  rx="3" fill="#c8956c"/>
        <rect x="39"  y="86" width="22" height="52"  rx="3" fill="#c8956c"/>
        <rect x="69"  y="74" width="22" height="64"  rx="3" fill="#c8956c"/>
        <rect x="99"  y="30" width="22" height="108" rx="3" fill="#f5ede3"/>
        <rect x="129" y="38" width="22" height="100" rx="3" fill="#f5ede3"/>
        <circle cx="110" cy="22" r="7" fill="#f5ede3"/>
      </svg>

    </div>
    <div class="label">A Virada</div>
    <div class="sub">Curva de temperatura basal</div>
    <div class="tag">conceito 1</div>
  </div>


  <!-- ═══════════════════════════════════════
       CONCEITO 2: 4 PILARES
       4 blocos em composição diagonal —
       grande/pequeno em cima, pequeno/grande
       embaixo. Representa as 4 áreas do método
       com peso visual intencional.
  ══════════════════════════════════════════ -->
  <div class="card">
    <div class="variants">

      <!-- Fundo claro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#fdf8f2"/>
        <!-- Top-left: retângulo largo -->
        <rect x="20"  y="20"  width="76" height="50" rx="4" fill="#4a2e1a"/>
        <!-- Top-right: quadrado -->
        <rect x="104" y="20"  width="36" height="50" rx="4" fill="#6c391d"/>
        <!-- Bottom-left: quadrado -->
        <rect x="20"  y="78"  width="36" height="62" rx="4" fill="#6c391d"/>
        <!-- Bottom-right: retângulo largo -->
        <rect x="64"  y="78"  width="76" height="62" rx="4" fill="#4a2e1a"/>
      </svg>

      <!-- Fundo escuro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#1a0d06"/>
        <rect x="20"  y="20"  width="76" height="50" rx="4" fill="#f5ede3"/>
        <rect x="104" y="20"  width="36" height="50" rx="4" fill="#c8956c"/>
        <rect x="20"  y="78"  width="36" height="62" rx="4" fill="#c8956c"/>
        <rect x="64"  y="78"  width="76" height="62" rx="4" fill="#f5ede3"/>
      </svg>

    </div>
    <div class="label">4 Pilares</div>
    <div class="sub">As 4 áreas do método</div>
    <div class="tag">conceito 2</div>
  </div>


  <!-- ═══════════════════════════════════════
       CONCEITO 3: O CICLO
       4 segmentos formando um anel/donut —
       cada segmento = 1 fase do ciclo fértil
       (menstrual, folicular, ovulatória, lútea).
       Gaps entre os segmentos evocam a
       transição entre as fases.
  ══════════════════════════════════════════ -->
  <div class="card">
    <div class="variants">

      <!-- Fundo claro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#fdf8f2"/>
        <g transform="rotate(-90 80 80)">
          <!-- S1: 4°→86° (R=55, r=30) -->
          <path d="M134.87 83.84 A55 55 0 0 1 83.84 134.87 L82.09 109.93 A30 30 0 0 0 109.93 82.09 Z" fill="#4a2e1a"/>
          <!-- S2: 94°→176° -->
          <path d="M76.16 134.87 A55 55 0 0 1 25.13 83.84 L50.07 82.09 A30 30 0 0 0 77.91 109.93 Z" fill="#6c391d"/>
          <!-- S3: 184°→266° -->
          <path d="M25.13 76.16 A55 55 0 0 1 76.16 25.13 L77.91 50.07 A30 30 0 0 0 50.07 77.91 Z" fill="#4a2e1a"/>
          <!-- S4: 274°→356° -->
          <path d="M83.84 25.13 A55 55 0 0 1 134.87 76.16 L109.93 77.91 A30 30 0 0 0 82.09 50.07 Z" fill="#6c391d"/>
        </g>
      </svg>

      <!-- Fundo escuro -->
      <svg width="140" height="140" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="160" rx="28" fill="#1a0d06"/>
        <g transform="rotate(-90 80 80)">
          <path d="M134.87 83.84 A55 55 0 0 1 83.84 134.87 L82.09 109.93 A30 30 0 0 0 109.93 82.09 Z" fill="#f5ede3"/>
          <path d="M76.16 134.87 A55 55 0 0 1 25.13 83.84 L50.07 82.09 A30 30 0 0 0 77.91 109.93 Z" fill="#c8956c"/>
          <path d="M25.13 76.16 A55 55 0 0 1 76.16 25.13 L77.91 50.07 A30 30 0 0 0 50.07 77.91 Z" fill="#f5ede3"/>
          <path d="M83.84 25.13 A55 55 0 0 1 134.87 76.16 L109.93 77.91 A30 30 0 0 0 82.09 50.07 Z" fill="#c8956c"/>
        </g>
      </svg>

    </div>
    <div class="label">O Ciclo</div>
    <div class="sub">As 4 fases do ciclo fértil</div>
    <div class="tag">conceito 3</div>
  </div>

</div>


<!-- ═══ VERSÃO COM NOME AO LADO ═══ -->
<h1 style="margin-top:20px;">Com nome da marca</h1>

<div class="row">

  <!-- Conceito 1 + nome -->
  <div class="card">
    <svg width="340" height="72" viewBox="0 0 340 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="340" height="72" rx="16" fill="#fdf8f2"/>
      <!-- ícone menor inline -->
      <rect x="12" y="14" width="9"  height="15" rx="1.5" fill="#4a2e1a"/>
      <rect x="24" y="9"  width="9"  height="20" rx="1.5" fill="#4a2e1a"/>
      <rect x="36" y="4"  width="9"  height="25" rx="1.5" fill="#4a2e1a"/>
      <rect x="48" y="14" width="9"  height="44" rx="1.5" fill="#6c391d"/>
      <circle cx="52.5" cy="10" r="3.5" fill="#6c391d"/>
      <!-- texto -->
      <text x="72" y="30" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#4a2e1a">Ciclo Fértil</text>
      <text x="72" y="50" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#8c5a32" letter-spacing="1.5">MÉTODO</text>
    </svg>
    <div class="tag">conceito 1 — horizontal</div>
  </div>

  <!-- Conceito 3 + nome -->
  <div class="card">
    <svg width="300" height="72" viewBox="0 0 300 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="72" rx="16" fill="#fdf8f2"/>
      <!-- ícone ciclo menor inline -->
      <g transform="translate(36,36) rotate(-90) scale(0.28)">
        <path d="M134.87 83.84 A55 55 0 0 1 83.84 134.87 L82.09 109.93 A30 30 0 0 0 109.93 82.09 Z" fill="#4a2e1a" transform="translate(-80,-80)"/>
        <path d="M76.16 134.87 A55 55 0 0 1 25.13 83.84 L50.07 82.09 A30 30 0 0 0 77.91 109.93 Z" fill="#6c391d" transform="translate(-80,-80)"/>
        <path d="M25.13 76.16 A55 55 0 0 1 76.16 25.13 L77.91 50.07 A30 30 0 0 0 50.07 77.91 Z" fill="#4a2e1a" transform="translate(-80,-80)"/>
        <path d="M83.84 25.13 A55 55 0 0 1 134.87 76.16 L109.93 77.91 A30 30 0 0 0 82.09 50.07 Z" fill="#6c391d" transform="translate(-80,-80)"/>
      </g>
      <!-- texto -->
      <text x="62" y="30" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#4a2e1a">Ciclo Fértil</text>
      <text x="62" y="50" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#8c5a32" letter-spacing="1.5">MÉTODO</text>
    </svg>
    <div class="tag">conceito 3 — horizontal</div>
  </div>

</div>

</body>
</html>
