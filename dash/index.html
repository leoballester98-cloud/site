  await verRegistros();
}

async function apagarRef(id) {
  if (!confirm('Apagar este registro?')) return;
  const { error } = await sb.from('referencias').delete().eq('id', id);
  if (error) return alert('Não deu pra apagar: ' + error.message);
  await verRegistros();
}

// ══════════════════════ CUSTOS OPERACIONAIS ══════════════════════
/* Primeira aba que ESCREVE no banco. Quem pode é o RLS que decide (05-custos.sql):
   aqui não há checagem de permissão, e não deve haver — validação de acesso no
   navegador é decoração. */
/* Avulsos e ocorrências dos fixos numa lista só, montada no banco. Se a função
   ainda não existir (15-custos-fixos.sql não rodado), cai na leitura antiga —
   a Visão Geral não pode parar de abrir por causa disso. */
const custosDoPeriodo = async () => {
  const p = periodo();
  const r = await Promise.resolve(sb.rpc('fn_custos', { p_de:p.de, p_ate:p.ate }))
    .catch(() => ({ error: true }));
  if (r && !r.error) return r.data || [];

  let q = sb.from('custos').select('*').order('data', { ascending:false }).order('criado_em', { ascending:false });
  if (p.de)  q = q.gte('data', p.de);
  if (p.ate) q = q.lte('data', p.ate);
  const { data, error } = await q;
  if (error) throw error;
  return (data || []).map(c => ({ ...c, fixo: false }));
};

const custosFixos = async () => {
  const r = await Promise.resolve(
    sb.from('custos_fixos').select('*').is('fim', null).order('nome')
  ).catch(() => ({ error: true }));
  return (r && !r.error && r.data) ? r.data : [];
};

async function verCustos() {
  const [linhas, fixos] = await Promise.all([custosDoPeriodo(), custosFixos()]);
  const total = linhas.reduce((a, c) => a + Number(c.valor), 0);
  const mensalFixo = fixos.reduce((a, f) => a + Number(f.valor), 0);
  const hoje = iso(hojeSP());

  document.getElementById('conteudo').innerHTML =
    '<div class="kpis cinco">' +
      kpi('Gasto operacional', moeda(total)) +
      kpi('Lançamentos', linhas.length) +
      kpi('Fixo por mês', moeda(mensalFixo)) +
    '</div>' +
    '<div class="card">' +
      '<div class="sec">' + ico('Gasto operacional') + '<span>Novo lançamento</span></div>' +
      '<div class="fcusto">' +
        '<label>Nome<input id="cNome" maxlength="120" placeholder="Ex.: edição de vídeo"/></label>' +
        /* text e não number: type=number descarta a vírgula em teclado
           brasileiro antes de o JS ver o que foi digitado — inputmode decimal
           mantém o teclado numérico no celular sem essa perda. */
        '<label>Valor<input id="cValor" type="text" inputmode="decimal" placeholder="0,00"/></label>' +
        '<label>Data<input id="cData" type="date" value="' + hoje + '"/></label>' +
        '<label class="fcheck"><input type="checkbox" id="cFixo" onchange="alternarFixo()"/>' +
          '<span>Todo mês</span></label>' +
        '<button class="prim" onclick="salvarCusto()">Adicionar</button>' +
      '</div>' +
      '<div class="nota" id="cNotaFixo" style="display:none;">Vai contar em todo mês a partir ' +
        'do dia escolhido. Só a regra é guardada — mudar o valor corrige o histórico inteiro.</div>' +
      '<div id="cErro" class="erro" style="display:none;"></div>' +
      (avisoCusto ? '<div class="aviso" style="margin-top:12px;">' + avisoCusto + '</div>' : '') +
    '</div>' +
    (fixos.length
      ? '<div class="card">' +
          '<div class="sec">' + ico('Gasto operacional') + '<span>Custos fixos</span></div>' +
          '<div class="qual">Estes se repetem todo mês sozinhos. Encerrar para de contar ' +
            'daqui pra frente e preserva o histórico — apagar reescreveria o passado.</div>' +
          '<div class="tbwrap"><table class="tb"><tr><th>Nome</th><th class="num">Por mês</th>' +
            '<th>Dia</th><th>Desde</th><th></th></tr>' +
          fixos.map(f =>
            '<tr><td class="nm">' + esc(f.nome) + '</td>' +
            '<td class="num">' + moeda(f.valor) + '</td>' +
            '<td>' + f.dia + '</td>' +
            '<td>' + brDate(f.inicio) + '</td>' +
            '<td class="num"><button class="limpar" onclick="encerrarFixo(\'' + f.id + '\')">encerrar</button></td></tr>').join('') +
          '<tr><td class="nm"><b>Total mensal</b></td><td class="num"><b>' + moeda(mensalFixo) + '</b></td>' +
            '<td></td><td></td><td></td></tr>' +
          '</table></div>' +
        '</div>'
      : '') +
    '<div class="card">' +
      '<div class="sec">' + ico('Gasto operacional') + '<span>Lançamentos do período</span></div>' +
      (linhas.length
        ? '<div class="tbwrap"><table class="tb"><tr><th>Nome</th><th class="num">Valor</th><th>Data</th><th></th></tr>' +
          linhas.map(c =>
            '<tr><td class="nm">' + esc(c.nome) +
              (c.fixo ? ' <span class="abtag" style="--c:var(--ink-3)">fixo</span>' : '') + '</td>' +
            '<td class="num">' + moeda(c.valor) + '</td>' +
            '<td>' + brDate(c.data) + '</td>' +
            /* Ocorrência de fixo não tem linha própria pra apagar — ela é
               calculada. Quem sai é a regra, no card de cima. */
            '<td class="num">' + (c.fixo ? ''
              : '<button class="limpar" onclick="apagarCusto(\'' + c.id + '\')">excluir</button>') +
            '</td></tr>').join('') +
          '<tr><td class="nm"><b>Total</b></td><td class="num"><b>' + moeda(total) + '</b></td><td></td><td></td></tr>' +
          '</table></div>'
        : '<div class="vazio">Nenhum custo lançado neste período.</div>') +
    '</div>';
}

/* Fica fora de verCustos pra sobreviver ao redesenho: é ele que conta o que
   acabou de acontecer, e o redesenho é justamente o que apagaria o recado. */
let avisoCusto = '';

async function salvarCusto() {
  const erro = document.getElementById('cErro');
  const nome = document.getElementById('cNome').value.trim();
  /* Vírgula vira ponto antes do Number(). Em teclado brasileiro é o separador
     natural, e Number('120,50') é NaN — o lançamento morria em "Valor
     inválido" sem que a pessoa entendesse o que havia de errado com 120,50. */
  const bruto = String(document.getElementById('cValor').value).replace(',', '.');
  const valor = Number(bruto);
  const data = document.getElementById('cData').value;
  const falar = m => { erro.textContent = m; erro.style.display = ''; };
  erro.style.display = 'none';

  if (!nome) return falar('Dá um nome pro custo.');
  if (!bruto.trim() || !isFinite(valor) || valor < 0) return falar('Valor inválido.');
  if (!data) return falar('Escolhe a data.');

  /* Fixo guarda a REGRA e vai pra outra tabela; avulso guarda a ocorrência.
     O dia sai da data escolhida, limitado a 28 — 29, 30 e 31 não existem em
     todo mês, e um custo que pula fevereiro é um erro difícil de enxergar. */
  const fixo = !!(document.getElementById('cFixo') || {}).checked;
  const { error } = fixo
    ? await sb.from('custos_fixos').insert([{
        nome, valor, dia: Math.min(28, Number(data.slice(8, 10))), inicio: data }])
    : await sb.from('custos').insert([{ nome, valor, data }]);
  if (error) return falar('Não deu pra salvar: ' + error.message);

  if (fixo) {
    avisoCusto = '<b>' + esc(nome) + '</b> de ' + moeda(valor) + ' virou custo fixo, ' +
      'todo dia ' + Math.min(28, Number(data.slice(8, 10))) + ', a partir de ' + brDate(data) + '.';
    try { await verCustos(); }
    catch (e) { falar('Salvou, mas não deu pra atualizar a lista: ' + (e.message || e)); }
    return;
  }

  /* O custo salva sempre, mas a lista abaixo respeita o filtro de data. Salvar
     um custo de ontem com o filtro em "hoje" gravava a linha e não mostrava
     nada — indistinguível de não ter salvo, e foi o que fez o mesmo custo ser
     lançado duas vezes. Agora o recado diz onde ele foi parar. */
  const p = periodo();
  const foraDoFiltro = (p.de && data < p.de) || (p.ate && data > p.ate);
  avisoCusto = foraDoFiltro
    ? '<b>' + esc(nome) + '</b> de ' + moeda(valor) + ' foi lançado em ' + brDate(data) +
      ', que está fora do período filtrado — por isso ele não aparece na lista abaixo. ' +
      'Mude o filtro de data pra ver.'
    : '<b>' + esc(nome) + '</b> de ' + moeda(valor) + ' lançado em ' + brDate(data) + '.';

  /* Se o redesenho falhar, a tela ficaria igualzinha a um save que não
     aconteceu — que é exatamente a confusão que este bloco existe pra evitar. */
  try { await verCustos(); }
  catch (e) { falar('Salvou, mas não deu pra atualizar a lista: ' + (e.message || e)); }
}

async function apagarCusto(id) {
  if (!confirm('Excluir este lançamento?')) return;
  const { error } = await sb.from('custos').delete().eq('id', id);
  if (error) return alert('Não deu pra excluir: ' + error.message);
  await verCustos();
}

function alternarFixo() {
  const on = document.getElementById('cFixo').checked;
  document.getElementById('cNotaFixo').style.display = on ? '' : 'none';
}

/* Encerrar e não apagar: apagar tiraria o custo de todos os meses em que ele
   realmente existiu, e o lucro do passado mudaria sozinho. O fim fica na
   véspera, então o mês corrente ainda conta se o dia já passou. */
async function encerrarFixo(id) {
  if (!confirm('Parar de contar este custo daqui pra frente?\n\nOs meses anteriores continuam como estão.')) return;
  const ontem = iso(maisDias(new Date(iso(hojeSP()) + 'T12:00:00Z'), -1));
  const { error } = await sb.from('custos_fixos').update({ fim: ontem }).eq('id', id);
  if (error) return alert('Não deu pra encerrar: ' + error.message);
  avisoCusto = 'Custo fixo encerrado. Ele para de contar a partir de hoje.';
  await verCustos();
}

/* Um cartão por fonte de tráfego. `pendente` marca a fonte que ainda não tem
   gasto no banco: os números vão zerados, mas tracejados, pra ninguém ler um
   zero de ausência como zero medido. */
function cartaoFonte(o) {
  const cor2 = v => v == null ? 'var(--ink-3)' : (v >= 0 ? 'var(--bom)' : 'var(--ruim)');
  const linha = (rot, val, cor) =>
    '<div><span>' + rot + '</span><b' + (cor ? ' style="color:' + cor + '"' : '') + '>' + val + '</b></div>';
  return '<div class="card fonte' + (o.pendente ? ' pendente' : '') + '">' +
    '<div class="cab">' + o.logo + '<span>' + o.nome + '</span>' +
      (o.pendente ? '<em>sem investimento registrado</em>' : '') + '</div>' +
    '<div class="rot">Faturamento</div>' +
    '<div class="grande">' + moeda(o.fat) + '</div>' +
    '<div class="antes">' +
      (o.anterior == null ? (o.pendente ? 'Nada a comparar' : 'Sem período anterior para comparar')
        : 'Anterior: ' + moeda(o.anterior) +
          (o.variacao == null ? ''
            : '<b style="color:' + cor2(o.variacao) + '"> ' + (o.variacao >= 0 ? '↗' : '↘') + ' ' +
              (o.variacao >= 0 ? '+' : '') + o.variacao.toFixed(1) + '%</b>')) +
    '</div>' +
    '<div class="linhas">' +
      linha('Gasto', moeda(o.gasto)) +
      linha('Lucro', moeda(o.lucro), o.pendente ? null : cor2(o.lucro)) +
      linha('ROAS', o.roas == null ? '—' : o.roas.toFixed(2) + 'x',
            o.pendente || o.roas == null ? null : o.roas >= 1 ? 'var(--bom)' : 'var(--ruim)') +
      linha('ROI', o.roi == null ? '—' : o.roi.toFixed(0) + '%', o.pendente ? null : cor2(o.roi)) +
    '</div>' +
    '<div class="pe"><span>Última venda</span><b>' + o.ultima + '</b></div>' +
  '</div>';
}

// ══════════════════════ VISÃO GERAL ══════════════════════
/* Não repete as outras abas: junta o dinheiro (que vive em Criativos) com a
   saúde do funil (que vive em Funil) e mostra a evolução dia a dia, que hoje
   não existia em lugar nenhum — as duas abas mostram total do período. */
async function verGeral() {
  const p = periodo();
  // fn_funil volta só pela conversão do funil — o resto do cartão dele saiu
  /* Janela imediatamente anterior, do mesmo tamanho, pra comparação. Com
     'Máximo' não existe anterior — não há início definido — e aí não compara. */
  const ant = (function () {
    if (!p.de || !p.ate) return null;
    const n = Math.round((Date.parse(p.ate) - Date.parse(p.de)) / 86400000) + 1;
    const fim = maisDias(new Date(p.de + 'T12:00:00Z'), -1);
    return { de: iso(maisDias(fim, -(n - 1))), ate: iso(fim) };
  })();
  /* Um recorte só pros dois lados. fn_diario filtra pelo que o robô gravou em
     criativos_diario.fonte (onde o anúncio rodou); fn_funil filtra por
     paginas.fonte (de onde a página recebe tráfego). Escolhendo TikTok, gasto,
     faturamento, visitantes e conversão passam a falar do MESMO recorte —
     antes a Visão Geral somava tudo sem opção. */
  const fo = fFonte || null;
  const [rD, rF, custos, rA, rP, rK, rH] = await Promise.all([
    sb.rpc('fn_diario', { p_de:p.de, p_ate:p.ate, p_fonte:fo }),
    sb.rpc('fn_funil',  { p_de:p.de, p_ate:p.ate, p_variantes:null, p_funil:null, p_fonte:fo }),
    // se a tabela de custos falhar, a Visão Geral não cai junto: o operacional
    // entra como zero. A aba Custos mostra o erro de verdade.
    custosDoPeriodo().catch(() => []),
    ant ? sb.rpc('fn_diario', { p_de:ant.de, p_ate:ant.ate, p_fonte:fo }) : Promise.resolve({ data:[] }),
    // um total por plataforma, pros cartões de fonte
    // Promise.resolve porque sb.rpc() devolve um objeto 'thenable', não uma
    // Promise: ele tem .then mas não tem .catch, e chamar .catch nele quebra.
    Promise.resolve(sb.rpc('fn_por_fonte', { p_de:p.de, p_ate:p.ate }))
      .catch(() => ({ data:[] })),
    /* Vendas de verdade, da Kiwify. Tolerante porque 16-vendas-dia.sql pode não
       ter rodado ainda — sem ela a Visão Geral volta ao número do Meta em vez
       de parar de abrir. */
    Promise.resolve(sb.rpc('fn_vendas_dia', { p_de:p.de, p_ate:p.ate }))
      .catch(() => ({ data:null })),
    Promise.resolve(sb.rpc('fn_vendas_hora', { p_de:p.de, p_ate:p.ate }))
      .catch(() => ({ data:[] })),
  ]);
  if (rD.error) throw rD.error;

  /* ── De onde vem cada número ──────────────────────────────────────────────
     GASTO e CHECKOUTS: sempre do Meta. Só ele sabe quanto cobrou e quantas
     vezes o checkout abriu.
     VENDAS e FATURAMENTO: da Kiwify, que conta o que foi PAGO. O pixel do Meta
     atribui menos do que aconteceu, e era isso que fazia venda sumir do dash.

     A exceção é o recorte por plataforma: a Kiwify não sabe de qual anúncio
     veio a venda. Filtrando por Meta ou TikTok, a pergunta passa a ser "como
     ESTA plataforma performou", e só a atribuição dela responde — então ali as
     vendas voltam a ser as do Meta, com aviso na tela. */
  const kiwify = (!fo && rK && !rK.error && rK.data) ? rK.data : null;
  const porDiaK = {};
  (kiwify || []).forEach(d => { porDiaK[d.data] = d; });

  /* O webhook só existe a partir desta data. Antes dela a Kiwify não tem
     registro nenhum — e ler zero ali diria "não vendeu nada" sobre meses que
     venderam. Então o corte é por DIA: antes, o número do Meta; a partir daqui,
     o da Kiwify. É a única leitura honesta enquanto o histórico não for
     importado.

     Havia um aviso na tela explicando isso. Saiu: com o filtro em "todos" ele
     aparecia SEMPRE, e aviso permanente para de ser lido — levando junto a
     capacidade de avisar quando algo realmente importar. O degrau na série
     também encolhe sozinho: em algumas semanas o trecho do Meta vira um rabo
     de dois dias. O fato está anotado no Histórico, que é onde ele dura. */
  const KIWIFY_DESDE = '2026-08-25';
  const usaKiwify = d => kiwify && d >= KIWIFY_DESDE;

  const dias = (rD.data || []).map(d => {
    if (!usaKiwify(d.data)) return d;
    const k = porDiaK[d.data];
    return { ...d, vendas: k ? Number(k.vendas) : 0,
             faturamento: k ? Number(k.faturamento) : 0,
             /* liquido vem da Kiwify e nao e calculado. semBump e o divisor do
                CPA: bump nao e cliente novo, e venda a mais pra quem ja era. */
             liquido: k ? Number(k.liquido) : null,
             semBump: k ? Number(k.vendas_sem_bump) : 0 };
  });
  /* Dia que teve venda na Kiwify e nenhum gasto no Meta não existe em fn_diario
     — venda orgânica, ou anúncio de outra plataforma. Sem isto ela sumiria. */
  if (kiwify) {
    const temNoDiario = new Set((rD.data || []).map(d => d.data));
    kiwify.filter(k => k.data >= KIWIFY_DESDE && !temNoDiario.has(k.data)).forEach(k => dias.push({
      data: k.data, gasto: 0, checkouts: 0,
      vendas: Number(k.vendas), faturamento: Number(k.faturamento),
      liquido: Number(k.liquido), semBump: Number(k.vendas_sem_bump) }));
    dias.sort((a, b) => a.data < b.data ? -1 : 1);
  }
  const tot = dias.reduce((a, d) => ({
    gasto: a.gasto + Number(d.gasto), fat: a.fat + Number(d.faturamento),
    vendas: a.vendas + Number(d.vendas), checkouts: a.checkouts + Number(d.checkouts),
    semBump: a.semBump + Number(d.semBump ?? d.vendas) }),
    { gasto:0, fat:0, vendas:0, checkouts:0, semBump:0 });
  /* ROAS continua só sobre anúncio — é a definição da métrica. O ROI, não:
     ele mede o retorno do dinheiro TODO que saiu, então soma o operacional.
     As taxas de checkout já saíam antes, dentro de liquido(). */
  /* O custo operacional é da operação inteira, não de uma plataforma. Com um
     recorte ativo ele continua entrando inteiro — ratear por gasto de mídia
     seria inventar um número que ninguém mediu. Quem lê o ROI filtrado precisa
     saber disso, então vira aviso no rodapé. */
  const custoOp = custos.reduce((a, c) => a + Number(c.valor), 0);
  const saiu    = tot.gasto + custoOp;
  /* Lucro = o que sobrou de verdade: faturamento MENOS as taxas do checkout
     (é o que liquido() faz), menos anúncio, menos operacional. É o numerador
     do ROI — os dois sempre têm o mesmo sinal.

     Somado dia a dia, e não sobre o total: cada venda usa a taxa que valia no
     dia dela, sem média nenhuma. Aqui dá pra ser exato porque a fn_diario já
     devolve a quebra por dia — nos cartões de plataforma e na tabela de
     criativos ela não existe, e lá a taxa sai ponderada. */
  /* Com a Kiwify, o líquido sai do valor real de cada pedido. Sem ela, cai na
     dedução antiga — que assume preço único e erra enquanto o teste de preço
     estiver no ar. */
  /* Kiwify: o liquido vem pronto. Celetus (antes de 25/08): nao existe
     my_commission, entao ali a estimativa por faixa de data e o que ha. */
  const liqTot = dias.reduce((a, d) => d.liquido != null
    ? a + d.liquido
    : a + liquido(d.faturamento, d.vendas, d.data), 0);
  const lucro   = liqTot - saiu;
  const roas = tot.gasto ? tot.fat / tot.gasto : null;
  const roi  = saiu ? ((liqTot - saiu) / saiu) * 100 : null;

  /* Conversão do funil = quem clicou em comprar na última tela ÷ visitantes.
     Vem do funil, não do Meta: é a mesma conta da aba Funil.
     Conversão do checkout = vendas ÷ visitas ao checkout, as duas do Meta. */
  const fun = rF.data;
  const convFunil = (fun && fun.visitantes) ? (fun.compraram / fun.visitantes) * 100 : null;
  const convCheck = tot.checkouts ? (tot.vendas / tot.checkouts) * 100 : null;
  const pct = v => v == null ? '—' : v.toFixed(1) + '%';
  /* CPA divide por venda SEM bump: bump nao e cliente adquirido, e conta-lo
     baratearia o custo de aquisicao sem ninguem ter sido adquirido. Por isso
     Vendas mostra 12 e o CPA divide por 10 — os dois estao certos, medindo
     coisas diferentes, e a dica da metrica diz isso. */
  const cpa    = tot.semBump ? saiu / tot.semBump : null;
  const ticket = tot.vendas ? tot.fat   / tot.vendas : null;   // quanto entra por venda
  /* ARPU aqui e receita por VISITANTE do quiz. Nao da pra fazer por cliente
     unico como no painel de referencia: nao temos identidade de comprador, so
     contagem de vendas — e por venda ja e o ticket medio, seria carta repetida. */
  const arpu = (fun && fun.visitantes) ? tot.fat / fun.visitantes : null;

  const fatAnterior = (rA.data || []).reduce((a, d) => a + Number(d.faturamento), 0);
  const varFat = (ant && fatAnterior > 0) ? ((tot.fat - fatAnterior) / fatAnterior) * 100 : null;
  /* Por dia, não por hora: a criativos_diario guarda um dia por anúncio, sem
     horário. 'há 4 min' precisaria do webhook do checkout. */
  const desdeQuando = (dia) => {
    const dif = Math.round((Date.parse(iso(hojeSP())) - Date.parse(dia)) / 86400000);
    return dif <= 0 ? 'hoje' : dif === 1 ? 'ontem' : 'há ' + dif + ' dias';
  };


  /* Com o filtro num dia só, busca o detalhe por hora — é o que dá pontos
     suficientes pra existir uma linha. Vindo vazio (dia fora da janela curta
     que o robô mantém), cai no diário. */
  let horas = null;
  if (dias.length === 1) {
    const rH = await sb.rpc('fn_horario', { p_de:dias[0].data, p_ate:dias[0].data });
    const lin = rH.error ? [] : (rH.data || []);
    if (lin.some(h => Number(h.gasto) > 0 || Number(h.faturamento) > 0)) horas = lin;
  }
  const tituloGrafico = horas ? 'Gasto e faturamento por hora' : 'Gasto e faturamento por dia';

  /* Um cartão por plataforma, com o que o banco tiver. As que não aparecem no
     retorno entram tracejadas e zeradas — ausência de dado, não resultado zero.
     Quando o robô do TikTok começar a gravar, o cartão dele vira real sozinho. */
  const PLATAFORMAS = [
    { chave:'meta',   nome:'Meta Ads',   logo:LOGO_META },
    { chave:'tiktok', nome:'TikTok Ads', logo:LOGO_TIKTOK },
  ];
  const porFonte = {};
  (rP && rP.data ? rP.data : []).forEach(f => { porFonte[String(f.fonte).toLowerCase()] = f; });

  /* Com um recorte escolhido, mostrar o cartão da outra plataforma zerado
     diria "TikTok não vendeu nada" quando na verdade ele foi filtrado fora. */
  const cartoesFonte = PLATAFORMAS.filter(pl => !fo || pl.chave === fo).map(pl => {
    const f = porFonte[pl.chave];
    if (!f || Number(f.gasto) <= 0) {
      return cartaoFonte({ logo:pl.logo, nome:pl.nome, fat:0, gasto:0, lucro:0,
                           roas:null, roi:null, ultima:'—',
                           anterior:null, variacao:null, pendente:true });
    }
    const g = Number(f.gasto), fa = Number(f.faturamento), vd = Number(f.vendas);
    /* O operacional não é por plataforma — ele é da operação inteira. Entra
       rateado pelo gasto de mídia, senão a soma dos cartões não fecha com o
       lucro lá de cima. */
    const parte = tot.gasto ? (g / tot.gasto) * custoOp : 0;
    const saiuAqui = g + parte;
    return cartaoFonte({
      logo:pl.logo, nome:pl.nome, fat:fa, gasto:g,
      lucro: liquido(fa, vd) - saiuAqui,
      roas: g ? fa / g : null,
      roi: saiuAqui ? ((liquido(fa, vd) - saiuAqui) / saiuAqui) * 100 : null,
      ultima: f.ultima_venda ? desdeQuando(f.ultima_venda) : 'sem venda no período',
      anterior: pl.chave === 'meta' && ant ? fatAnterior : null,
      variacao: pl.chave === 'meta' ? varFat : null,
    });
  }).join('');

  const cor = v => v == null ? 'var(--ink-3)' : (v >= 0 ? 'var(--bom)' : 'var(--ruim)');
  document.getElementById('conteudo').innerHTML =
    /* Arranjo da referência: coluna principal com os números de topo e o
       gráfico, e uma régua à direita com o resto das métricas empilhadas. */
    '<div class="geral">' +
      '<div class="col">' +
        '<div class="kpis topo">' +
          '<div class="kpi"><div class="lbl">' + ico('Faturamento') + '<span>Faturamento</span></div>' +
            '<div class="val" style="color:var(--bom)">' + moeda(tot.fat) + '</div></div>' +
          '<div class="kpi">' + rotulo('Valor líquido') +
            '<div class="val">' + moeda(liqTot) + '</div>' +
            '<div class="ap">' + (tot.fat ? '−' + moeda(tot.fat - liqTot) + ' de taxa' : '') + '</div></div>' +
          '<div class="kpi"><div class="lbl">' + ico('Lucro') + '<span>Lucro</span></div>' +
            '<div class="val" style="color:' + cor(lucro) + '">' + moeda(lucro) + '</div></div>' +
          '<div class="kpi"><div class="lbl">' + ico('ROAS') + '<span>ROAS</span></div><div class="val" style="color:' +
        (roas == null ? 'var(--ink-3)' : roas >= 1 ? 'var(--bom)' : 'var(--ruim)') + '">' +
        (roas == null ? '—' : roas.toFixed(2) + 'x') + '</div></div>' +
          '<div class="kpi"><div class="lbl">' + ico('ROI') + '<span>ROI</span></div><div class="val" style="color:' + cor(roi) + '">' +
        (roi == null ? '—' : roi.toFixed(0) + '%') + '</div></div>' +
          kpi('Vendas', tot.vendas) +
        '</div>' +
        '<div class="card"><div class="sec">' + ico('Gasto e faturamento por dia') + '<span>' + tituloGrafico + '</span></div>' +
          (dias.length ? '<div style="position:relative;height:400px;"><canvas id="cvGeral"></canvas></div>'
                       : '<div class="vazio">Sem dados no período.</div>') + '</div>' +
        '<div class="fontes">' + cartoesFonte + '</div>' +
        /* Depois dos cartões de plataforma: eles respondem "quanto entrou e de
           onde", que é a leitura de rotina. O mapa responde "quando vender
           mais", que é pergunta de quem já viu o resultado e está decidindo o
           próximo passo — vem depois na ordem de quem lê. */
        '<div class="card"><div class="sec">' + ico('Vendas por dia e hora') +
          '<span>Vendas por dia e hora</span></div>' +
          mapaHorario(rH && rH.data) + '</div>' +
      '</div>' +
      '<div class="regua">' +
        kpi('Gasto em anúncio', moeda(tot.gasto)) +
        kpi('Gasto operacional', moeda(custoOp)) +
        kpi('CPA', moeda(cpa)) +
        kpi('Ticket médio', moeda(ticket)) +
        kpi('ARPU', moeda(arpu)) +
        kpi('Checkouts', tot.checkouts) +
        kpi('Conversão do funil', pct(convFunil)) +
        kpi('Conversão do checkout', pct(convCheck)) +
        /* Ainda não é alimentada: o dado é do checkout e a ligação não existe.
           Mostra '—', nunca R$0,00 — zero se leria como 'nenhum reembolso',
           que é uma afirmação que não podemos fazer. */
        '<div class="kpi pendente" title="Ainda não conectado ao checkout">' +
          '<div class="lbl">' + ico('Reembolso') + '<span>Reembolso</span></div>' +
          '<div class="val">—</div>' +
          '<div class="ap">sem ligação com o checkout</div></div>' +
      '</div>' +
    '</div>' +
    /* Com recorte de plataforma ativo, o custo operacional continua entrando
       INTEIRO — ele é da operação, não de uma plataforma, e ratear por gasto de
       mídia inventaria um número que ninguém mediu. Quem lê Lucro e ROI
       filtrados precisa saber, senão lê como se fosse o custo daquela fatia. */
    /* Três recados possíveis, e cada um responde a uma pergunta que a pessoa
       faria olhando o número: de onde ele veio, e quanto dele é chute. */
    (kiwify
      ? ''
      : '<div class="aviso" style="margin-top:4px;">Vendas e faturamento vindo do <b>Meta</b>' +
        (fo ? ', porque há recorte de plataforma ativo — a Kiwify não sabe de qual anúncio veio a venda.'
            : ' — a leitura da Kiwify não respondeu. Confira se <code>16-vendas-dia.sql</code> foi rodado.') +
        ' O Meta conta só o que o pixel atribuiu, então este número tende a ser menor que o real.</div>') +
    (fo && custoOp > 0
      ? '<div class="aviso" style="margin-top:4px;">Recorte de <b>' +
        esc((OPC_FONTE.find(o => o[0] === fo) || [, fo])[1]) + '</b>. Gasto, faturamento, ' +
        'visitantes e conversão são só dessa plataforma, mas o custo operacional (' +
        moeda(custoOp) + ') entra inteiro — ele é da operação toda. Lucro e ROI ' +
        'aqui saem menores do que seriam se o operacional fosse rateado.</div>'
      : '');

  if (!dias.length) return;
  const ctx = document.getElementById('cvGeral').getContext('2d');
  const P = paleta();
  /* Sempre linha. Com um dia só o eixo vira HORA em vez de data: linha liga dois
     pontos, e um dia sozinho não tem o segundo — quebrado por hora, tem 24.
     As horas vêm de fn_horario, que o robô alimenta numa janela curta. */
  const rotulos = horas
    ? horas.map(h => String(h.hora).padStart(2,'0') + 'h')
    : dias.map(d => d.data.slice(8,10) + '/' + d.data.slice(5,7));
  const fat = horas ? horas.map(h => Number(h.faturamento)) : dias.map(d => Number(d.faturamento));
  const gas = horas ? horas.map(h => Number(h.gasto))       : dias.map(d => Number(d.gasto));
  const poucos = rotulos.length <= 2;
  graficos.push(new Chart(ctx, {
    type:'line',
    data:{ labels: rotulos,
      datasets:[
        { label:'Faturamento', data:fat, borderColor:P[2], backgroundColor:P[2] + '22',
          borderWidth:2, fill:true, tension:.35, pointRadius:poucos ? 5 : 0, pointHoverRadius:5 },
        { label:'Gasto', data:gas, borderColor:P[1],
          borderWidth:2, fill:false, tension:.35, pointRadius:poucos ? 5 : 0, pointHoverRadius:5 } ] },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:true, position:'bottom', labels:{ color:tok('--ink-2'), boxWidth:12, boxHeight:2, padding:14 } },
        tooltip:{ callbacks:{ label:c => c.dataset.label + ': ' + moeda(c.parsed.y) } } },
      /* Grade nos DOIS sentidos, como na referência: a vertical é o que deixa
         ler a data de um pico sem escorregar de coluna. Sem borda de eixo — a
         própria grade delimita a área. */
      /* Começa no zero: com um dia só o eixo ia de R$50 a R$80 e a diferença
         entre gasto e faturamento parecia enorme. */
      scales:{ y:{ beginAtZero:true, ticks:{ color:tok('--ink-3'), callback:v => 'R$' + Math.round(v) },
                   border:{ display:false }, grid:{ color:tok('--linha'), drawTicks:false } },
               x:{ offset: poucos, ticks:{ color:tok('--ink-3'), maxTicksLimit:12 },
                   border:{ display:false }, grid:{ color:tok('--linha'), drawTicks:false } } } }
  }));
}

// ══════════════════════ FUNIL ══════════════════════
function calcFunil(d) {
  const base = (d.etapas.find(e => e.n === 1) || {}).sessoes || 0;
  const ret = n => base ? Math.round(((d.etapas.find(e => e.n === n) || {}).sessoes / base) * 1000) / 10 : 0;
  let maiorQueda = { tela: 0, drop: 0 }; const alertas = [];
  const linhas = d.etapas.map(e => {
    const r = ret(e.n), rAnt = e.n > 1 ? ret(e.n - 1) : 100;
    const drop = e.n > 1 ? Math.round((rAnt - r) * 10) / 10 : 0;
    const corpo = e.n >= BODY_INI && e.n <= BODY_FIM, alerta = corpo && drop > THRESH;
    if (corpo && drop > maiorQueda.drop) maiorQueda = { tela: e.n, drop };
    if (alerta) alertas.push(e.n);
    return { n: e.n, nome: NOMES[e.n - 1] || ('Tela ' + e.n), ret: r, drop, alerta, pitch: e.n >= PITCH };
  });
  return { linhas, maiorQueda, alertas,
    pctFim: d.visitantes ? Math.round((d.fim / d.visitantes) * 1000) / 10 : 0,
    pctCompra: d.visitantes ? Math.round((d.compraram / d.visitantes) * 1000) / 10 : 0 };
}

async function verFunil() {

  VARIANTES = rV.data || [];
  Object.keys(marcadas).forEach(k => { if (!VARIANTES.some(v => v.variante === k)) delete marcadas[k]; });
  const sel = selecionadas();
  document.getElementById('lblVar').textContent = !sel.length ? 'Todas as URLs'

  pintarVars();

  /* 1 marcada filtra o funil. 2 ou mais viram séries pra comparar — uma chamada
     por variante, porque passar todas juntas somaria em vez de separar. */
  const alvos = sel.length >= 2 ? sel.slice(0, MAX_LINHAS) : [sel[0] || null];

  const series = res.map((r, i) => ({ nome: alvos[i], dados: r.data, calc: calcFunil(r.data) }));

      '<div class="lin' + (l.alerta ? ' alerta' : '') + (l.pitch ? ' pitch' : '') + '">' +

        '<span class="barra"><i style="width:' + l.ret + '%;background:' + (l.alerta ? '#d84a3a' : l.pitch ? '#9a9a9a' : '#6b9e7e') + ';"></i></span>' +
        '<span class="pct">' + l.ret + '%</span>' +
        '<span class="queda' + (l.alerta ? ' on' : '') + '">' + (l.n > 1 && l.drop > 0 ? (l.alerta ? '▼ ' : '-') + l.drop + ' pts' : '') + '</span>' +
      '</div>').join('') +
      (comparando ? '<div class="nota">Esta lista e os KPIs mostram só ' + esc(rotulo(series[0].nome)) + '. A comparação está no gráfico e no quadro acima.</div>' : '') +
    '</div>';

  const ctx = document.getElementById('cv').getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 280);
  g.addColorStop(0, 'rgba(53,208,127,0.42)'); g.addColorStop(1, 'rgba(53,208,127,0.02)');
  const CORES_L = paleta();
  const datasets = comparando
    ? series.map((s, i) => ({ label: rotulo(s.nome), data: s.calc.linhas.map(l => l.ret),
        borderColor: CORES_L[i % CORES_L.length], borderWidth:2, fill:false, tension:.4, pointRadius:0 }))
    : [{ data: A.linhas.map(l => l.ret), borderColor:'#35d07f', borderWidth:2, backgroundColor:g, fill:true, tension:.4, pointRadius:0, pointHoverRadius:5 }];
  graficos.push(new Chart(ctx, { type:'line', data:{ labels:A.linhas.map(l => l.n), datasets },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:comparando, labels:{ color:'#cfe5d8', boxWidth:12, boxHeight:2 } },
        tooltip:{ callbacks:{ title:t => 'Tela ' + A.linhas[t[0].dataIndex].n + ' — ' + A.linhas[t[0].dataIndex].nome,
          label:c => (comparando ? c.dataset.label + ': ' : '') + c.parsed.y + '% ainda no funil' } } },
      scales:{ y:{ min:0, max:100, ticks:{ color:'#6b8f7b', callback:v => v + '%' }, grid:{ color:tok('--curva-grade') } },
               x:{ ticks:{ color:'#6b8f7b', maxTicksLimit:10 }, grid:{ display:false } } } } }));
}

function cardComparacao(series, rot) {
  const CORES_L = paleta();
  const t1 = s => (s.calc.linhas[1] || {}).ret || 0;
  /* só destaca quem for maior que TODOS os outros; empate no topo não premia ninguém */
  const topo = vals => { const m = Math.max(...vals); return (m > 0 && vals.filter(x => x === m).length === 1) ? m : -1; };
  const best = { t1: topo(series.map(t1)), fim: topo(series.map(s => s.calc.pctFim)), cpr: topo(series.map(s => s.calc.pctCompra)) };
  const cel = (v, b) => '<td class="num"' + (v === b ? ' style="color:#1a7a4f;font-weight:700"' : '') + '>' + v + '%</td>';
  const baixas = series.filter(s => s.dados.visitantes < MIN_SESSOES).map(s => rot(s.nome) + ' (' + s.dados.visitantes + ')');
  return '<div class="card"><div class="sec">' + ico('Comparação de variantes') + '<span>Comparação de variantes</span></div>' +
    '<table class="tb"><tr><th>Variante</th><th class="num">Visitantes</th><th class="num">Passou da tela 1</th>' +
    '<th class="num">Chegou ao fim</th><th class="num">Clicou em comprar</th></tr>' +
    series.map((s, i) =>
      '<tr><td class="nm"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:' +
      CORES_L[i % CORES_L.length] + '"></i><b>' + esc(rot(s.nome)) + '</b></td>' +
      '<td class="num">' + s.dados.visitantes + '</td>' +
      cel(t1(s), best.t1) + cel(s.calc.pctFim, best.fim) + cel(s.calc.pctCompra, best.cpr) + '</tr>').join('') +
    '</table>' +
    (baixas.length ? '<div class="aviso">⚠ Volume baixo em <b>' + esc(baixas.join(', ')) +
      '</b>. Abaixo de ' + MIN_SESSOES + ' sessões por variante a diferença ainda pode ser sorte.</div>' : '') + '</div>';
}

// ══════════════════════ CRIATIVOS ══════════════════════
function barra(id, itens, campo, cor, ehMoeda, asc) {
  itens = itens.filter(r => r[campo] != null && !isNaN(r[campo]) && r[campo] > 0)
               .sort((a, b) => asc ? a[campo] - b[campo] : b[campo] - a[campo]).slice(0, 8);
  const el = document.getElementById(id);
  if (!itens.length) { el.parentNode.innerHTML = '<div class="vazio">Sem dados ainda</div>'; return; }
  /* Altura acompanha a quantidade de barras. Com container fixo, um único
     criativo virava um bloco gigante ocupando 290px — a barra comunicava o
     tamanho da caixa, não o valor. */
  el.parentNode.style.height = Math.max(96, 46 + itens.length * 34) + 'px';
  const fmt = v => ehMoeda ? 'R$' + Number(v).toFixed(2) : Number(v).toFixed(1) + '%';
  /* O corte tem que sair da largura REAL da faixa, não de um número fixo: com 4
     cartões numa linha a faixa cai pra ~155px, e 26 caracteres não cabem ali —
     era isso que fazia o nome vazar por cima do gráfico. Medido no canvas, não
     estimado por média de caractere. */
  /* O || 380 já cobre a primeira renderização, quando a faixa do grid ainda mede
     zero. O piso alto que estava aqui comia 130px de um cartão de 246 e sobravam
     48px pra barra — a diferença entre os criativos sumia. */
  const caixa = el.parentNode.clientWidth || el.clientWidth || 380;
  const larguraFaixa = Math.min(190, Math.max(72, caixa * 0.36));
  const med = el.getContext('2d');
  med.font = '12.5px Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif';
  const cabe = larguraFaixa - 16;
  /* O selo vai DEPOIS do nome, então a largura dele tem que ser reservada antes
     do corte — senão ele fica no fim da string e é a primeira coisa a sumir. */
  const curto = (txt, selo) => {
    const sufixo = selo ? ' ' + selo : '';
    const espaco = cabe - (selo ? med.measureText(sufixo).width : 0);
    let t = String(txt || '');
    if (med.measureText(t).width <= espaco) return t + sufixo;
    while (t.length > 1 && med.measureText(t + '…').width > espaco) t = t.slice(0, -1);
    return t.trimEnd() + '…' + sufixo;
  };
  const valores = itens.map(r => Number(r[campo]));
  /* O rótulo fica FORA da barra, e o espaço dele é reservado como padding em
     PIXELS, não esticando o eixo. Esticar comprimia as barras: com 4 cartões
     numa linha o eixo ia a R$215 pra um máximo de R$119,64 e a maior barra
     ocupava metade da faixa, achatando a diferença entre elas. */
  const maxV = Math.max(...valores);
  const fonteNome = med.font;                 // curto() ainda vai usar, lá embaixo
  med.font = '600 12.5px Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  const maiorRot = Math.max(...valores.map(v => med.measureText(fmt(v)).width));
  med.font = fonteNome;
  const folga = Math.ceil(maiorRot) + 10;
  const teto = maxV * 1.02;
  graficos.push(new Chart(el, { type:'bar', plugins:[rotuloValor],
    data:{ labels: itens.map(r => { const m = medalha(r.vendas, r.roas || 0);
                                    return curto(r.anuncio, m ? m.selo : ''); }),
      datasets:[{ data: valores, backgroundColor:cor, borderRadius:4,
                  barPercentage:.72, maxBarThickness:26 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:folga, bottom:2 } },
      plugins:{ legend:{ display:false }, rotuloValor:{ fmt }, tooltip:{ callbacks:{ label:c => fmt(c.parsed.x) } } },
      /* Sem grade vertical aqui: cada barra já tem o valor escrito do lado, então
         a linha não ajuda a ler nada — só cruza o rótulo e embaralha o número.
         Os ticks ficam, com folga pra não encostar na base das barras. */
      scales:{ x:{ max: teto, ticks:{ font:{ size:12 }, color:tok('--ink-3'), maxTicksLimit:5, padding:8,
                     callback:v => ehMoeda ? 'R$' + Math.round(v) : Math.round(v) + '%' },
                   border:{ display:false }, grid:{ display:false } },
               // a faixa do nome nunca passa de 42% do cartão, senão sobra pouco pra barra
               y:{ afterFit(sc) { sc.width = larguraFaixa; },
                   ticks:{ font:{ size:12.5 }, color:tok('--ink-2'), crossAlign:'far', autoSkip:false },
                   border:{ display:false }, grid:{ display:false } } } } }));
}

/* Aceita as duas versões de fn_criativos: a nova, com filtro de plataforma, e a
   antiga sem ele. Sem isso, a ordem entre rodar o SQL e publicar o dashboard
   importaria — e quem publicasse primeiro deixaria a aba quebrada no meio. */
async function criativosDoPeriodo(p) {
  const r = await sb.rpc('fn_criativos', { p_de:p.de, p_ate:p.ate, p_fonte: fFonte || null });
  if (!r.error) return r;
  return await sb.rpc('fn_criativos', { p_de:p.de, p_ate:p.ate });
}

function agrupar(rows, campo) {
  const g = {};
  rows.forEach(r => {
    const k = String(r[campo] || '(sem etiqueta)');
    if (!g[k]) g[k] = { nome:k, n:0, gasto:0, checkouts:0, vendas:0, fat:0 };
    g[k].n++; g[k].gasto += r.gasto; g[k].checkouts += Number(r.checkouts || 0);
    g[k].vendas += r.vendas; g[k].fat += r.faturamento;
  });
  return Object.values(g).map(x => ({ ...x,
    custoCheckout: x.checkouts ? x.gasto / x.checkouts : null,
    custoVenda: x.vendas ? x.gasto / x.vendas : null,
    roas: x.gasto ? x.fat / x.gasto : null,
    roi: x.gasto ? ((liquido(x.fat, x.vendas) - x.gasto) / x.gasto) * 100 : null }))
    .sort((a, b) => (a.custoVenda ?? 1e9) - (b.custoVenda ?? 1e9));
}

/* Cada agrupamento tem o seu próprio seletor de status, como no dashboard antigo:
   dá pra ver "por formato só o que está ativo" sem mexer no filtro geral. */

    '</div></div>' +
    (gs.length ? '<div class="tbwrap"><table class="tb"><tr><th>' + titulo.replace('Por ', '') + '</th>' +
      ['Criativos','Gasto','Checkouts','R$/Check','Vendas','R$/Venda','Faturamento','ROAS'].map(h => '<th class="num">' + h + '</th>').join('') + '</tr>' +
      gs.map(g => '<tr><td class="nm">' + esc(g.nome) + '</td><td class="num">' + g.n + '</td>' +

        '<td class="num">' + moeda(g.custoCheckout) + '</td><td class="num">' + g.vendas + '</td>' +
        '<td class="num">' + moeda(g.custoVenda) + '</td><td class="num">' + moeda(g.fat) + '</td>' +
        '<td class="num" style="color:' + (g.roas >= 1 ? '#2e7d52' : '#c0392b') + '">' + (g.roas == null ? '—' : g.roas.toFixed(2) + 'x') + '</td>' +
        '</tr>').join('') +
      '</table></div>' : '<div class="vazio">Nenhum criativo com esse filtro.</div>') + '</div>';
}

async function verCriativos() {
  const p = periodo();
  // o critério vem junto: se ele mudar, as medalhas desta renderização já obedecem
  const [{ data, error }] = await Promise.all([
    criativosDoPeriodo(p),
    carregarMedalhas(),
  ]);
  if (error) throw error;

  CRIATIVOS = (data || []).map(r => {
    const impr = Number(r.impressoes) || 0, gasto = Number(r.gasto) || 0;
    const v3s = Number(r.v3s) || 0, vendas = Number(r.vendas) || 0, valor = Number(r.valor) || 0;
    const fat = valor > 0 ? valor : vendas * PRECO_VENDA;
    return { ...r, gasto, impressoes: impr, vendas,
      ctr: impr ? (Number(r.clicks) / impr) * 100 : null,
      /* hookRate, não 'hook': a etiqueta que você escreve também se chama hook,
         e o spread acima traz ela do banco. Nomear igual apagava o texto e
         deixava o número aparecer na coluna Hook da tabela. */
      hookRate: impr && v3s ? (v3s / impr) * 100 : null,
      hold: v3s ? (Number(r.thruplay) / v3s) * 100 : null,   // ThruPlay ÷ plays de 3s
      views25: impr ? (Number(r.p25) / impr) * 100 : null,
      custoVenda: vendas ? gasto / vendas : null,
      custoCheckout: Number(r.checkouts) ? gasto / Number(r.checkouts) : null,
      faturamento: fat, roas: gasto ? fat / gasto : null,
      roi: gasto ? ((liquido(fat, vendas) - gasto) / gasto) * 100 : null };
  }).sort((a, b) => {
    if ((a.gasto > 0) !== (b.gasto > 0)) return a.gasto > 0 ? -1 : 1;
    if (a.gasto > 0 && a.roi !== b.roi) return (b.roi ?? -1e9) - (a.roi ?? -1e9);
    return String(a.anuncio).localeCompare(String(b.anuncio));
  });

  pintarStatus();
  const stAtual = fStatus;
  let vis = CRIATIVOS;
  if (stAtual) vis = vis.filter(r => normStatus(r.status) === stAtual);
  Object.keys(filtroEtq).forEach(c => { if (filtroEtq[c]) vis = vis.filter(r => String(r[c] || '').trim() === filtroEtq[c]); });

  const tot = vis.reduce((a, r) => ({ gasto:a.gasto + r.gasto, checkouts:a.checkouts + Number(r.checkouts || 0),
    vendas:a.vendas + r.vendas, fat:a.fat + r.faturamento }), { gasto:0, checkouts:0, vendas:0, fat:0 });
  const roasG = tot.gasto ? tot.fat / tot.gasto : null;
  const contados = CRIATIVOS.filter(r => !/Teste A\/B/i.test(r.campanha || '')).length;

  document.getElementById('conteudo').innerHTML =
    '<div class="kpis">' + kpi('Gasto em anúncio', moeda(tot.gasto)) + kpi('Checkouts', tot.checkouts) +
      kpi('Vendas', tot.vendas) + kpi('Faturamento', moeda(tot.fat)) +
      kpi('ROAS', roasG == null ? '—' : roasG.toFixed(2) + 'x') +
      '<div class="kpi selo-crt"><div class="lbl">' + ico('Criativos') + '<span>Criativos</span></div>' +
        '<div class="val">' + contados + '/' + META_CRIATIVOS + '</div></div>' + '</div>' +
    '<div class="charts">' +
      ['Custo por venda|chVenda','Custo por checkout|chCheck','Hook rate|chHook','Hold rate|chHold']
        .map(x => { const [t, id] = x.split('|');
          return '<div class="cchart"><div class="ttl">' + ico(t) + '<span>' + t + '</span></div><div class="cv"><canvas id="' + id + '"></canvas></div></div>'; }).join('') +
    '</div>' +
    '<div class="card"><div class="cabsec"><div class="sec" style="margin:0;">Análise por grupo</div>' +
      '<div style="display:flex;gap:10px;">' +
        '<div class="grp"><button class="rangeBtn" id="btnPieMet" onclick="abrir(\'painelPieMet\')"><span id="lblPieMet"></span><span class="car">▼</span></button>' +
          '<div class="rangePanel" id="painelPieMet" style="display:none;"><div class="presets only" id="listaPieMet"></div></div></div>' +
        '<div class="grp"><button class="rangeBtn" id="btnPieGrp" onclick="abrir(\'painelPieGrp\')"><span id="lblPieGrp"></span><span class="car">▼</span></button>' +
          '<div class="rangePanel" id="painelPieGrp" style="display:none;"><div class="presets only" id="listaPieGrp"></div></div></div>' +
      '</div></div>' +
      '<div class="pieWrap"><canvas id="pie"></canvas></div><div class="nota" id="pieNota"></div></div>' +
    '<div class="card"><div class="cabsec"><div class="sec" style="margin:0;">Todos os criativos</div>' +
      '<div class="grp"><button class="btn" id="btnEtq" onclick="togglePainel()">Filtrar por etiqueta</button>' +
        '<div class="painel" id="painelEtq" style="display:none;">' +
          '<div class="etq" id="etqCampos"></div>' +
          '<div class="pfoot"><button class="limpar" onclick="limparEtq()">Limpar tudo</button>' +
          '<button class="prim" onclick="togglePainel()">Fechar</button></div>' +
        '</div></div></div>' +
      '<div class="nota" style="margin:-4px 0 10px;">' + vis.length + ' de ' + CRIATIVOS.length + ' criativos · clique na linha pra editar as etiquetas</div>' +
      (vis.length ? '<div class="tbwrap"><table class="tb"><tr>' +
        ['Anúncio','Status','Formato','Formato de conteúdo','Ângulo','Hook','Headline','Emoção','Amplificador','Fatia','Segmentação','Prova'].map(h => '<th>' + h + '</th>').join('') +
        ['Gasto','CTR','Hook rate','Hold rate','Checkouts','R$/Check','Vendas','R$/Venda','Faturamento','ROAS'].map(h => '<th class="num">' + h + '</th>').join('') + '</tr>' +
        vis.map(r => { const m = medalha(r.vendas, r.roas || 0);
          const alvo = JSON.stringify(r.anuncio).replace(/"/g,'&quot;');
          return '<tr><td class="nm" title="Editar etiquetas" onclick="editar(' + alvo + ')">' +
            '<span class="nmw">' +
              '<span class="txt">' + esc(r.anuncio) + '</span>' +
              (m ? '<span class="selo" title="' + m.nome + '">' + m.selo + '</span>' : '') +
              '<span class="edit" aria-hidden="true">' + SVG('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>') + '</span>' +
            '</span>' +
          '</td>' +
            ['status','formato','formato_conteudo','angulo','hook','headline','emocao','amplificador','fatia','segmentacao','prova']
              .map(c => '<td title="' + esc(r[c] || '') + '">' + esc(r[c] || '—') + '</td>').join('') +
            '<td class="num">' + moeda(r.gasto) + '</td><td class="num">' + pct(r.ctr) + '</td>' +
            '<td class="num">' + pct(r.hookRate) + '</td><td class="num">' + pct(r.hold) + '</td>' +
            '<td class="num">' + (r.checkouts || 0) + '</td><td class="num">' + moeda(r.custoCheckout) + '</td>' +
            '<td class="num">' + r.vendas + '</td><td class="num">' + moeda(r.custoVenda) + '</td>' +
            '<td class="num">' + (r.faturamento ? moeda(r.faturamento) : '—') + '</td>' +
            '<td class="num" style="color:' + (r.roas >= 1 ? '#2e7d52' : '#c0392b') + '">' + (r.roas == null ? '—' : r.roas.toFixed(2) + 'x') + '</td></tr>';
        }).join('') + '</table></div>' : '<div class="vazio">Nenhum criativo neste período.</div>') +
    '</div>' +
    tabelaGrupo('Por formato', 'formato', vis) +
    tabelaGrupo('Por ângulo', 'angulo', vis) +
    tabelaGrupo('Por emoção', 'emocao', vis) +
    /* No rodapé, fora dos cartões: é referência, não dado. Dentro da tabela ela
       disputava atenção com os números. */
    '<div class="medalhas" onclick="editarMedalhas()" title="Clique para mudar o critério">' +
      '<span class="tt">Medalhas</span>' +
      MEDALHAS.map(m => '<span>' + m.selo + ' ' + m.nome + ' · ' + m.vendas + '+ vendas · ' +
                        m.roas.toFixed(2).replace('.', ',') + 'x</span>').join('') +
      '<span class="mudar">mudar critério</span>' +
    '</div>';

  ['formato','angulo','emocao'].forEach(pintarStatusGrupo);
  montarFiltroEtq();   // o painel só existe depois que o card foi desenhado

  barra('chVenda', vis, 'custoVenda',    paleta()[0], true,  true);
  barra('chCheck', vis, 'custoCheckout',  paleta()[1], true,  true);
  barra('chHook',  vis, 'hookRate',       paleta()[2], false, false);
  barra('chHold',  vis, 'hold',           tok('--s7'), false, false);

  pintarPie(vis);
  desenharPie(vis);
}

let pieChart = null, pieMet = 'vendas', pieGrp = 'angulo';
const OPC_PIE_MET = [['roas','ROAS'],['cpa','CPA (custo por venda)'],['gasto','Gasto'],
                     ['vendas','Vendas'],['faturamento','Faturamento']];
/* Vendas é contagem, não dinheiro — formatar com moeda() daria 'R$34.00'. */
const fmtPie = (met, v) => met === 'roi'  ? v.toFixed(0) + '%'
                         : met === 'roas' ? v.toFixed(2) + 'x'
                         : met === 'vendas' ? String(Math.round(v))
                         : moeda(v);

/* Estes dois também eram select nativo — mesmo componente dos filtros da barra. */
function pintarPie(rows) {
  pintarLista('listaPieMet','btnPieMet','lblPieMet', OPC_PIE_MET, pieMet,
    v => { pieMet = v; setTimeout(() => { pintarPie(rows); desenharPie(rows); }, 0); return false; });
  pintarLista('listaPieGrp','btnPieGrp','lblPieGrp',
    ETIQUETAS.filter(e => e[0] !== 'status'), pieGrp,
    v => { pieGrp = v; setTimeout(() => { pintarPie(rows); desenharPie(rows); }, 0); return false; });
  // aqui o botão sempre tem escolha, então nunca fica com o contorno de "ativo"
  document.getElementById('btnPieMet').className = 'rangeBtn';
  document.getElementById('btnPieGrp').className = 'rangeBtn';
}

function desenharPie(rows) {
  const met = pieMet, campo = pieGrp;
  // o bloco pode ter sido substituído por número/aviso na renderização anterior
  const wrap = document.querySelector('.pieWrap');
  if (wrap && !document.getElementById('pie')) wrap.innerHTML = '<canvas id="pie"></canvas>';
  const gs = agrupar(rows, campo);
  const val = g => met === 'roi' ? g.roi : met === 'roas' ? g.roas : met === 'cpa' ? g.custoVenda
                 : met === 'gasto' ? g.gasto : met === 'vendas' ? g.vendas : g.fat;
  const validos = gs.filter(g => val(g) != null && val(g) > 0);
  /* Donut só lê bem até 6 fatias; o excedente vira "Outros" em vez de gerar
     mais uma cor — a 7ª seria indistinguível das anteriores sob daltonismo. */
  const CORES = paleta();
  if (pieChart) { try { pieChart.destroy(); } catch (e) {} }
  const nota = document.getElementById('pieNota');
  if (!validos.length) {
    document.getElementById('pie').parentNode.innerHTML = '<div class="vazio" style="text-align:center;">Sem dados para essa combinação.</div>';
    nota.textContent = ''; return;
  }
  const fora = gs.filter(g => val(g) == null || val(g) <= 0).map(g => g.nome);
  const ord = validos.slice().sort((a, b) => val(b) - val(a));
  const top = ord.slice(0, 6), resto = ord.slice(6);
  const fatias = resto.length
    ? [...top, { nome: 'Outros (' + resto.length + ')', _v: resto.reduce((a, g) => a + val(g), 0) }]
    : top;
  const valorDe = g => g._v !== undefined ? g._v : val(g);
  nota.textContent = [
    fora.length ? 'Fora da pizza (sem valor positivo): ' + fora.join(', ') + '.' : '',
    resto.length ? '"Outros" reúne ' + resto.map(g => g.nome).join(', ') + '.' : ''
  ].filter(Boolean).join(' ');
  const alvo = document.getElementById('pie');
  pieChart = new Chart(alvo, {
    type:'doughnut',
    data:{ labels: fatias.map(g => g.nome),
      datasets:[{ data: fatias.map(valorDe), backgroundColor: CORES, borderWidth:2, borderColor:tok('--surface') }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'right', labels:{ font:{ size:13 }, boxWidth:15, padding:12, color:tok('--ink-2') } },
        tooltip:{ callbacks:{ label:c => c.label + ': ' + fmtPie(met, c.parsed) } } } } });
  graficos.push(pieChart);
}

// ── filtro por etiqueta ──
function montarFiltroEtq() {
  const el = document.getElementById('etqCampos');
  if (!el) return;
  const nAtivos = Object.values(filtroEtq).filter(Boolean).length;
  const btn = document.getElementById('btnEtq');
  btn.textContent = nAtivos ? (nAtivos + (nAtivos > 1 ? ' filtros' : ' filtro')) : 'Filtrar por etiqueta';
  btn.className = 'btn' + (nAtivos ? ' on' : '');
  el.innerHTML = ETIQUETAS.filter(e => e[0] !== 'status').map(([c, lbl]) => {
    const vals = [...new Set(CRIATIVOS.map(r => String(r[c] || '').trim()).filter(Boolean))].sort();
    if (!vals.length) return '';
    return '<label>' + lbl + '<select data-campo="' + c + '"><option value="">Todos</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (filtroEtq[c] === v ? ' selected' : '') + '>' +
        esc(v.length > 30 ? v.slice(0, 30) + '…' : v) + '</option>').join('') + '</select></label>';
  }).join('');
  el.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
    filtroEtq[s.getAttribute('data-campo')] = s.value; verCriativos();
  }));
}
const togglePainel = () => abrir('painelEtq');
const limparEtq = () => { filtroEtq = {}; fStatus = ATIVO; verCriativos(); };

// ── edição de etiquetas ──
function editar(anuncio) {
  const r = CRIATIVOS.find(x => x.anuncio === anuncio); if (!r) return;
  document.getElementById('modal').innerHTML =
    '<div class="modal" onclick="if(event.target===this)fecharModal()"><div class="box">' +
      '<h2>Editar etiquetas</h2><div class="qual">' + esc(anuncio) + '</div>' +
      '<div id="edErro" class="erro" style="display:none;"></div>' +
      '<div class="etq">' + ETIQUETAS.map(([c, lbl]) =>
        '<label>' + lbl + '<input id="ed_' + c + '" value="' + esc(r[c] || '') + '"/></label>').join('') +
        '<label>Ajuste de vendas<input id="ed_vendas_ajuste" type="number" value="0"/></label>' +
        '<label>Ajuste de valor (R$)<input id="ed_valor_ajuste" type="number" step="0.01" value="0"/></label>' +
      '</div>' +
      '<div class="nota">Os ajustes somam ao que o Meta reportou — use quando houver venda que ele não marcou.</div>' +
      '<div class="pfoot"><button class="limpar" onclick="fecharModal()">Cancelar</button>' +
      '<button class="prim" id="edSalvar" onclick="salvarEdicao(' + JSON.stringify(anuncio).replace(/"/g,'&quot;') + ')">Salvar</button></div>' +
    '</div></div>';
}
const fecharModal = () => { document.getElementById('modal').innerHTML = ''; };

async function salvarEdicao(anuncio) {
  const btn = document.getElementById('edSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  const campos = {};
  ETIQUETAS.forEach(([c]) => { campos[c] = document.getElementById('ed_' + c).value.trim() || null; });
  campos.vendas_ajuste = Number(document.getElementById('ed_vendas_ajuste').value) || 0;
  campos.valor_ajuste  = Number(document.getElementById('ed_valor_ajuste').value) || 0;
  const { error } = await sb.from('criativos').update(campos).eq('anuncio', anuncio);
  btn.disabled = false; btn.textContent = 'Salvar';
  if (error) { const e = document.getElementById('edErro'); e.textContent = 'Não salvou: ' + error.message; e.style.display = 'block'; return; }
  fecharModal(); await verCriativos();
}

// ══════════════════════ LOGIN ══════════════════════
async function mostrarConforme(sessao) {
  document.getElementById('telaLogin').style.display = sessao ? 'none' : 'block';
  document.getElementById('telaDash').style.display  = sessao ? 'block' : 'none';
  if (sessao) await carregar();
}
document.getElementById('formLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('btnEntrar'), err = document.getElementById('loginErro');
  btn.disabled = true; btn.textContent = 'Entrando…'; err.style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(), password: document.getElementById('senha').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { err.textContent = 'E-mail ou senha incorretos.'; err.style.display = 'block'; return; }
  await mostrarConforme(data.session);
});
async function sair() { await sb.auth.signOut(); location.reload(); }

/* Fecha os painéis ao clicar fora. O isConnected não é detalhe: clicar num dia
   do calendário redesenha a grade, e o elemento clicado sai do DOM antes do
   clique chegar aqui. Órfão, ele não tem mais o .grp acima — o código lia isso
   como "clicou fora" e fechava o painel no primeiro clique, deixando impossível
   escolher a segunda data. */
document.addEventListener('click', ev => {
  if (!ev.target.isConnected) return;
  if (!ev.target.closest('.grp')) fecharPaineis();
});
pintarPresets();
aplicarTema(localStorage.getItem('cf_tema') || 'auto');
// sempre trilho ao abrir; no celular 'mini' é o estado fechado da gaveta
localStorage.removeItem('cf_lateral2');
localStorage.removeItem('cf_lateral');
document.getElementById('lateral').classList.add('mini');
document.querySelector('.main').classList.add('recuado');
aba = localStorage.getItem('cf_aba') || 'geral';
sb.auth.getSession().then(({ data }) => {
  if (data.session) trocarAbaSilenciosa(aba);
  mostrarConforme(data.session);
});
function trocarAbaSilenciosa(a) {
  ['geral','funil','criativos','custos'].forEach(k =>
    document.getElementById('nav' + k[0].toUpperCase() + k.slice(1)).className = k === a ? 'on' : '');
  document.getElementById('tituloPagina').textContent = TITULOS[a];
  document.querySelectorAll('.soFunil').forEach(e => e.style.display = a === 'funil' ? '' : 'none');
  document.querySelectorAll('.soCriativos').forEach(e => e.style.display = a === 'criativos' ? '' : 'none');
}
