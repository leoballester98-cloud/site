<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Dashboard — Ciclo Fértil</title>
<link rel="icon" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Tokens ────────────────────────────────────────────────────────────────
   Tema claro é o padrão; escuro tem passos PRÓPRIOS, não o claro invertido —
   as duas paletas de série foram validadas separadamente contra o próprio
   fundo (scripts/validate_palette.js da skill dataviz).
   Três escopos: :root = claro · @media = automático pelo sistema ·
   [data-theme] = a escolha do usuário, que vence os dois. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f8f7; --linha:#e6e9e7;
  --ink:#1a1a1a; --ink-2:#5b6560; --ink-3:#8a8a8a;
  --marca:#1a7a4f; --marca-fraca:#eef5f1;
  --lateral:#ffffff; --lateral-ink:#5b6560;
  --curva-bg:#0d1512; --curva-ink:#e8f3ec; --curva-grade:rgba(255,255,255,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  /* verde de destaque. No escuro é o verde da Supabase (#3ECF8E) exato: 9.1:1
     sobre o fundo. No claro ele dá 2.0:1 sobre branco — ilegível — então vai o
     passo escuro da mesma família, 4.7:1. */
  /* atenção: âmbar. No claro vai o passo escuro (4.6:1 sobre branco); no
     escuro, o passo claro. Mesma família, contraste em cada fundo. */
  --bom:#0b8457; --ruim:#c0392b; --atencao:#8a6100;
  --sombra:0 1px 2px rgba(16,24,20,.04), 0 8px 24px rgba(16,24,20,.05);
  --dica-bg:#241a14; --dica-ink:#f6f2ee;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="claro"])){
    --bg:#131615; --surface:#131615; --surface-2:#1c201e; --linha:#2e332f;
    --ink:#f2f4f3; --ink-2:#a6b0ab; --ink-3:#79837e;
    --marca:#35d07f; --marca-fraca:#1c2b24;
    --lateral:#171a19; --lateral-ink:#a6b0ab;
    --curva-bg:#0b0f0d; --curva-ink:#e8f3ec; --curva-grade:rgba(255,255,255,.07);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
    --bom:#3ecf8e; --ruim:#e66767; --atencao:#e0a83c;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --dica-bg:#2a302d; --dica-ink:#f2f4f3;
  }
}
:root[data-theme="escuro"]{
  --bg:#131615; --surface:#131615; --surface-2:#1c201e; --linha:#2e332f;
  --ink:#f2f4f3; --ink-2:#a6b0ab; --ink-3:#79837e;
  --marca:#35d07f; --marca-fraca:#1c2b24;
  --lateral:#171a19; --lateral-ink:#a6b0ab;
  --curva-bg:#0b0f0d; --curva-ink:#e8f3ec; --curva-grade:rgba(255,255,255,.07);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --bom:#3ecf8e; --ruim:#e66767; --atencao:#e0a83c;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --dica-bg:#2a302d; --dica-ink:#f2f4f3;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
body{background:var(--bg);color:var(--ink);}

/* ── Estrutura: lateral fixa + conteúdo ── */
.app{display:flex;min-height:100vh;}
/* Fora do fluxo de propósito: recolhida, ela abre no hover POR CIMA do conteúdo.
   Se empurrasse, cada passada de mouse redimensionaria os gráficos. */
.side{position:fixed;left:0;top:0;height:100vh;width:236px;z-index:80;
  background:var(--lateral);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;transition:width .18s ease;}
.side .marca{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;}
/* o PNG não tem alfa: o raio corta os cantos pretos que sobram fora do quadrado */
.side .marca img{width:30px;height:30px;flex:none;border-radius:9px;display:block;}
.side nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.side nav button{display:flex;align-items:center;gap:11px;padding:10px 11px;border:none;background:none;border-radius:10px;
  font-size:14.5px;font-weight:500;color:var(--lateral-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left;width:100%;}
.side nav button:hover{background:var(--surface-2);color:var(--ink);}
.side nav button.on{background:var(--marca-fraca);color:var(--marca);font-weight:600;}
.side nav button svg{width:19px;height:19px;flex:none;}
.side .pe{padding:10px;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:2px;}
/* o rodapé usa os mesmos botões do nav — sem isto o SVG estica pra preencher */
.side .pe button{display:flex;align-items:center;gap:11px;padding:10px 11px;border:none;background:none;border-radius:10px;
  font-size:14.5px;font-weight:500;color:var(--lateral-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left;width:100%;}
.side .pe button:hover{background:var(--surface-2);color:var(--ink);}
.side .pe button svg{width:19px;height:19px;flex:none;}
/* Só no desktop. No celular não existe hover, e lá o botão ABRE em vez de recolher. */
@media(min-width:901px){
  .side.mini{width:64px;}
  .side.mini:hover{width:236px;box-shadow:10px 0 30px rgba(0,0,0,.16);}
  .side.mini:not(:hover) .rot{display:none;}
  .side.mini:not(:hover) .marca{justify-content:center;padding:18px 0;}
  .side.mini:not(:hover) nav button,
  .side.mini:not(:hover) .pe button{justify-content:center;padding:10px 0;}
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;
  margin-left:236px;transition:margin-left .18s ease;}
.main.recuado{margin-left:64px;}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--linha);
  background:var(--surface);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
.top .titulo{font-size:15.5px;font-weight:600;flex:1;min-width:120px;}
.top .quando{font-size:13px;color:var(--ink-3);}
.icobtn{width:36px;height:36px;border:1px solid var(--linha);background:var(--surface);border-radius:9px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);}
.icobtn:hover{background:var(--surface-2);color:var(--ink);}
.icobtn svg{width:17px;height:17px;}
.corpo{padding:22px;max-width:1720px;width:100%;}
.h1p{font-size:23px;font-weight:600;margin-bottom:16px;}

  /* Antes travava em 1180px e sobrava um terço da tela vazio num monitor grande.
     O teto alto existe pra tabela de 21 colunas parar de rolar na horizontal. */


  @media(max-width:900px){
    .side{width:64px;}
    .side:not(.mini) .rot{display:none;}
    .side:not(.mini) .marca{justify-content:center;padding:18px 0;}
    .side:not(.mini) nav button,.side:not(.mini) .pe button{justify-content:center;padding:10px 0;}
    .side.mini{width:236px;box-shadow:10px 0 30px rgba(0,0,0,.24);}  /* aqui o botão ABRE */
    .main,.main.recuado{margin-left:64px;}
    .corpo{padding:14px;}
    .top{padding:12px 14px;}
    .top .quando{display:none;}
    #conteudo > div[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr) !important;}
  }
  @media(max-width:760px){
    body{padding:12px;}
    .charts{grid-template-columns:minmax(0,1fr);}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .kpi .val{font-size:24px;}
    .filtros{gap:8px;}
    .rangePanel{left:auto;right:0;max-width:calc(100vw - 24px);}
    .rangePanel{flex-direction:column;}
    .presets{width:100%;border-right:none;border-bottom:1px solid var(--linha);}
    .calarea{width:100%;}
    .painel{min-width:0;width:calc(100vw - 24px);left:auto;right:0;}
    .etq{grid-template-columns:1fr;}
    /* a barrinha de retenção é o primeiro a sair: o número já diz o mesmo */
    .lin .barra{display:none;}
    .lin{gap:8px;font-size:13.5px;}
    .lin .nome{white-space:normal;}
    .tbwrap{margin:0 -14px;padding:0 14px;}
    .card,.cchart{padding:16px 14px;}
    .modal .box{padding:20px 18px;}
  }
  @media(max-width:420px){
    .kpis{grid-template-columns:minmax(0,1fr);}
    .tabs button{flex:1;padding:9px 10px;}
  }

  .login{max-width:380px;margin:12vh auto;background:var(--surface);border-radius:16px;padding:32px;box-shadow:0 2px 18px rgba(0,0,0,.06);}
  .login h1{font-size:20px;font-weight:600;margin-bottom:4px;}
  .login p{font-size:13.5px;color:var(--ink-3);margin-bottom:22px;}
  .login label{display:block;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px;}
  .login input{width:100%;border:1px solid var(--linha);border-radius:9px;padding:12px 13px;font-size:15px;margin-bottom:16px;}
  .login input:focus{outline:none;border-color:var(--marca);}
  .login button{width:100%;background:var(--marca);color:#fff;border:none;border-radius:9px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .login button:disabled{opacity:.55;cursor:default;}
  /* Aviso e erro saem dos tokens de tema, não de hex fixo. Antes eram creme e
     rosa claros escritos à mão, que no tema escuro viravam dois blocos
     luminosos — o aviso brilhava mais que o dado que ele comenta. Com
     color-mix, a mesma regra dá tinta pálida no claro e véu discreto no
     escuro, porque --ruim e --atencao já mudam com o tema. */
  .erro{background:color-mix(in srgb, var(--ruim) 11%, var(--surface));
    border:1px solid color-mix(in srgb, var(--ruim) 30%, transparent);
    color:color-mix(in srgb, var(--ruim) 82%, var(--ink));
    border-radius:9px;padding:11px 13px;font-size:13.5px;margin-bottom:16px;}

  /* os dois flutuam à direita, então quem separa do botão Sair é o margin-right */
  .kpi.selo-crt{border-style:dashed;}
  /* métrica ainda não alimentada: tracejada pra não parecer um número real */
  .kpi.pendente{border-style:dashed;}
  /* cartão por fonte de tráfego, no lugar em que a referência põe */
  /* margin-bottom igual ao do .card: os cartões de plataforma vivem num grid
     próprio, que não herda o espaçamento de baixo dos cards — sem isso o bloco
     seguinte encosta neles e os dois lêem como uma coisa só. */
  .fontes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:16px;margin-bottom:18px;}
  .card.fonte{margin-bottom:0;}
  .card.fonte .cab{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:14px;}
  .card.fonte .rot{font-size:13px;font-weight:600;color:var(--ink-2);}
  .card.fonte .grande{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;}
  .card.fonte .antes{font-size:13px;color:var(--ink-3);padding-bottom:14px;border-bottom:1px solid var(--linha);}
  .card.fonte .linhas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;padding:14px 0;}
  .card.fonte.pendente{border-style:dashed;}
  .card.fonte.pendente .grande,.card.fonte.pendente .linhas b{color:var(--ink-3);}
  .card.fonte .cab em{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:auto;}
  .card.fonte .linhas div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;}
  .card.fonte .linhas span{color:var(--ink-2);}
  .card.fonte .linhas b{font-weight:600;}
  .card.fonte .pe{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;
    padding-top:12px;border-top:1px solid var(--linha);color:var(--ink-2);}
  .card.fonte .pe b{color:var(--ink);font-weight:600;}
  .kpi.pendente .val{color:var(--ink-3);}
  .kpis.topo{grid-template-columns:repeat(6,minmax(0,1fr));}
  @media(max-width:1450px){ .kpis.topo{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:760px){  .kpis.topo{grid-template-columns:repeat(2,minmax(0,1fr));} }
  /* coluna principal + régua de métricas à direita, como na referência */
  .geral{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(230px,1fr);gap:16px;align-items:start;}
  .geral .col{min-width:0;}
  .geral .regua{display:flex;flex-direction:column;gap:12px;min-width:0;}
  @media(max-width:1100px){
    .geral{grid-template-columns:minmax(0,1fr);}
    .geral .regua{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  }
  .fcusto{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;}
  .fcusto label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);}
  .fcusto label:first-child{flex:1;min-width:220px;}
  .fcusto input{border:1px solid var(--linha);border-radius:9px;padding:10px 12px;font-size:14px;
    color:var(--ink);background:var(--surface);font-weight:400;}
  .fcusto .prim{padding:11px 20px;}

  .filtros{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .filtros select,.filtros input[type=date]{border:1px solid var(--linha);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--ink);cursor:pointer;}
  .filtros select:focus{outline:none;border-color:var(--marca);}
  .filtros select.on{border-color:var(--marca);background:var(--marca-fraca);font-weight:600;}
  .btn{border:1px solid var(--linha);background:var(--surface);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .btn.on{border-color:var(--marca);color:var(--marca);background:var(--marca-fraca);}
  .grp{position:relative;}
  .rangeBtn{border:1px solid var(--linha);background:var(--surface);border-radius:10px;padding:11px 17px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .rangeBtn.on{border-color:var(--marca);color:var(--marca);background:var(--marca-fraca);}
  .rangeBtn .car{color:#999;font-size:11px;}
  .rangePanel{position:absolute;top:52px;left:0;z-index:60;background:var(--surface);border:1px solid var(--linha);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.14);display:flex;overflow:hidden;}
  .presets{width:200px;border-right:1px solid var(--linha);padding:8px;}
  .presets.only{border-right:none;}
  .presets a{display:block;padding:10px 13px;border-radius:8px;font-size:14px;color:var(--ink-2);cursor:pointer;}
  .presets a:hover{background:var(--surface-2);}
  .presets a.active{background:var(--marca-fraca);color:var(--marca);font-weight:600;}
  .presets .div{height:1px;background:var(--linha);margin:6px 8px;}
  .calarea{padding:14px 16px;width:292px;}
  .calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px;color:var(--ink);}
  .calnav button{border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2);padding:2px 10px;border-radius:6px;}
  .calnav button:hover{background:#f0f0f0;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .caldow{font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px 0;text-transform:uppercase;}
  .calday{text-align:center;font-size:13px;padding:8px 0;border-radius:7px;cursor:pointer;color:var(--ink);}
  .calday:hover{background:var(--surface-2);}
  .calday.muted{visibility:hidden;}
  .calday.inrange{background:var(--marca-fraca);border-radius:0;}
  .calday.edge{background:var(--marca);color:#fff;border-radius:7px;}
  .calfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha);}
  .calsel{flex:1;font-size:13px;color:var(--ink-2);}
  .vpan{width:310px;padding:12px;display:block;}
  .vsearch{width:100%;border:1px solid var(--linha);border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none;margin-bottom:8px;}
  .vsearch:focus{border-color:var(--marca);}
  .vlist{max-height:270px;overflow-y:auto;margin-bottom:8px;}
  .vitem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink);}
  .vitem:hover{background:var(--surface-2);}
  .vitem input{margin:0;cursor:pointer;accent-color:var(--marca);}
  .vitem .cod{font-weight:600;flex:1;}
  .vitem .qtd{color:#999;font-size:12px;white-space:nowrap;}
  .vempty{color:#999;font-size:13px;padding:14px 9px;text-align:center;}
  .painel{position:absolute;top:52px;left:0;z-index:60;background:var(--surface);border:1px solid var(--linha);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.14);padding:18px 20px;min-width:520px;flex-direction:column;}
  .etq{display:grid;grid-template-columns:repeat(2,minmax(210px,1fr));gap:16px 22px;}
  .etq label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .etq select,.etq input{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);background:var(--surface);width:100%;}
  .pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--linha);}
  .limpar{border:none;background:none;color:var(--ink-2);font-size:13.5px;text-decoration:underline;cursor:pointer;}
  .prim{background:var(--marca);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));min-width:0;gap:12px;margin-bottom:18px;}
  /* Em auto-fit os 11 KPIs caem tortos e sobra fila orfa. 6 fixas = 6+5. */
  .kpis.cinco{grid-template-columns:repeat(6,minmax(0,1fr));}
  @media(max-width:1300px){ .kpis.cinco{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media(max-width:1000px){ .kpis.cinco{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:760px){  .kpis.cinco{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .kpi{background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;}
  /* Três níveis de texto, como na referência: rótulo cinza-médio SEMIBOLD,
     valor quase-preto BOLD, apoio cinza-claro normal. O contraste que separa
     rótulo de valor é o peso, não só a cor. */
  .kpi .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);}
  .kpi .lbl svg{width:15px;height:15px;flex:none;stroke-width:1.9;}
  .kpi .val{font-size:28px;font-weight:700;color:var(--ink);margin-top:6px;letter-spacing:-.01em;}
  .kpi .ap{font-size:13px;font-weight:400;color:var(--ink-3);}

  /* ── Dica ao passar o mouse ────────────────────────────────────────────
     Em CSS puro: sem espera, sem script, e some junto com o cartão. O texto
     vem do atributo, então quem escreve a frase é o mapa DICAS. */
  .kpi .lbl.temdica{cursor:help;}
  .ajuda{
    flex:none; width:14px; height:14px; margin-left:1px;
    display:grid; place-items:center;
    border-radius:50%; border:1px solid var(--linha);
    font-size:9.5px; font-weight:700; font-style:normal; line-height:1;
    color:var(--ink-3); background:var(--surface-2);
    transition:color .12s, border-color .12s;
  }
  .kpi:hover .ajuda{color:var(--marca); border-color:var(--marca);}

  .kpi{position:relative;}
  .lbl.temdica::after{
    content:attr(data-dica);
    /* abre pra BAIXO: pra cima ela bate na barra fixa do topo, que é onde a
       primeira fila de cartões encosta */
    position:absolute; top:calc(100% + 10px); left:0;
    width:max-content; max-width:270px;
    padding:10px 12px;
    border-radius:10px;
    background:var(--dica-bg); color:var(--dica-ink);
    font-size:12.5px; font-weight:400; line-height:1.45; letter-spacing:0;
    text-transform:none; text-align:left;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .14s ease, transform .14s ease, visibility .14s;
    pointer-events:none; z-index:70;
  }
  /* a setinha */
  .lbl.temdica::before{
    content:''; position:absolute; top:calc(100% + 5px); left:14px;
    border:5px solid transparent; border-bottom-color:var(--dica-bg);
    opacity:0; visibility:hidden;
    transition:opacity .14s ease, visibility .14s;
    z-index:71;
  }
  .kpi:hover .lbl.temdica::after,
  .kpi:hover .lbl.temdica::before{opacity:1; visibility:visible; transform:translateY(0);}

  /* Na régua da direita a dica abre pro lado de dentro, senão sai da tela. */
  .geral .regua .lbl.temdica::after{left:auto; right:0;}
  .geral .regua .lbl.temdica::before{left:auto; right:14px;}

  /* Dentro de tabela a dica é outro mecanismo, pelo mesmo mapa DICAS.
     O CSS puro dos cartões não serve aqui: .tbwrap rola na horizontal, e um
     elemento absoluto dentro de um container que rola é recortado por ele.
     E não dá pra pedir "rola só na horizontal, deixa vazar na vertical" — assim
     que um eixo deixa de ser visible, o outro vira auto junto. Daí a dica da
     tabela ser um elemento fixo, fora do fluxo, movido por JS. */
  .tb .lbl.temdica{display:inline-flex;align-items:center;gap:5px;cursor:help;}
  .tb th .lbl.temdica{justify-content:flex-end;}
  .tb .lbl.temdica::after,.tb .lbl.temdica::before{display:none;}
  .tb .ajuda{width:13px;height:13px;font-size:9px;}
  .dicaflut{
    position:fixed; z-index:200; left:0; top:0;
    /* max-content e não largura automática: a caixa é filha do body, que é
       flex, e sem isso ela era espremida a ~89px — texto longo virava uma
       coluna de duas palavras. O max-width segura o outro extremo. */
    width:max-content; max-width:290px;
    padding:10px 12px; border-radius:10px;
    background:var(--dica-bg); color:var(--dica-ink);
    font-size:12.5px; font-weight:400; line-height:1.45; text-align:left;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    opacity:0; visibility:hidden; transition:opacity .14s ease, visibility .14s;
    pointer-events:none;
  }
  .dicaflut.on{opacity:1; visibility:visible;}

  .fdupla{display:flex;gap:12px;}
  .fdupla .fcampo{flex:1;}

  .card{background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
  .sec{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:12px;}
  .sec svg{width:17px;height:17px;flex:none;stroke-width:1.9;color:var(--ink-2);}
  .cabsec{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
  .curva{background:var(--curva-bg);border-radius:14px;padding:18px 16px 10px;margin-bottom:18px;}
  .curva .cab{display:flex;justify-content:space-between;color:var(--curva-ink);font-size:14px;margin-bottom:8px;}
  .cvFunil{position:relative;height:340px;}
  @media(max-width:760px){ .cvFunil{height:230px;} }
  .alerta-box{background:#fdf0ee;border:1px solid #f0cfc8;color:#a8422f;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:18px;}

  .lin{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--linha);font-size:14px;}
  .lin.alerta{background:#fdf0ee;border-radius:8px;}
  .lin.pitch{opacity:.6;}
  .lin .n{width:26px;color:var(--ink-3);font-size:12.5px;text-align:right;}
  .lin .nome{flex:1;}
  .lin .barra{width:32%;height:8px;background:var(--linha);border-radius:5px;overflow:hidden;}
  .lin .barra i{display:block;height:100%;}
  .lin .pct{width:56px;text-align:right;font-weight:600;}
  .lin .queda{width:82px;text-align:right;font-size:12.5px;color:#bbb;}
  .lin .queda.on{color:#c0392b;font-weight:600;}

  .charts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px;}
  @media(max-width:1400px){ .charts{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .cchart{background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:16px 14px;min-width:0;}
  .cchart canvas{max-width:100%;}
  .cchart .ttl{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:14px;}
  .cchart .ttl svg{width:16px;height:16px;flex:none;stroke-width:1.9;color:var(--ink-2);}
  .cchart .cv{position:relative;height:290px;}
  .pieWrap{position:relative;height:320px;max-width:560px;margin:0 auto;}

  .tbwrap{overflow-x:auto;margin:0 -20px;padding:0 20px;}
  table.tb{width:100%;border-collapse:collapse;font-size:14px;}
  .tb th{text-align:left;color:var(--ink-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:14px;background:var(--surface-2);border-bottom:2px solid var(--linha);white-space:nowrap;}
  .tb td{padding:17px 14px;border-bottom:1px solid var(--linha);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .tb tbody tr:hover td{background:var(--surface-2);}
  .tb .nm{font-weight:600;position:sticky;left:0;background:var(--surface);z-index:2;max-width:300px;cursor:pointer;}
  /* O flex fica num invólucro DENTRO da célula, nunca na própria <td>: display
     flex numa td a tira do layout de tabela, ela deixa de acompanhar a largura
     da coluna e sobra um bloco vazio ao lado do nome. */
  .tb .nm .nmw{display:flex;align-items:center;gap:6px;}
  .tb .nm .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb .nm .selo{flex:none;}
  /* O lápis é a pista de que a linha é editável. Fica sempre visível, fraco —
     revelar só no hover esconderia a função inteira no celular, que não tem. */
  .tb .nm .edit{flex:none;display:grid;place-items:center;width:22px;height:22px;
    border-radius:6px;color:var(--ink-3);opacity:.55;transition:opacity .12s,color .12s;}
  .tb .nm .edit svg{width:14px;height:14px;stroke-width:1.9;}
  .tb tr:hover .nm .edit{opacity:1;color:var(--marca);background:var(--marca-fraca);}
  .tb tr:hover .nm{background:var(--surface-2);}
  .tb th:first-child{position:sticky;left:0;z-index:3;background:var(--surface-2);}
  .tb .num,.tb th.num{text-align:right;}
  .vazio{color:var(--ink-3);padding:28px 4px;font-size:14px;}
  .aviso{background:color-mix(in srgb, var(--atencao) 12%, var(--surface));
    border:1px solid color-mix(in srgb, var(--atencao) 32%, transparent);
    color:color-mix(in srgb, var(--atencao) 80%, var(--ink));
    border-radius:10px;padding:11px 13px;font-size:13px;margin-top:12px;line-height:1.5;}
  .aviso code{background:color-mix(in srgb, var(--atencao) 16%, transparent);
    padding:1px 5px;border-radius:4px;font-size:12px;}
  .carregando{color:var(--ink-3);font-size:14px;padding:40px 0;text-align:center;}
  .nota{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.5;}

  /* ── Teste A/B ──────────────────────────────────────────────────────────
     A etiqueta de veredito recebe a cor por --c, definida na linha: assim uma
     regra só serve "A vence", "tendência" e "empate", e a cor fica junto da
     decisão que a escolheu em vez de espalhada em três classes. */
  .abtag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
    font-weight:700;letter-spacing:.02em;color:var(--c);border:1px solid currentColor;
    white-space:nowrap;vertical-align:middle;}
  /* O número absoluto manda, a porcentagem apoia — daí ela vir menor e apagada. */
  .abfrac{font-size:11px;font-weight:500;color:var(--ink-3);}
  /* As linhas de comparação não pertencem a nenhum braço: a borda separa
     "o que cada um fez" de "o que isso quer dizer". */
  .tb tr.abcmp td{border-top:2px solid var(--linha);}
  .tb tr.abcmp ~ tr td.nm,.tb tr.abcmp td.nm{color:var(--ink-3);font-weight:600;}

  /* Barra dentro da célula. Fina de propósito: ela apoia a leitura do número,
     não disputa com ele. Todas partem da mesma borda esquerda — é isso que
     torna os comprimentos comparáveis entre as duas linhas. */
  /* Ancorada na DIREITA, sob o número, e não na esquerda da célula: com os
     valores alinhados à direita, uma barra que começa na esquerda fica solta,
     longe do número que ela representa. Crescendo pra esquerda a partir da
     mesma borda, as duas linhas continuam comparáveis e a barra fica embaixo
     do seu próprio número. */
  .abbar{display:flex;justify-content:flex-end;height:3px;border-radius:2px;
    background:var(--linha);margin:6px 0 0 auto;max-width:104px;overflow:hidden;}
  .abbar i{display:block;height:100%;border-radius:2px;min-width:2px;}
  /* Faixa no vencedor, e só quando existe vencedor. */
  .tb tr.abwin td{background:color-mix(in srgb, var(--bom) 7%, transparent);}
  .tb tr.abwin td:first-child{box-shadow:inset 3px 0 0 var(--bom);}
  .abprog{display:block;height:4px;border-radius:2px;background:var(--linha);
    margin-top:8px;max-width:340px;overflow:hidden;}
  .abprog i{display:block;height:100%;border-radius:2px;background:var(--marca);}
  .abtab th,.abtab td{white-space:nowrap;}
  .ab-hip{font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:82ch;
    margin:-4px 0 16px;}
  .ab-pe{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;
    margin-top:16px;padding-top:12px;border-top:1px solid var(--linha);
    font-size:12px;color:var(--ink-3);}
  .ab-pe code{background:var(--surface-2);padding:2px 7px;border-radius:5px;
    font-size:11.5px;color:var(--ink-2);}
  .ab-pe .limpar{margin-left:auto;font-size:12px;}
  /* O cabeçalho da coluna que decide vem em negrito e na cor do texto forte —
     sem fundo. A versão com faixa cinza pintava a última coluna de QUALQUER
     tabela, entao aparecia tambem no card de tela, onde nao quer dizer nada. */
  .abtab th.abdec{color:var(--ink);font-weight:800;}
  .fcampo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;
    color:var(--ink-2);margin-bottom:14px;}
  .fcampo input,.fcampo textarea,.fcampo select{border:1px solid var(--linha);border-radius:9px;
    padding:10px 12px;font-size:14px;font-weight:500;color:var(--ink);background:var(--fundo);
    font-family:inherit;width:100%;box-sizing:border-box;resize:vertical;}
  .nota code{background:var(--linha);padding:2px 6px;border-radius:5px;font-size:12px;
    word-break:break-all;}

  /* Rodapé discreto: cinza-claro em repouso, só acende no hover. */
  .medalhas{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:4px 16px;margin:26px auto 10px;padding:10px 12px;max-width:920px;
    font-size:12px;color:var(--ink-3);cursor:pointer;border-radius:10px;
    transition:color .14s, background .14s;}
  .medalhas:hover{color:var(--ink-2);background:var(--surface-2);}
  #btnData .cal{width:15px;height:15px;flex:none;color:var(--ink-2);margin-right:2px;}
  /* ☰ é só do celular: no desktop a lateral abre sozinha no hover */
  @media(min-width:901px){ #btnMenu{display:none;} }
  .medalhas .mudar{color:var(--ink-3);text-decoration:underline;}
  .medalhas:hover .mudar{color:var(--marca);}
  /* mesma grade do editor de etiquetas, só que em linha por faixa */
  .lmed{display:grid;grid-template-columns:64px minmax(0,1fr) 116px 116px;gap:10px;margin-bottom:10px;align-items:center;}
  .lmed input{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);background:var(--surface);width:100%;}
  .lmed.cab{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  @media(max-width:600px){ .lmed{grid-template-columns:56px minmax(0,1fr);} .lmed.cab{display:none;} }
  .medalhas .tt{font-size:11px;color:inherit;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal .box{background:var(--surface);border-radius:16px;padding:26px 28px;max-width:760px;width:100%;max-height:88vh;overflow:auto;}
  .modal h2{font-size:18px;font-weight:600;margin-bottom:4px;}
  .modal .qual{font-size:13px;color:var(--ink-3);margin-bottom:20px;}
</style>

const PRECO_VENDA = 37.90, PRECO_BUMP = 17.00;

/* Dia da primeira venda registrada. Serve pra uma coisa só: no filtro "todos"
   o período não tem início, e sem início não dá pra pesar quanto dele caiu em
   cada faixa de taxa. Se a data estiver errada, o único efeito é o Lucro/ROI
   do "todos" pender um pouco pra faixa errada — mais nada usa ela. */
const PRIMEIRA_VENDA = '2026-06-01';

/* O líquido por venda mudou quando o checkout saiu do Celetus pra Kiwify.
   Uma constante só não serve: o dashboard soma períodos inteiros, e um período
   que cruza a data arrastaria as vendas antigas pro valor novo.
   Da faixa mais nova pra mais velha — vale a primeira cujo início já passou.

   O order bump está DESATIVADO desde a troca, então o liqBump da faixa nova
   nunca chega a ser usado: sem bump, faturamento = vendas × 37,90 e a conta de
   bumps lá embaixo dá zero sozinha. Ele repete o valor antigo só pra não virar
   NaN. Quando o bump voltar, ponha aqui o líquido REAL da Kiwify. */
const TAXAS = [
  { de: '2026-08-25',    liqVenda: 32.00, liqBump: 15.47 },
  { de: PRIMEIRA_VENDA,  liqVenda: 33.50, liqBump: 14.48 },
];
const taxaEm = d => TAXAS.find(t => String(d || '9999-12-31') >= t.de) || TAXAS[TAXAS.length - 1];

/* O líquido NÃO é calculado aqui. Ele vem da Kiwify, campo `my_commission`,
   gravado por venda. A fórmula que existia (8,99% + R$2,49) errava em dois
   casos que o payload real mostrou: venda parcelada, onde o cliente paga mais
   e o produtor recebe o mesmo, e order bump, que chega como linha separada e
   não paga a taxa fixa de novo. Ler o número dela também sobrevive a mudança
   de taxa sem ninguém tocar em nada.

   As TAXAS abaixo ficam só pro período do Celetus, anterior a 25/08 — ali não
   existe my_commission, e a única coisa disponível é o valor por venda. */

/* Taxa média do período, pesada pelos DIAS de cada faixa. É o que sobra pros
   números que chegam já somados — cartão por plataforma e tabela de criativos
   vêm das RPCs sem quebra por dia.
   Período inteiro de um lado só do corte (o caso normal, e o único daqui a
   algumas semanas) dá peso 1 numa faixa e o valor sai exato. A média só existe
   no intervalo que cruza a data. */
let _taxaCache = { chave: null, taxa: null };
function taxaDoPeriodo(p) {
  const de = (p && p.de) || PRIMEIRA_VENDA, ate = (p && p.ate) || iso(hojeSP());
  const chave = de + '|' + ate;
  if (_taxaCache.chave === chave) return _taxaCache.taxa;
  let n = 0, sv = 0, sb = 0;
  for (let d = new Date(de + 'T00:00:00Z'); iso(d) <= ate && n < 4000; d = maisDias(d, 1)) {
    const t = taxaEm(iso(d)); sv += t.liqVenda; sb += t.liqBump; n++;
  }
  const taxa = n ? { liqVenda: sv / n, liqBump: sb / n } : TAXAS[0];
  _taxaCache = { chave, taxa };
  return taxa;
}

/* 'quando' aceita o dia da venda (string, taxa exata) ou o período (objeto,
   taxa média). Sem argumento cai no período do filtro, que é o que os
   agregados precisam. */
function liquido(fat, vendas, quando) {
  const v = Number(vendas) || 0;
  if (!v) return 0;
  const t = typeof quando === 'string' ? taxaEm(quando) : taxaDoPeriodo(quando || periodo());
  const bumps = Math.max(0, Math.round(((Number(fat) || 0) - v * PRECO_VENDA) / PRECO_BUMP));
  return v * t.liqVenda + bumps * t.liqBump;
}

async function salvarMedalhas(n) {
  const btn = document.getElementById('mdSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  const erro = document.getElementById('mdErro');
  const val = (c, i) => document.getElementById('md_' + c + '_' + i).value;
  const novas = [];
  for (let i = 0; i < n; i++) {
    const nome = val('nome', i).trim();
    if (!nome) continue;                       // linha sem nome = faixa removida
    novas.push({ selo: val('selo', i).trim(), nome,
                 vendas: Number(val('vendas', i)) || 0, roas: Number(val('roas', i)) || 0 });
  }
  const falhar = m => { erro.textContent = m; erro.style.display = 'block';
                        btn.disabled = false; btn.textContent = 'Salvar'; };
  if (!novas.length) return falhar('Deixe pelo menos uma faixa.');
  const { error } = await sb.from('config')
    .upsert({ chave:'medalhas', valor:novas, atualizado:new Date().toISOString() }, { onConflict:'chave' });
  if (error) return falhar('Não salvou: ' + error.message);
  MEDALHAS = novas;
  fecharModal(); await verCriativos();
}

/* Uma dica só, reaproveitada, presa à viewport. Um elemento por rótulo custaria
   dezenas de nós numa tabela, e todos seriam recortados pelo .tbwrap.
   Delegado no document: a tabela é reconstruída a cada render, e handler preso
   na célula morreria junto com ela. */
const dicaFlut = (() => {
  let el = null;
  return {
    abrir(alvo) {
      const d = alvo.getAttribute('data-dica');
      if (!d) return;
      if (!el) { el = document.createElement('div'); el.className = 'dicaflut'; document.body.appendChild(el); }
      el.textContent = d;
      el.classList.add('on');
      /* Mede DEPOIS de escrever e de mostrar: com o texto anterior, ou invisível,
         offsetWidth ainda é o do estado passado e a dica sai torta. */
      const r = alvo.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
      const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
      /* Abre pra baixo; se não couber, pra cima — nas últimas linhas da tabela
         ela ficaria metade fora da tela. */
      const y = (r.bottom + 8 + h > innerHeight - 8) ? r.top - h - 8 : r.bottom + 8;
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    },
    fechar() { if (el) el.classList.remove('on'); },
  };
})();
/* Qualquer .temdica com texto, esteja onde estiver. Antes o seletor listava os
   lugares ('.tb .temdica, .mapa .temdica') e isso quebrou calado no dia em que
   o mapa perdeu o wrapper .mapa numa reorganização de layout: o atributo
   continuava lá, a dica parou de abrir, e nada acusou.

   A exceção é o .kpi, que tem a dica própria em CSS puro — as duas juntas
   abririam dois balões pro mesmo rótulo. */
const alvoDica = ev => {
  const t = ev.target.closest && ev.target.closest('.temdica[data-dica]');
  return (t && !t.closest('.kpi')) ? t : null;
};
document.addEventListener('mouseover', ev => { const t = alvoDica(ev); if (t) dicaFlut.abrir(t); });
document.addEventListener('mouseout',  ev => { if (alvoDica(ev)) dicaFlut.fechar(); });
/* Rolar move a célula e deixaria a dica pendurada no lugar antigo. */
document.addEventListener('scroll', () => dicaFlut.fechar(), true);

/* Valor escrito SEMPRE fora da barra, do mesmo lado, na mesma cor. Antes ele caía
   pra dentro quando não coubesse — e aí uns ficavam brancos dentro e outros
   cinza fora, no mesmo gráfico. A garantia de caber vem do eixo x, que é
   esticado além do maior valor lá embaixo. */
const rotuloValor = { id:'rotuloValor', afterDatasetsDraw(ch, a, opts) {
  const ctx = ch.ctx, fmt = (opts && opts.fmt) || (v => v);
  ctx.save();
  ctx.font = '600 12.5px Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = tok('--ink-2');
  ch.data.datasets.forEach((ds, di) => ch.getDatasetMeta(di).data.forEach((bar, i) =>
    ctx.fillText(fmt(ds.data[i]), bar.x + 8, bar.y)));
  ctx.restore();
}};

/* ══════ Filtro de data: presets + calendário, como no dashboard antigo ══════ */
const iso = d => d.toISOString().slice(0, 10);
const hojeSP = () => new Date(Date.now() - 3 * 3600 * 1000);   // America/Sao_Paulo
const maisDias = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
const brDate = k => k ? k.slice(8,10) + '/' + k.slice(5,7) + '/' + k.slice(0,4) : '';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const PRESETS = [
  ['hoje','Hoje'], ['ontem','Ontem'], ['7','Últimos 7 dias'], ['14','Últimos 14 dias'],
  ['28','Últimos 28 dias'], ['30','Últimos 30 dias'], ['div',''],
  ['semana','Esta semana'], ['semana_passada','Semana passada'],
  ['mes','Este mês'], ['mes_passado','Mês passado'], ['div',''],
  ['todos','Máximo (todos)'],
];

let presetAtual = 'todos', rangeCustom = { de:null, ate:null };
let calMes = hojeSP(), selDe = null, selAte = null;

function periodo() {
  if (presetAtual === 'custom') return { de: rangeCustom.de, ate: rangeCustom.ate };
  const h = hojeSP();
  switch (presetAtual) {
    case 'todos': return { de:null, ate:null };
    case 'hoje':  return { de: iso(h), ate: iso(h) };
    case 'ontem': { const o = maisDias(h, -1); return { de: iso(o), ate: iso(o) }; }
    case 'semana': { const ws = maisDias(h, -((h.getUTCDay() + 6) % 7)); return { de: iso(ws), ate: iso(h) }; }
    case 'semana_passada': { const ws = maisDias(h, -((h.getUTCDay() + 6) % 7));
      return { de: iso(maisDias(ws, -7)), ate: iso(maisDias(ws, -1)) }; }
    case 'mes': return { de: iso(h).slice(0,8) + '01', ate: iso(h) };
    case 'mes_passado': { const p = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth(), 0));
      return { de: iso(p).slice(0,8) + '01', ate: iso(p) }; }
    default: return { de: iso(maisDias(h, -(Number(presetAtual) - 1))), ate: iso(h) };
  }
}

/* O botão mostra a DATA, não o nome do atalho: 'Semana passada' obriga a abrir
   o painel pra saber de quando a quando. Com 'Máximo' não há data a mostrar —
   o começo depende do dado — então esse fica pelo nome. */
function rotuloPeriodo() {
  const faixa = (de, ate) => !de ? null
    : de === ate ? brDate(de) : brDate(de) + ' – ' + brDate(ate);
  if (presetAtual === 'custom') return faixa(rangeCustom.de, rangeCustom.ate) || 'Personalizado';
  const p = periodo();
  return faixa(p.de, p.ate) || 'Máximo (todos)';
}

function pintarPresets() {
  document.getElementById('presets').innerHTML = PRESETS.map(([k, l]) =>
    k === 'div' ? '<div class="div"></div>'
      : '<a class="' + (presetAtual === k ? 'active' : '') + '" onclick="usarPreset(\'' + k + '\')">' + l + '</a>').join('');
  document.getElementById('lblData').textContent = rotuloPeriodo();
  document.getElementById('btnData').className = 'rangeBtn' + (presetAtual !== 'todos' ? ' on' : '');
}
function usarPreset(k) { presetAtual = k; fecharPaineis(); pintarPresets(); carregar(); }

function pintarCal() {
  const y = calMes.getUTCFullYear(), m = calMes.getUTCMonth();
  document.getElementById('calTitulo').textContent = MESES[m] + ' ' + y;
  const ini = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7;
  const dias = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let h = ['seg','ter','qua','qui','sex','sáb','dom'].map(d => '<div class="caldow">' + d + '</div>').join('');
  for (let i = 0; i < ini; i++) h += '<div class="calday muted"></div>';
  for (let d = 1; d <= dias; d++) {
    const k = y + '-' + String(m + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    let cls = 'calday';
    if (selDe && selAte && k >= selDe && k <= selAte) cls += ' inrange';
    if (k === selDe || k === selAte) cls += ' edge';
    h += '<div class="' + cls + '" onclick="calPick(\'' + k + '\')">' + d + '</div>';
  }
  document.getElementById('calGrid').innerHTML = h;
  document.getElementById('calSel').textContent = selDe && selAte ? (brDate(selDe) + ' – ' + brDate(selAte))
    : selDe ? (brDate(selDe) + ' – …') : 'Selecione as datas';
}
function calMove(n) { calMes = new Date(Date.UTC(calMes.getUTCFullYear(), calMes.getUTCMonth() + n, 1)); pintarCal(); }
function calPick(k) {
  if (!selDe || (selDe && selAte)) { selDe = k; selAte = null; }
  else if (k >= selDe) selAte = k;
  else { selAte = selDe; selDe = k; }
  pintarCal();
}
function calAplicar() {
  if (!selDe) { alert('Selecione uma data no calendário'); return; }
  presetAtual = 'custom'; rangeCustom = { de: selDe, ate: selAte || selDe };
  fecharPaineis(); pintarPresets(); carregar();
}

function abrir(id) {
  ['painelData','painelVar','painelEtq','painelFunil','painelFonte','painelStatus','painelPieMet','painelPieGrp','painelG_formato','painelG_angulo','painelG_emocao'].forEach(k => {
    const el = document.getElementById(k); if (!el) return;
    el.style.display = (k === id && el.style.display === 'none') ? 'flex' : 'none';
  });
  /* Vira o painel pro outro lado quando ele sairia da tela. Marcar um por um
     quebraria de novo assim que um botão mudasse de lugar — aqui ele mede. */
  const p = document.getElementById(id);
  if (p && p.style.display !== 'none') {
    p.style.left = '0'; p.style.right = 'auto';
    const r = p.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) { p.style.left = 'auto'; p.style.right = '0'; }
  }
  if (id === 'painelData') pintarCal();
  if (id === 'painelVar') pintarVars();
  if (id === 'painelFunil') pintarFunil();
  if (id === 'painelFonte') pintarFonte();

Chart.defaults.font.family = "Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";

/* 'ativo' por padrão: o que interessa no dia a dia é o que está no ar. O robô

const TITULOS = { geral:'Visão Geral', funil:'Funil', criativos:'Criativos', ab:'Teste A/B', registros:'Registros', custos:'Custos operacionais', balanco:'Balanço' };

/* Mapa de calor dia da semana × hora. A pergunta "qual dia e hora vende mais"
   é sobre a COMBINAÇÃO — dois gráficos separados, um por dia e um por hora,
   escondem exatamente o que se procura: um bolsão de quinta à noite soma pouco
   nos dois eixos separados e desaparece.

   E ele deixa a escassez à vista. Uma grade quase toda vazia se explica sozinha;
   barras somam tudo e parecem sólidas com três vendas. */
const DIAS_SEM = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function mapaHorario(linhas) {
  const m = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let total = 0, teto = 0;
  (linhas || []).forEach(l => {
    const d = Number(l.dia), h = Number(l.hora), v = Number(l.vendas) || 0;
    if (d >= 0 && d < 7 && h >= 0 && h < 24) { m[d][h] += v; total += v; }
  });
  m.forEach(r => r.forEach(v => { if (v > teto) teto = v; }));

  if (!total) {
    return '<div class="vazio">Nenhuma venda no período. Este mapa começa a se ' +
      'formar com as vendas que chegam pelo webhook da Kiwify — leva algumas ' +
      'semanas até um padrão de dia da semana significar alguma coisa.</div>';
  }

  const porDia  = m.map(r => r.reduce((a, v) => a + v, 0));
  const maiorDia = Math.max(...porDia);

  /* Um tom só, do claro ao escuro, proporcional à contagem. Escala de cor com
     várias matizes daria a impressão de categorias diferentes onde só existe
     "mais" e "menos". O piso de 12% garante que uma venda solitária apareça. */
  const cel = (v, d, h) => {
    const forca = teto ? (v ? 12 + (v / teto) * 88 : 0) : 0;
    const fundo = v ? 'color-mix(in srgb, var(--marca) ' + forca.toFixed(0) + '%, var(--surface-2))'
                    : 'var(--surface-2)';
    const dica = v
      ? v + (v > 1 ? ' vendas' : ' venda') + ' — ' + DIAS_SEM[d] + ', ' + String(h).padStart(2, '0') + 'h'
      : 'Nenhuma venda — ' + DIAS_SEM[d] + ', ' + String(h).padStart(2, '0') + 'h';
    return '<i class="mp-cel temdica" data-dica="' + esc(dica) + '" style="background:' + fundo + '"></i>';
  };

  /* Total do dia entra na MESMA grade, como colunas extras, e não numa lista ao
     lado. Duas listas de sete itens lado a lado sempre desalinham: a altura da
     linha do mapa vem da largura da célula (aspect-ratio), e nenhuma altura fixa
     na lista vizinha acompanha isso. Na mesma grade, alinhar deixa de ser algo
     que pode dar errado. */
  return '<div class="mp-grade">' +
      '<div class="mp-canto"></div>' +
      /* Rótulo a cada 3 horas: 24 números seguidos viram uma faixa cinza que
         ninguém lê, e de 3 em 3 ainda dá pra localizar qualquer coluna. */
      Array.from({ length: 24 }, (_, h) =>
        '<div class="mp-h">' + (h % 3 === 0 ? String(h).padStart(2, '0') : '') + '</div>').join('') +
      '<div class="mp-vao"></div><div class="mp-tit">por dia</div><div></div>' +

      m.map((linha, d) =>
        '<div class="mp-d">' + DIAS_SEM[d] + '</div>' +
        linha.map((v, h) => cel(v, d, h)).join('') +
        '<div class="mp-vao"></div>' +
        '<span class="mp-barra"><i style="width:' +
          (maiorDia ? (porDia[d] / maiorDia * 100).toFixed(0) : 0) + '%"></i></span>' +
        '<b class="mp-num">' + porDia[d] + '</b>'
      ).join('') +
  '</div>';
}

// ══════════════════════ TESTE A/B ══════════════════════
/* O que esta aba faz que uma tabela de porcentagens não faz: dizer QUANDO a
   diferença é real. Sem isso, 62% contra 58% com 80 sessões parece vitória e
   não é — é o intervalo de erro dos dois se sobrepondo. */

/* Normal acumulada, aproximação de Zelen & Severo (26.2.17). Erro abaixo de
   7,5e-8, muito além do que qualquer decisão aqui exige. */
function normalAcum(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
  return z > 0 ? 1 - p : p;
}

/* log(n!) com cache crescente. Multiplicar fatoriais direto estoura o ponto
   flutuante bem antes dos tamanhos que este dashboard alcança; somando
   logaritmos, não estoura nunca. */
const _logFat = [0, 0];
function logFat(n) {
  for (let i = _logFat.length; i <= n; i++) _logFat[i] = _logFat[i - 1] + Math.log(i);
  return _logFat[n];
}

/* Fisher exato, bicaudal. Vale em QUALQUER tamanho de amostra — não depende de
   aproximação nenhuma. Soma a probabilidade de todas as tabelas, com as mesmas
   margens, tão ou menos prováveis que a observada. */
function fisher(a, b, c, d) {
  const n = a + b + c + d;
  if (!n) return 1;
  const lp = (x) => logFat(a + b) + logFat(c + d) + logFat(a + c) + logFat(b + d) - logFat(n)
                  - logFat(x) - logFat(a + b - x) - logFat(a + c - x) - logFat(d - a + x);
  const p0 = Math.exp(lp(a));
  let soma = 0;
  for (let x = Math.max(0, a - d); x <= Math.min(a + b, a + c); x++) {
    const p = Math.exp(lp(x));
    if (p <= p0 * (1 + 1e-9)) soma += p;
  }
  return Math.min(1, soma);
}

/* Bicaudal porque a pergunta honesta é "as duas são diferentes?", não "a nova é
   melhor?" — a segunda já assume a resposta e dobra a chance de falso positivo.

   Qual dos dois testes: o z é rápido mas a aproximação normal só vale com pelo
   menos 5 sucessos E 5 fracassos em cada braço. Abaixo disso ele infla a
   confiança — nos primeiros dados reais deste experimento dava 91,3% onde o
   Fisher dava 81,8%, e 74,9% onde o Fisher dava 54,5%. Então o Fisher entra
   sempre que alguma célula for pequena, que é justamente quando a diferença
   entre os dois importa. */
function significancia(x1, n1, x2, n2) {
  if (!n1 || !n2) return null;
  const p1 = x1 / n1, p2 = x2 / n2;
  const miudo = Math.min(x1, n1 - x1, x2, n2 - x2) < 5;
  const pool = (x1 + x2) / (n1 + n2);
  const se = Math.sqrt(pool * (1 - pool) * (1 / n1 + 1 / n2));
  const z = se ? (p1 - p2) / se : 0;
  const p = miudo ? fisher(x1, n1 - x1, x2, n2 - x2)
                  : (se ? 2 * (1 - normalAcum(Math.abs(z))) : 1);
  return { z: p1 - p2 >= 0 ? Math.abs(z) : -Math.abs(z), p, p1, p2, exato: miudo,
           lift: p2 ? (p1 - p2) / p2 * 100 : null };
}

/* Piso de volume antes de qualquer veredito. Não é estatística, é prudência:
   com poucas dezenas de visitantes o Fisher já devolve um número honesto, mas
   um "tendência" nascido de 11 pessoas ensina a confiar em ruído. */
const MIN_BRACO = 30;

/* Receita por visitante — a métrica que decide um teste de PREÇO, porque um
   preço maior pode converter menos e ainda faturar mais.

   Não dá pra usar o teste de proporção aqui: a comparação não é entre duas
   taxas, é entre duas médias em reais. Mas a variância não precisa vir da
   receita venda a venda — cada visitante rende o preço do braço ou rende zero,
   então a distribuição é Bernoulli vezes preço, e média e variância saem da
   conversão e do preço médio, que já estão na mão. */
function significanciaRPV(x1, n1, rec1, x2, n2, rec2) {
  if (!n1 || !n2) return null;
  const m1 = rec1 / n1, m2 = rec2 / n2;
  const p1 = x1 / n1, p2 = x2 / n2;
  const pr1 = x1 ? rec1 / x1 : 0, pr2 = x2 ? rec2 / x2 : 0;
  const v1 = p1 * (1 - p1) * pr1 * pr1, v2 = p2 * (1 - p2) * pr2 * pr2;
  const se = Math.sqrt(v1 / n1 + v2 / n2);
  if (!se) return null;
  const z = (m1 - m2) / se;
  /* v1 e v2 saem daqui porque o cálculo de "quantos visitantes faltam" precisa
     delas: comparação de médias usa variância, não proporção. */
  return { z, p: 2 * (1 - normalAcum(Math.abs(z))), m1, m2, v1, v2,
           lift: m2 ? (m1 - m2) / m2 * 100 : null };
}

/* Amostra necessária para uma diferença entre MÉDIAS, mesma dupla de sempre
   (95% de confiança, 80% de poder). É outra fórmula da de proporções, e usar a
   errada aqui daria número sem sentido — a de proporção espera dois valores
   entre 0 e 1, e receita por visitante é reais. */
function amostraNecessariaMedia(v1, v2, dif) {
  if (!dif || !isFinite(dif)) return null;
  return Math.ceil(Math.pow(1.959964 + 0.841621, 2) * (v1 + v2) / (dif * dif));
}

/* Quantas vendas o teste de preço DEVERIA conseguir classificar no período.
   Serve pra distinguir "não houve venda" de "houve venda que não entrou na
   conta" — zero por falha de leitura é mentira, não medição.

   Order bump fica fora da contagem: ele não tem preço próprio no teste, é
   acréscimo de uma venda que já foi classificada. Contá-lo aqui faria todo
   bump aparecer como venda perdida. */
async function contarVendas(p) {
  const r = await Promise.resolve(sb.rpc('fn_vendas_dia', { p_de:p.de, p_ate:p.ate }))
    .catch(() => ({ error: true }));
  if (!r || r.error || !r.data) return null;
  return r.data.reduce((a, d) => a + (Number(d.vendas_sem_bump) || 0), 0);
}

/* Quantas sessões POR BRAÇO para enxergar a diferença que está aparecendo.
   95% de confiança, 80% de poder — o par convencional. Serve pra responder
   "já posso parar?" antes de parar por impaciência. */
function amostraNecessaria(p1, p2) {
  if (p1 === p2 || !isFinite(p1) || !isFinite(p2)) return null;
  const pm = (p1 + p2) / 2;
  const n = Math.pow(1.959964 * Math.sqrt(2 * pm * (1 - pm)) +
                     0.841621 * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2)), 2) /
            Math.pow(p1 - p2, 2);
  return Math.ceil(n);
}

const URL_QUIZ = 'https://protocolociclofertil.com.br/quiz/v2/';

/* A URL some do corpo do card, então precisa de um jeito de pegá-la sem
   selecionar texto pequeno com o mouse. O rótulo confirma na própria tecla —
   um alerta pra dizer "copiei" interromperia mais do que ajuda.

   Dois caminhos porque o primeiro falha em situações banais: navigator.clipboard
   recusa se o documento não estiver em foco, e não existe em http sem TLS. O
   execCommand é obsoleto mas funciona nesses casos, e a última reserva é deixar
   a URL selecionada na tela pra um Cmd+C manual — nunca um beco sem saída. */
async function copiarUrl(url, botao) {
  const avisar = t => {
    const antes = botao.dataset.antes || botao.textContent;
    botao.dataset.antes = antes;
    botao.textContent = t;
    setTimeout(() => { botao.textContent = antes; }, 1600);
  };

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      return avisar('copiado');
    }
  } catch (e) { /* cai no plano B */ }

  const ta = document.createElement('textarea');
  ta.value = url;
  ta.setAttribute('readonly', '');
  /* Fora da tela, mas NÃO display:none nem visibility:hidden — o navegador não
     seleciona o conteúdo de um elemento que não ocupa espaço. */
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) return avisar('copiado');

  /* Nem um nem outro: mostra a URL selecionada, pra um Cmd+C resolver. */
  const cod = botao.closest('.ab-pe').querySelector('code');
  cod.textContent = url;
  const faixa = document.createRange();
  faixa.selectNodeContents(cod);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(faixa);
  avisar('copie com Cmd+C');
}

async function verAB() {
  const p = periodo();
  const { data: exps, error: eE } = await sb.from('experimentos').select('*').order('inicio', { ascending:false });
  if (eE) throw eE;
  if (!exps || !exps.length) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">Nenhum experimento cadastrado. ' +
      'Rode <b>supabase/12-experimentos.sql</b> no SQL Editor.</div></div>';
    return;
  }

  const partes = [];
  for (const ex of exps) {
    /* Promise.resolve em volta do rpc: o retorno do supabase-js é um thenable,
       não uma Promise — tem .then mas não tem .catch, e chamar .catch direto
       nele derruba a aba inteira. A tolerância existe porque fn_experimento_
       vendas pode não estar no banco ainda (13-vendas-kiwify.sql), e o funil
       não deveria sumir por causa disso. */
    const [rF, rV, totalVendas] = await Promise.all([
      sb.rpc('fn_experimento', { p_exp: ex.chave, p_de: p.de, p_ate: p.ate }),
      Promise.resolve(sb.rpc('fn_experimento_vendas', { p_exp: ex.chave, p_de: p.de, p_ate: p.ate }))
        .catch(() => ({ data: [] })),
      contarVendas(p).catch(() => null),
    ]);
    if (rF.error) throw rF.error;
    partes.push(cartaoExperimento(ex, rF.data || [], (rV && rV.data) || [], totalVendas));
  }
  document.getElementById('conteudo').innerHTML = partes.join('');
}

function cartaoExperimento(ex, linhas, vendas, totalVendas) {
  const vazio = { sessoes:0, tela1:0, tela2:0, fim:0, checkout:0 };
  const bruto = (lado, rot) => linhas.find(l => l.lado === lado) || { ...vazio, rotulo: rot };

  /* Junta as duas fontes numa linha só por braço: o funil vem da `eventos`
     (quem passou por onde) e o dinheiro vem do webhook da Kiwify. Fontes
     diferentes, mesma linha — é o que permite ler o braço inteiro de uma vez.
     rpv fica calculado aqui e não no banco: ele é razão de duas coisas que
     chegam separadas, e a conta tem que ser a mesma dos dois lados. */
  const dinheiro = {};
  (vendas || []).forEach(v => { dinheiro[v.marca] = v; });
  const juntar = (l, marca) => {
    const d = dinheiro[marca] || { vendas:0, reembolsos:0, receita:0 };
    const n = Number(l.tela1) || 0;
    return { ...l, vendas: Number(d.vendas) || 0, reembolsos: Number(d.reembolsos) || 0,
             receita: Number(d.receita) || 0, rpv: n ? Number(d.receita) / n : 0 };
  };
  const A = juntar(bruto('a', ex.rotulo_a), ex.braco_a);
  const B = juntar(bruto('b', ex.rotulo_b), ex.braco_b);
  const nA = Number(A.tela1), nB = Number(B.tela1);
  const tot = nA + nB;

  /* Venda que existe mas não entrou na conta de nenhum braço. Só faz sentido
     num teste com colunas de dinheiro: num teste de tela não há o que somar, e
     o alerta ali seria ruído sobre um problema que não existe. */
  const mapeadas = A.vendas + B.vendas;
  const orfas = (ex.foco === 'dinheiro' && totalVendas != null && totalVendas > mapeadas)
    ? totalVendas - mapeadas : 0;
  const badge = (txt, cor) => '<span class="abtag" style="--c:' + cor + '">' + txt + '</span>';

  /* Desvio de divisão (SRM). O sorteio é 50/50: se a fatia real fugir muito
     disso, o problema é técnico — um braço quebrando, cache servindo sempre a
     mesma tela — e NENHUM número da tabela vale antes de achar a causa.
     Abaixo de 100 visitantes não dá pra distinguir desvio de acaso, então nem
     acusa: alarme falso no começo do teste ensina a ignorar o alarme. */
  const torta = tot >= 100 && Math.abs(nA - tot / 2) / Math.sqrt(tot * 0.25) > 3;
  const alerta = torta
    ? '<div class="erro" style="margin-top:10px;">Divisão fora do esperado: ' +
      nA + ' contra ' + nB + ', quando o sorteio é 50/50. Isso costuma ser falha técnica ' +
      '(um braço com erro, cache entregando sempre a mesma tela). Investigue antes de ler os números acima.</div>'
    : '';


  /* Uma coluna por número, uma linha por variante — assim cada braço se lê de
     uma vez, da esquerda pra direita, como uma ficha.

     `base` é o denominador da porcentagem. Visitantes não tem: ele É o
     denominador dos outros três, então ali a fração mostra a fatia do sorteio.
     Nos outros a base é sempre `tela1`, e não a etapa anterior — com a mesma
     população embaixo, as três porcentagens podem ser lidas em sequência. */
  /* Cada teste mostra só as colunas da SUA pergunta. Um teste de tela pergunta
     quantas pessoas seguem; um de preço pergunta quanto dinheiro entra. Juntar
     as duas listas não dá mais informação — dá mais coluna pra atravessar antes
     de achar a que importa. O `foco` vem do banco, então teste novo escolhe a
     leitura dele sem tocar em código. */
  const CAMPOS = {
    tela1:    { rotulo:'Visitantes',         base:null,    sorteio:true },
    tela2:    { rotulo:'Tela 1 → tela 2',    base:'tela1' },
    fim:      { rotulo:'Chegou ao fim',      base:'tela1' },
    checkout: { rotulo:'Clicou no checkout', base:'tela1' },
    vendas:   { rotulo:'Vendas',             base:'tela1' },
    receita:  { rotulo:'Receita',            base:null, moeda:true, semTeste:true },
    rpv:      { rotulo:'R$/visitante',       base:null, moeda:true, decide:true },
  };
  const FOCO = {
    tela:     ['tela1', 'tela2', 'fim', 'checkout'],
    dinheiro: ['tela1', 'checkout', 'vendas', 'receita', 'rpv'],
  };
  const COLS = (FOCO[ex.foco] || FOCO.tela).map(c => ({ campo: c, ...CAMPOS[c] }));

  /* Uma vez por coluna, reaproveitada pelas três linhas de comparação.
     Receita e R$/visitante não são proporção: comparar duas médias em reais
     pede outro teste, e é o que significanciaRPV faz. Receita sozinha não
     ganha teste nenhum — ela não é comparável entre braços de tamanho
     diferente, é o R$/visitante que normaliza isso. */
  const sig = {};
  COLS.forEach(c => {
    if (c.decide) sig[c.campo] = significanciaRPV(A.vendas, nA, A.receita, B.vendas, nB, B.receita);
    else if (c.base) sig[c.campo] = significancia(Number(A[c.campo]), nA, Number(B[c.campo]), nB);
  });

  /* A barra é o que faz esta tabela ser lida de relance: duas linhas empilhadas
     viram dois comprimentos, e comprimento se compara sem passar pelos dígitos.
     Todas partem da mesma borda esquerda da célula, senão não haveria o que
     comparar.

     A cor segue o BRAÇO, sempre a mesma, nunca quem está ganhando. Cor por
     posição faria a tabela se repintar a cada dado novo, e a memória visual do
     "azul é a nova" — que é o que permite ler rápido — se perderia. */
  /* Colunas em reais não têm base própria pra virar porcentagem, então a barra
     delas é relativa ao MAIOR dos dois braços — o que se quer ver ali é qual
     dos dois é maior e por quanto, não que fração de um todo cada um é. */
  const tetoR = {};
  COLS.filter(c => c.moeda).forEach(c => {
    tetoR[c.campo] = Math.max(Number(A[c.campo]) || 0, Number(B[c.campo]) || 0);
  });

  const linhaBraco = (L, rotulo, cor, venceu) =>
    '<tr' + (venceu ? ' class="abwin"' : '') + '>' +
    '<td class="nm"><b>' + esc(rotulo) + '</b></td>' +
    COLS.map(c => {
      const x = Number(L[c.campo]) || 0;
      if (c.moeda) {
        const larg = tetoR[c.campo] ? x / tetoR[c.campo] * 100 : 0;
        return '<td class="num"><b>' + (x ? moeda(x) : '—') + '</b>' +
               '<span class="abbar"><i style="width:' + larg.toFixed(1) + '%;background:' + cor + '"></i></span></td>';
      }
      const d = c.base ? Number(L[c.base]) : tot;
      const taxa = d ? x / d * 100 : 0;
      return '<td class="num"><b>' + x + '</b> <span class="abfrac">' +
             (d ? taxa.toFixed(1) + '%' : '—') + '</span>' +
             '<span class="abbar"><i style="width:' + taxa.toFixed(1) + '%;background:' + cor + '"></i></span>' +
             '</td>';
    }).join('') + '</tr>';

  /* As três linhas de baixo comparam os dois braços, então não pertencem a
     nenhum deles. A borda em cima da primeira separa "o que cada um fez" de
     "o que isso quer dizer". */
  /* Abaixo do piso, confiança e veredito ficam em branco. A diferença bruta
     continua aparecendo: ela é o que foi medido, não uma conclusão sobre ele. */
  const poucos = Math.min(nA, nB) < MIN_BRACO;

  /* Sem dizer "de quem em relação a quem", um -20,8% na coluna de R$/visitante
     lê como "a receita caiu", quando o que ele diz é que o primeiro braço rende
     20,8% menos que o segundo — ou seja, que o segundo está ganhando. */
  const linhaDif = '<tr class="abcmp"><td class="nm">' + rotuloTb('Diferença') +
    '<br><span class="abfrac">' + esc(A.rotulo || ex.rotulo_a) + ' vs ' + esc(B.rotulo || ex.rotulo_b) + '</span></td>' +
    COLS.map(c => {
      /* Visitantes não tem diferença que signifique nada: os dois braços DEVEM
         ficar iguais. Receita crua também não — braço com mais gente fatura
         mais sem ser melhor; quem compara isso é o R$/visitante. */
      const s = sig[c.campo];
      if (!s || s.lift == null || !isFinite(s.lift)) return '<td class="num">—</td>';
      return '<td class="num"><span style="color:' + (s.lift >= 0 ? 'var(--bom)' : 'var(--ruim)') + '">' +
             (s.lift >= 0 ? '+' : '') + s.lift.toFixed(1) + '%</span></td>';
    }).join('') + '</tr>';

  const linhaConf = '<tr><td class="nm">' + rotuloTb('Confiança') + '</td>' +
    COLS.map(c => {
      const s = sig[c.campo];
      if (!s || poucos) return '<td class="num">—</td>';
      return '<td class="num">' + ((1 - s.p) * 100).toFixed(1) + '%' +
        (s.exato ? '<span class="abfrac" title="Fisher exato: a amostra é pequena demais para a aproximação normal"> ex</span>' : '') +
        '</td>';
    }).join('') + '</tr>';

  const linhaVer = '<tr><td class="nm">' + rotuloTb('Veredito') + '</td>' +
    COLS.map(c => {
      /* A coluna de visitantes não julga resultado — ela julga o sorteio. */
      if (c.sorteio) {
        return '<td class="num">' + (!tot ? badge('sem tráfego', 'var(--ink-3)')
          : torta ? badge('divisão torta', 'var(--ruim)')
          : badge('50/50 ok', 'var(--bom)')) + '</td>';
      }
      if (!sig[c.campo]) return '<td class="num">—</td>';
      if (poucos) return '<td class="num">' + badge('poucos dados', 'var(--ink-3)') + '</td>';
      const s = sig[c.campo];
      if (!s) return '<td class="num">' + badge('sem dados', 'var(--ink-3)') + '</td>';
      const b = s.p < 0.05 ? badge(s.z > 0 ? esc(A.rotulo || ex.rotulo_a) + ' vence'
                                           : esc(B.rotulo || ex.rotulo_b) + ' vence', 'var(--bom)')
              : s.p < 0.20 ? badge('tendência', 'var(--atencao)')
              : badge('empate', 'var(--ink-3)');
      return '<td class="num">' + b + '</td>';
    }).join('') + '</tr>';

  /* Quanto falta, medido na métrica principal, com barra pra dar a distância de
     relance. Enquanto está abaixo do piso, o alvo é o próprio piso: estimar
     amostra a partir de uma diferença medida em 11 pessoas produzia frases como
     "faltam 15 visitantes" — animadora e sem qualquer base. */
  /* Qual métrica manda no "quanto falta". Ela sai do TIPO do teste, não de um
     padrão fixo: num teste de tela a pergunta é quem passa da primeira tela;
     num de preço é quanto entra por visitante. Medir a distância pela métrica
     errada dá um alvo que não responde a pergunta que o teste faz.

     No de preço, enquanto não houver venda, o clique no checkout é o que existe
     de mais perto do dinheiro — e some assim que a primeira venda entra. */
  const temDinheiro = (A.vendas + B.vendas) > 0;
  const campoPrim = ex.foco === 'dinheiro' ? (temDinheiro ? 'rpv' : 'checkout') : 'tela2';
  const nomePrim = (CAMPOS[campoPrim] || {}).rotulo || campoPrim;
  const sPrim = sig[campoPrim];
  const menor = Math.min(nA, nB);
  let falta = '', alvo = 0;
  if (poucos) {
    alvo = MIN_BRACO;
    falta = 'Teste começando: <b>' + nA + '</b> e <b>' + nB + '</b> visitantes. ' +
            'A estatística passa a valer a partir de ' + MIN_BRACO + ' por braço.';
  } else if (sPrim && sPrim.p >= 0.05) {
    const nec = campoPrim === 'rpv'
      ? amostraNecessariaMedia(sPrim.v1, sPrim.v2, sPrim.m1 - sPrim.m2)
      : amostraNecessaria(sPrim.p1, sPrim.p2);
    /* amostraNecessariaMedia só serve pro R$/visitante, que compara médias em
       reais. Nas outras a conta é de proporção. */
    if (nec && isFinite(nec)) {
      alvo = Math.max(nec, MIN_BRACO);
      falta = 'Para a diferença em <b>' + esc(nomePrim) +
              '</b> virar conclusão, são ~<b>' + alvo.toLocaleString('pt-BR') +
              '</b> visitantes por braço. Você tem ' + nA + ' e ' + nB + '.';
    } else {
      falta = 'Os dois braços estão praticamente iguais — nesse ritmo o teste não conclui.';
    }
  } else if (sPrim) {
    falta = 'A diferença em <b>' + esc(nomePrim) + '</b> já é estatisticamente sólida. Pode decidir.';
  }
  const barraProg = alvo
    ? '<span class="abprog"><i style="width:' + Math.min(100, menor / alvo * 100).toFixed(1) + '%"></i></span>'
    : '';

  const decidido = !poucos && sPrim && sPrim.p < 0.05;
  const venceuA = decidido && sPrim.z > 0;
  const venceuB = decidido && sPrim.z < 0;

  const estado = ex.fim ? badge('encerrado', 'var(--ink-3)') : badge('rodando', 'var(--bom)');

  return '<div class="card">' +
    '<div class="cabsec"><div class="sec" style="margin:0;">' + ico('Teste A/B') +
      '<span>' + esc(ex.rotulo) + '</span> ' + estado + '</div>' +
      '<button class="limpar" onclick="editarExperimento(' + JSON.stringify(ex.chave).replace(/"/g, '&quot;') + ')">editar</button></div>' +
    /* A hipótese fica logo abaixo do título: ela é a PERGUNTA, e a tabela é a
       resposta — nessa ordem o card se lê como uma frase só. */
    (ex.hipotese ? '<div class="ab-hip">' + esc(ex.hipotese) + '</div>' : '') +
    '<div class="tbwrap"><table class="tb abtab">' +
      '<tr><th>Variante</th>' +
        COLS.map(c => '<th class="num' + (c.decide ? ' abdec' : '') + '">' +
                      rotuloTb(c.rotulo) + '</th>').join('') +
      '</tr>' +
      /* O destaque só entra quando existe vencedor de verdade na métrica
         principal. Marcar quem está na frente antes disso seria transformar
         ruído em decisão — que é o erro que esta aba inteira existe pra evitar. */
      linhaBraco(A, A.rotulo || ex.rotulo_a, 'var(--s1)', venceuA) +
      linhaBraco(B, B.rotulo || ex.rotulo_b, 'var(--s2)', venceuB) +
      linhaDif + linhaConf + linhaVer +
    '</table></div>' +
    (falta ? '<div class="nota" style="margin-top:12px;">' + falta + barraProg + '</div>' : '') +
    /* URL e datas descem pro rodapé, pequenas. São referência: você abre o card
       pra ver quem está ganhando, não pra ler a URL — e ela estava ocupando uma
       linha inteira acima da tabela, empurrando pra baixo o que importa. */
    '<div class="ab-pe">' +
      '<code>?ab=' + esc(ex.chave) + '</code>' +
      (ex.inicio ? '<span>desde ' + brDate(ex.inicio) + '</span>' : '') +
      (ex.fim ? '<span>encerrado em ' + brDate(ex.fim) + '</span>' : '') +
      (ex.vencedor ? '<span>vencedor: <b>' + (ex.vencedor === 'a' ? esc(ex.rotulo_a)
        : ex.vencedor === 'b' ? esc(ex.rotulo_b) : 'empate') + '</b></span>' : '') +
      '<button class="limpar" onclick="copiarUrl(' +
        JSON.stringify(URL_QUIZ + '?ab=' + ex.chave).replace(/"/g, '&quot;') + ', this)">copiar URL</button>' +
    '</div>' +
    (orfas ? '<div class="aviso" style="margin-top:10px;">' +
      '<b>' + orfas + ' venda' + (orfas > 1 ? 's ficaram' : ' ficou') + ' de fora desta tabela.</b> ' +
      'A Kiwify não informou o preço do produto ' + (orfas > 1 ? 'nelas' : 'nela') + ', então ' +
      (orfas > 1 ? 'não dá' : 'não deu') + ' pra saber a qual dos dois preços ' +
      (orfas > 1 ? 'pertencem' : 'pertence') + '. As colunas de Vendas, Receita e R$/visitante ' +
      'acima estão menores que a realidade — o resto do dashboard não é afetado.</div>' : '') +
    alerta +
    '</div>';
}

// ══════════════════════ BALANÇO ══════════════════════
/* Responde a pergunta que nenhuma outra aba responde: "estou no lucro?".
   A Visão Geral mostra o período filtrado; aqui o mês é a unidade e o
   acumulado atravessa todos eles.

   Não respeita o filtro de data de propósito: um balanço filtrado por 7 dias
   não é um balanço. O acumulado precisa de tudo pra significar alguma coisa. */

const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nomeMes = d => MES_CURTO[Number(d.slice(5, 7)) - 1] + '/' + d.slice(2, 4);

async function verBalanco() {
  const rB = await Promise.resolve(sb.rpc('fn_balanco')).catch(() => ({ error: true }));
  if (!rB || rB.error) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">O balanço ainda não existe no banco. ' +
      'Rode <b>supabase/19-balanco.sql</b> no SQL Editor.</div></div>';
    return;
  }

  /* Do mais novo pro mais velho na tela, mas o acumulado se constrói do mais
     VELHO pro mais novo — ele é a soma de tudo que veio antes. */
  const meses = (rB.data || []).slice();
  let corrido = 0;
  const comAcumulado = meses.slice().reverse().map(m => {
    corrido += Number(m.lucro);
    return { ...m, acumulado: corrido };
  }).reverse();
  const total = corrido;

  const cor = v => v >= 0 ? 'var(--bom)' : 'var(--ruim)';
  const linha = m =>
    '<tr><td class="nm"><b>' + nomeMes(m.mes) + '</b></td>' +
    '<td class="num">' + moeda(m.faturamento) + '</td>' +
    '<td class="num">' + moeda(m.liquido) + '</td>' +
    '<td class="num">' + moeda(m.anuncio) + '</td>' +
    '<td class="num">' + moeda(m.operacional) + '</td>' +
    '<td class="num"><b style="color:' + cor(m.lucro) + '">' + moeda(m.lucro) + '</b></td>' +
    '<td class="num" style="color:' + cor(m.acumulado) + '">' + moeda(m.acumulado) + '</td></tr>';

  document.getElementById('conteudo').innerHTML =
    '<div class="kpis cinco">' +
      '<div class="kpi">' + rotulo('Resultado acumulado') +
        '<div class="val" style="color:' + cor(total) + '">' + moeda(total) + '</div>' +
        '<div class="ap">' + (meses.length ? meses.length + (meses.length > 1 ? ' meses' : ' mês') : '') + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="sec">' + ico('Balanço') + '<span>Mês a mês</span></div>' +
      (comAcumulado.length
        ? '<div class="tbwrap"><table class="tb"><tr><th>Mês</th>' +
            ['Faturamento','Líquido','Anúncio','Operacional','Lucro','Acumulado']
              .map(h => '<th class="num">' + rotuloTb(h) + '</th>').join('') + '</tr>' +
          comAcumulado.map(linha).join('') + '</table></div>' +
          /* O acumulado é o número que responde "estou no lucro"; sozinho na
             tabela ele se perde entre seis colunas. */
          '<div class="nota">' + (total >= 0
            ? 'O produto está <b>no lucro</b> em ' + moeda(total) + ' desde o começo.'
            : 'O produto está <b>no prejuízo</b> em ' + moeda(Math.abs(total)) + '. ' +
              'É esse o valor que precisa entrar de lucro pra empatar.') + '</div>'
        : '<div class="vazio">Nenhum mês com movimento ainda.</div>') +
    '</div>' +
    '';
}

// ══════════════════════ REGISTROS ══════════════════════
/* Um caderno de números, e só isso.

   Tinha linha do tempo e comparação automática antes. As duas saíram: a linha
   do tempo virou lugar nenhum quando as referências passaram a guardar também
   o que mudou, e a comparação só funcionava pras poucas métricas que o
   dashboard sabe recalcular — pro resto ("sem VSL", "na h=2") ela mostrava
   traço, que é ruído com cara de dado faltando.

   O que sobrou é o que ele usa: escreveu, guardou, acha depois. */
const fmtRef = (v, u) => u === 'R$' ? moeda(v) : u === '%' ? Number(v).toFixed(1) + '%' : String(v);
const curtaRef = d => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(2, 4);

async function verRegistros() {
  const { data, error } = await sb.from('referencias').select('*')
    .order('data', { ascending: false });
  if (error) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">A tabela de referências ainda não existe. ' +
      'Rode <b>supabase/19-balanco.sql</b> no SQL Editor.</div></div>';
    return;
  }
  const refs = data || [];

  const linha = r => {
    const fim = r.ate || r.data;
    return '<tr><td class="nm"><b>' + esc(r.rotulo) + '</b></td>' +
      '<td class="num"><b>' + fmtRef(r.valor, r.unidade) + '</b></td>' +
      '<td style="white-space:nowrap;">' + curtaRef(r.data) +
        (fim !== r.data ? ' – ' + curtaRef(fim) : '') + '</td>' +
      '<td class="livre">' + (r.nota ? esc(r.nota) : '—') + '</td>' +
      '<td class="num"><button class="limpar" onclick="apagarRef(' + r.id + ')">excluir</button></td></tr>';
  };

  document.getElementById('conteudo').innerHTML =
    '<div class="card">' +
      '<div class="cabsec"><div class="sec" style="margin:0;">' + ico('Registros') +
        '<span>Registros</span></div>' +
        '<button class="prim" onclick="abrirRef()">Guardar número</button></div>' +
      (refs.length
        ? '<div class="tbwrap"><table class="tb"><tr><th>O quê</th><th class="num">Valor</th>' +
            '<th>Período</th><th>O que mudou</th><th></th></tr>' +
          refs.map(linha).join('') + '</table></div>'
        : '<div class="vazio" style="text-align:left;padding:20px 0 6px;">' +
          'Nada guardado ainda. Vale registrar os números que somem do dashboard ' +
          'quando você muda alguma coisa — a conversão de antes da última mudança, ' +
          'por exemplo.</div>') +
    '</div>';
}

async function salvarRef() {
  const btn = document.getElementById('rfSalvar');
  const erro = document.getElementById('rfErro');
  const falar = m => { erro.textContent = m; erro.style.display = 'block';
                       btn.disabled = false; btn.textContent = 'Guardar'; };
  erro.style.display = 'none';
  const rotulo = document.getElementById('rfRot').value.trim();
  const bruto = String(document.getElementById('rfVal').value).replace(',', '.');
  const valor = Number(bruto);
  if (!rotulo) return falar('Escreve o que é esse número.');
  if (!bruto.trim() || !isFinite(valor)) return falar('Valor inválido.');
  btn.disabled = true; btn.textContent = 'Guardando…';

  const de = document.getElementById('rfDe').value || iso(hojeSP());
  const { error } = await sb.from('referencias').insert([{
    rotulo, valor,
    unidade: document.getElementById('rfUni').value,
    data: de,
    ate:  document.getElementById('rfAte').value || de,
    nota: document.getElementById('rfNota').value.trim() || null,
  }]);
  if (error) return falar('Não deu pra guardar: ' + error.message);
