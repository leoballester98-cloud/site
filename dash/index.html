[COLAR AQUI]

Comece pelo passo 1.
</script>

<script type="text/plain" id="proc-vsl-georgi">
# Estrutura de VSL · Stefan Georgi

RMBC é o processo: Research, Mechanism, Brief, Copy. A estrutura abaixo é o
roteiro que sai dele.

O peso é a fatia do tempo total. Numa VSL de 30 minutos, 15% são 4 minutos e
meio.

## Os 13 blocos

| # | bloco | o que faz | peso |
|---|-------|-----------|------|
| 1 | Lead | Um dos tipos fixos: história, proclamação, nós contra eles, segredo, pergunta | 10% |
| 2 | Ponte de intriga | O único trabalho do lead é entregar a pessoa no mecanismo | 3% |
| 3 | Mecanismo do PROBLEMA | A causa escondida. Tem nome próprio | 15% |
| 4 | Absolvição | A culpa não é sua, é da causa | 4% |
| 5 | Mecanismo da SOLUÇÃO | O que neutraliza a causa. Também tem nome próprio | 25% |
| 6 | Prova entremeada | Estudo, caso, credencial, dentro do mecanismo e não depois | 8% |
| 7 | Revelação do produto | O produto como veículo do mecanismo | 8% |
| 8 | Escada de valor | Quanto valeria, em degraus | 5% |
| 9 | Oferta e preço | O número | 5% |
| 10 | Bônus | Empilha valor | 5% |
| 11 | Garantia | Tira o risco | 4% |
| 12 | Escassez | Por que agora | 3% |
| 13 | Fechamento e CTA | Um só, grande | 5% |

## A marca do método

Os blocos 3 e 5 somam **40%** da VSL. É a proporção que separa esse método dos
outros, e é onde a maioria dos roteiros encolhe justamente o que não devia.

Os dois mecanismos ganham **nome batizado**. Sem nome, a solução chega como
promessa. Com nome, chega como consequência de uma causa que a pessoa acabou de
aceitar.

Separar mecanismo do problema de mecanismo da solução é a contribuição central.
Quase todo mundo junta os dois num bloco só.

## Bloco a bloco

### Bloco 1 · Lead

10% · comprar os próximos 30 segundos

**A função.** O lead não vende. Ele impede a saída. Tudo que ele precisa fazer é
entregar a pessoa viva no bloco 3, que é onde a persuasão de verdade começa.

**Precisa ter:**

- Um dos cinco tipos, escolhido de propósito: história, proclamação, nós contra eles, segredo ou pergunta
- Uma promessa ou uma intriga concreta, com número ou situação específica
- Ritmo alto, frases curtas, nenhum aquecimento

**Erra quando:** tenta explicar o produto. Neste ponto a pessoa nem sabe que
existe um produto, e falar dele antes do mecanismo transforma a VSL num anúncio.

### Bloco 2 · Ponte de intriga

3% · atravessar do lead para o mecanismo

**A função.** Transportar a pessoa do assunto do lead para o mecanismo sem que
ela sinta a troca. É o bloco mais curto e o mais fácil de estragar.

**Precisa ter:**

- Uma pergunta que só o mecanismo responde
- A promessa de que a resposta vem agora, não no fim

**Erra quando:** resume o que vem pela frente. Resumir entrega a informação e
mata a curiosidade que o lead acabou de criar.

### Bloco 3 · Mecanismo do PROBLEMA

15% · por que nada funcionou até hoje

**A função.** Dar uma explicação nova para um fracasso velho. Enquanto a pessoa
acreditar na causa antiga, qualquer solução nova soa como mais do mesmo.

**Precisa ter:**

- **Nome próprio.** Sem nome é uma explicação; com nome é uma descoberta
- A causa real, diferente da que o mercado repete
- A negação explícita das causas que todo mundo acredita
- Uma prova: estudo, dado, autoridade externa ou caso

**Erra quando:** descreve o sintoma achando que é causa. "Seu metabolismo é
lento" é sintoma. "Um hormônio desligado trava o metabolismo" é causa. A
diferença decide se o bloco 5 tem onde se apoiar.

### Bloco 4 · Absolvição

4% · a culpa não é sua

**A função.** Transferir a culpa da pessoa para a causa. Sem isso ela ouve o
mecanismo como acusação, e quem se sente acusado não compra.

**Precisa ter:**

- Reconhecimento do esforço que ela já fez
- A frase que liga o fracasso à causa, e não a ela

**Erra quando:** soa como consolo. Absolvição é dedução lógica do bloco
anterior, não carinho. Se o mecanismo do problema estiver bem feito, este bloco
sai sozinho em duas linhas.

### Bloco 5 · Mecanismo da SOLUÇÃO

25% · o que neutraliza a causa

**A função.** Fazer a solução parecer inevitável em vez de prometida. É o maior
bloco da estrutura e o que separa esse método dos outros.

**Precisa ter:**

- **Nome próprio**, da mesma família do nome do problema, porque um é a resposta do outro
- Como funciona, em passos numerados
- Pelo menos uma analogia do cotidiano, ensinada **antes** de ser aplicada ao problema
- A ligação explícita de volta na causa do bloco 3

**Erra quando:** chega como benefício. "Você vai emagrecer" é benefício. "A
leptina reativa destrava os outros dois hormônios" é mecanismo. Benefício a
pessoa já ouviu de dez concorrentes.

### Bloco 6 · Prova entremeada

8% · sustentar cada afirmação onde ela é feita

**A função.** Provar no momento da afirmação, não depois. Prova acumulada no fim
chega tarde: a pessoa já decidiu se acredita ou não.

**Precisa ter:**

- Prova do tipo certo pra cada afirmação: estudo pra mecanismo, caso pra resultado, credencial pra autoridade
- Pelo menos duas provas em situação **pior** que a de quem assiste
- Números específicos, porque número redondo soa inventado

**Erra quando:** vira um bloco separado. No RMBC a prova é costura, não capítulo.

### Bloco 7 · Revelação do produto

8% · o produto como veículo do mecanismo

**A função.** Mostrar que o produto não é um curso qualquer: é a forma de acessar
o mecanismo que a pessoa acabou de aceitar.

**Precisa ter:**

- O nome do produto
- A frase que liga produto e mecanismo, repetindo os dois nomes batizados
- O que ele **faz**, não o que ele contém

**Erra quando:** lista módulos. Módulo é logística e vem depois. Aqui só importa
a ponte.

### Bloco 8 · Escada de valor

5% · quanto vale, antes de quanto custa

**A função.** Estabelecer a referência de preço antes de dizer o preço. Sem
âncora, qualquer número é caro.

**Precisa ter:**

- Um preço de referência **real**: consultoria, alternativa de mercado, produto maior da própria linha
- A justificativa de cada degrau
- O motivo sempre sobre a pessoa, nunca sobre a margem

**Erra quando:** inventa a âncora. Valor inflado é sentido, e derruba a
credibilidade dos blocos anteriores junto.

### Bloco 9 · Oferta e preço

5% · o número

**A função.** Dar o preço sem rodeio, depois do valor estabelecido.

**Precisa ter:**

- O valor à vista e o parcelado
- A comparação com o degrau anterior da escada
- Nenhuma hesitação

**Erra quando:** enrola antes de falar o número. Hesitação é lida como "o preço
é alto demais" mesmo quando não é.

### Bloco 10 · Bônus

5% · cada um resolve uma coisa

**A função.** Cada bônus mata uma objeção específica ou acelera o primeiro
resultado. Bônus sem função é enchimento e a pessoa percebe.

**Precisa ter:**

- Nome próprio pra cada um
- A objeção que ele mata, dita em voz alta
- De preferência um que devolva o dinheiro antes da primeira parcela vencer

**Erra quando:** empilha por quantidade. Cinco bônus sem função valem menos que
um com.

### Bloco 11 · Garantia

4% · quem assume o risco

**A função.** Transferir o risco de quem compra para quem vende, e dizer isso com
todas as letras.

**Precisa ter:**

- O prazo, comparado com o mínimo que a lei obriga
- A condição, de preferência nenhuma
- A frase que nomeia quem assume o risco

**Erra quando:** tem condição escondida. Garantia com asterisco não tira risco,
cria.

### Bloco 12 · Escassez

3% · por que agora

**A função.** Dar motivo pra hoje em vez de depois. Sem ela a pessoa fecha a
página pretendendo voltar, e não volta.

**Precisa ter:**

- Algo **verificável**: preço que já subiu antes, janela de mercado, lote real
- A consequência de adiar, em cena e não em ameaça

**Erra quando:** inventa. Vaga limitada em produto digital e página que sai do ar
são reconhecidas na hora, e queimam a confiança construída em 25 minutos.

### Bloco 13 · Fechamento e CTA

5% · o último

**A função.** Nomear os caminhos e mandar clicar. Um fechamento só, mas completo.

**Precisa ter:**

- O caminho de não fazer nada, com a cena futura do arrependimento
- O caminho de comprar
- A instrução operacional: onde clica, o que preenche, o que acontece depois

**Erra quando:** termina em despedida. Fechamento é instrução, não "espero que
tenha gostado".

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve a VSL. Você ajuda a pessoa a montar.**

O trabalho se divide em dois tipos, e eles não se tratam igual:

- **Mecânico** (cronometrar, contar palavras, checar se o bloco cabe no tempo): você faz e entrega pronto, para a pessoa conferir.
- **Escolha** (o nome do mecanismo, o ângulo, o que entra em cada bloco): você apresenta o que está em jogo e **pergunta**. Não decide no lugar dela. Se ela pedir sua opinião, dê uma curta, com o motivo.

Em todos os passos:

- Entregue exatamente o bloco do passo atual e **pare**.
- Nada de adiantar o bloco seguinte, nada de opções não pedidas. Cada passo é um turno dela, não seu.
- Se discordar de uma decisão dela sobre a estrutura, fale **uma vez**, curto. Se ela mantiver, execute a versão dela sem repetir o argumento.

## O processo

**Passo 1 · Contexto** · escolha

Antes de qualquer bloco você precisa saber:

- Qual é o produto e o que ele entrega
- Quem é o público e o que ele já tentou
- Preço, oferta, bônus e garantia
- Qual é a duração alvo da VSL

Pergunte o que faltar. Não invente nada disso.
→ um resumo do contexto, pra ela confirmar

**Passo 2 · Batizar o mecanismo do problema** · escolha

A causa escondida precisa de nome próprio. Sem nome ela é uma explicação; com
nome ela é uma descoberta.
→ 3 nomes possíveis, com o motivo de cada um

**Passo 3 · Batizar o mecanismo da solução** · escolha

O mesmo, para o que neutraliza a causa. Os dois nomes precisam soar da mesma
família, porque um é a resposta do outro.
→ 3 nomes possíveis, com o motivo de cada um

**Passo 4 · Escolher o tipo de lead** · escolha

História, proclamação, nós contra eles, segredo ou pergunta. A escolha muda o
bloco 1 inteiro e o tom dos três seguintes.
→ a recomendação, com o motivo, e a decisão fica com ela

**Passos 5 a 17 · Um bloco por turno** · escolha

Na ordem da tabela, do bloco 1 ao 13. Em cada turno, e só para o bloco daquele
turno:

- Leia a ficha daquele bloco na seção **Bloco a bloco**: a função, o que precisa ter e o erro que mata ele
- Diga o que o bloco faz e quanto tempo ele tem
- Liste os elementos que ele precisa conter
- Pergunte o que faltar pra escrever
- Escreva o bloco
- Conte as palavras e diga se cabe no tempo, a 180 palavras por minuto
- Pare

→ um bloco escrito, com o tempo conferido

**Passo 18 · Leitura corrida** · mecânico

A VSL inteira emendada, com o tempo total e a marcação de onde estourou.
→ roteiro fechado

## Sobre esta ficha

Reconstruída a partir do método publicado, não transcrita de uma fonte única. As
proporções são estimativa em cima de VSL de 30 minutos.
</script>

<script type="text/plain" id="proc-vsl-benson">
# Estrutura de VSL · Jon Benson

Ele inventou o formato de VSL em 2005. A estrutura é dirigida pela história e
fecha três vezes.

O peso é a fatia do tempo total.

## Os 15 blocos

| # | bloco | o que faz | peso |
|---|-------|-----------|------|
| 1 | Interrupção de padrão | Choca antes de explicar | 3% |
| 2 | Callout | Chama o público pelo nome | 3% |
| 3 | Promessa grande | O que ela vai ter | 4% |
| 4 | Agitação | A dor, em cena e não em conceito | 8% |
| 5 | Backstory | Quem fala e por que sofreu igual | 15% |
| 6 | A descoberta | A cena da virada | 10% |
| 7 | A solução revelada | O que ele achou | 8% |
| 8 | Produto | O que é | 5% |
| 9 | FECHAMENTO 1 emocional | Preço, garantia, CTA. Completo | 7% |
| 10 | Benefícios e prova | O que muda na vida dela | 10% |
| 11 | Quebra de objeções | E se... | 8% |
| 12 | FECHAMENTO 2 lógico | A conta fecha. Preço e CTA de novo | 5% |
| 13 | Escassez | Por que agora | 4% |
| 14 | Recapitulação | Tudo que ela leva | 5% |
| 15 | FECHAMENTO 3 medo de perder | O último | 5% |

## A marca do método

Três fechamentos, cada um **completo**: preço, garantia e CTA nos três. E cada
um puxa uma motivação diferente, coração, cabeça e medo de perder.

A lógica é simples: quem já decidiu no minuto 12 não deveria ser obrigado a
assistir até o minuto 30 pra descobrir que existe um botão.

A história carrega o roteiro, e o mecanismo aparece dentro dela. É o inverso do
Georgi, onde o mecanismo carrega e a história dá credibilidade a ele.

## Bloco a bloco

### Bloco 1 · Interrupção de padrão

3% · quebrar o piloto automático

**A função.** Quem está rolando o feed não está prestando atenção em nada. O
primeiro bloco existe pra tirar a pessoa desse estado, e só isso.

**Precisa ter:**

- Uma afirmação, imagem ou número que não combine com a expectativa
- Nenhuma saudação, nenhuma apresentação

**Erra quando:** começa educado. Educação é padrão, e padrão é exatamente o que
se está tentando interromper.

### Bloco 2 · Callout

3% · quem é essa pessoa

**A função.** Fazer a pessoa certa se identificar e a errada sair. As duas coisas
importam: audiência errada assistindo inteiro estraga a métrica e não compra.

**Precisa ter:**

- A descrição de quem é pela **situação**, não pela demografia
- De preferência algo que só quem vive aquilo reconhece

**Erra quando:** tenta incluir todo mundo. Callout que serve pra qualquer um não
chama ninguém.

### Bloco 3 · Promessa grande

4% · o motivo de ficar

**A função.** Dar à pessoa uma razão concreta pra gastar os próximos minutos.

**Precisa ter:**

- O resultado, o prazo e o que ela **não** vai precisar fazer
- Especificidade em vez de superlativo: "5 a 10kg em 3 semanas" em vez de "resultados incríveis"

**Erra quando:** promete o que o produto não entrega. Não é só risco de anúncio
reprovado: a VSL inteira passa a soar falsa, e os blocos de prova param de
funcionar.

### Bloco 4 · Agitação

8% · a dor vira cena

**A função.** Tirar a dor do conceito e colocar num momento que a pessoa
reconhece. Conceito informa; cena dói.

**Precisa ter:**

- Momentos concretos do cotidiano, não uma lista de sintomas
- A consequência social ou emocional, não só a prática
- Nada de dor inventada que ela não tem

**Erra quando:** lista sintomas. "Você sente cansaço, inchaço e falta de
energia" informa. "Você evita foto e desiste da roupa no provador" dói.

### Bloco 5 · Backstory

15% · quem fala e por quê

**A função.** Dar o direito de falar e, ao mesmo tempo, fazer a pessoa se ver ali.
É o maior bloco da estrutura do Benson, e é o motor: a história carrega o
roteiro, e o mecanismo aparece dentro dela.

**Precisa ter:**

- A queda, com número ou data
- O fundo do poço, dito sem enfeite
- O que estava em jogo
- O narrador em situação **igual ou pior** que a de quem assiste

**Erra quando:** começa pela vitória. Quem já venceu não é espelho, é distância.
A autoridade pode vir antes da queda, mas a queda tem que vir.

### Bloco 6 · A descoberta

10% · o momento da virada

**A função.** Mostrar onde a solução apareceu. A cena é o que torna a descoberta
crível: uma conclusão sem cena parece marketing.

**Precisa ter:**

- Uma cena, com lugar e circunstância
- O que foi **notado**, não o que foi concluído
- De preferência algo banal, porque banal é crível

**Erra quando:** vira "eu estudei durante anos". Estudo é processo, não cena, e
processo não emociona ninguém.

### Bloco 7 · A solução revelada

8% · o que resolve

**A função.** Nomear o princípio que resolve, antes de nomear o produto que o
vende.

**Precisa ter:**

- O nome do princípio
- O princípio em uma frase que a pessoa consiga repetir
- O primeiro resultado obtido com ele

**Erra quando:** entrega o produto aqui. Aqui é o princípio; o produto é o bloco
seguinte. Juntar os dois faz a solução parecer um argumento de venda em vez de
uma descoberta.

### Bloco 8 · Produto

5% · o que é comprável

**A função.** Converter o princípio em algo que dá pra ter.

**Precisa ter:**

- O nome
- O que ele faz **pela pessoa**
- A ponte explícita com a solução do bloco 7

**Erra quando:** descreve formato. Aulas, PDFs e horas de conteúdo são logística,
não motivo de compra.

### Bloco 9 · FECHAMENTO 1 · emocional

7% · deixa comprar quem já decidiu

**A função.** Quem se convenceu pelo coração já decidiu neste ponto. Este bloco
existe pra ela não precisar assistir mais 15 minutos pra descobrir que existe um
botão.

**Precisa ter:**

- Preço, garantia e CTA. **Completo.**
- Curto. Trinta segundos bastam
- A motivação emocional, a mesma que a história construiu

**Erra quando:** antecipa o preço sem CTA. Meio fechamento não fecha, e ainda
gasta a surpresa do número.

### Bloco 10 · Benefícios e prova

10% · como a vida muda

**A função.** Mostrar o depois, com evidência de que o depois é real.

**Precisa ter:**

- Benefícios em consequência social, não em métrica
- Provas de gente parecida com quem assiste
- Variedade de perfil, pra ninguém dizer "comigo é diferente"

**Erra quando:** lista funcionalidades. Funcionalidade é do produto; benefício é
da pessoa.

### Bloco 11 · Quebra de objeções

8% · o que trava a compra

**A função.** Responder, uma por vez, o que está entre a pessoa e o botão.

**Precisa ter:**

- A objeção dita com as palavras dela, em primeira pessoa
- A resposta com prova ou analogia, nunca com promessa
- Uma objeção por vez, começando pela que mais mata

**Erra quando:** responde objeções que ninguém tem. Isso planta dúvida onde não
havia.

### Bloco 12 · FECHAMENTO 2 · lógico

5% · deixa comprar quem precisa da conta

**A função.** Existe gente que decide quando a conta fecha, e não quando a
história emociona. Este bloco é pra ela.

**Precisa ter:**

- A comparação de custo com a alternativa que ela já considera
- O preço dividido: por mês, por dia
- Preço, garantia e CTA de novo

**Erra quando:** repete o fechamento 1 igual. A mesma motivação duas vezes não
converte duas vezes; muda a motivação, não o texto.

### Bloco 13 · Escassez

4% · por que agora

**A função.** Dar motivo pra hoje. Sem ela a pessoa fecha a página pretendendo
voltar depois, e não volta.

**Precisa ter:**

- Algo **verificável**: preço que já subiu antes, janela de mercado, lote real
- A consequência de adiar, em cena e não em ameaça

**Erra quando:** inventa. Vaga limitada em produto digital e página saindo do ar
são reconhecidas na hora, e queimam a confiança que a história construiu.

### Bloco 14 · Recapitulação

5% · a lista inteira ao lado do número pequeno

**A função.** A pessoa já foi convencida. Agora ela quer ver o que leva pra casa,
tudo junto, uma vez só.

**Precisa ter:**

- Tudo que ela recebe, em ordem, incluindo bônus
- O preço no fim, de preferência dividido por dia

**Erra quando:** resume o argumento em vez de listar a entrega. Argumento ela já
ouviu; aqui é inventário.

### Bloco 15 · FECHAMENTO 3 · medo de perder

5% · o último

**A função.** Fechar quem não fechou nos dois anteriores. A motivação aqui é
outra: não é desejo, é a antecipação do arrependimento.

**Precisa ter:**

- O caminho de não comprar, em cena futura
- O arrependimento nomeado, com uma situação específica em que ela vai lembrar deste vídeo
- A instrução operacional: onde clica, o que preenche, o que acontece depois

**Erra quando:** ameaça. Medo de perder é lembrar a pessoa do que ela já queria,
não assustá-la com o que vai acontecer se não comprar.

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve a VSL. Você ajuda a pessoa a montar.**

O trabalho se divide em dois tipos, e eles não se tratam igual:

- **Mecânico** (cronometrar, contar palavras, checar se o bloco cabe no tempo): você faz e entrega pronto, para a pessoa conferir.
- **Escolha** (o que entra na história, o ângulo, o que entra em cada bloco): você apresenta o que está em jogo e **pergunta**. Não decide no lugar dela. Se ela pedir sua opinião, dê uma curta, com o motivo.

Em todos os passos:

- Entregue exatamente o bloco do passo atual e **pare**.
- Nada de adiantar o bloco seguinte, nada de opções não pedidas. Cada passo é um turno dela, não seu.
- Se discordar de uma decisão dela sobre a estrutura, fale **uma vez**, curto. Se ela mantiver, execute a versão dela sem repetir o argumento.

## O processo

**Passo 1 · Contexto** · escolha

Antes de qualquer bloco você precisa saber:

- Qual é o produto e o que ele entrega
- Quem é o público e o que ele já tentou
- Preço, oferta, bônus e garantia
- Qual é a duração alvo da VSL

Pergunte o que faltar. Não invente nada disso.
→ um resumo do contexto, pra ela confirmar

**Passo 2 · A história** · escolha

Aqui a história é o motor, não o enfeite. Você precisa de três coisas antes de
escrever qualquer bloco: a queda, a descoberta e o que mudou depois. Sem elas os
blocos 5 e 6 não existem, e eles são 25% do roteiro.

Pergunte. História não se inventa.
→ a queda, a descoberta e a virada, em três parágrafos curtos

**Passo 3 · As três motivações** · escolha

Os fechamentos 1, 2 e 3 puxam coisas diferentes: coração, cabeça e medo de
perder. Defina agora o que vai em cada um, ou os três saem iguais.
→ o argumento de cada fechamento, em uma linha cada

**Passos 4 a 18 · Um bloco por turno** · escolha

Na ordem da tabela, do bloco 1 ao 15. Em cada turno, e só para o bloco daquele
turno:

- Leia a ficha daquele bloco na seção **Bloco a bloco**: a função, o que precisa ter e o erro que mata ele
- Diga o que o bloco faz e quanto tempo ele tem
- Liste os elementos que ele precisa conter
- Pergunte o que faltar pra escrever
- Escreva o bloco
- Conte as palavras e diga se cabe no tempo, a 180 palavras por minuto
- Pare

Nos blocos 9, 12 e 15, confira que o fechamento está **completo**: preço,
garantia e CTA nos três. Um fechamento pela metade não é fechamento.

→ um bloco escrito, com o tempo conferido

**Passo 19 · Leitura corrida** · mecânico

A VSL inteira emendada, com o tempo total e a marcação de onde estourou.
→ roteiro fechado

## Sobre esta ficha

Reconstruída a partir do que ficou público do método, não transcrita de uma
fonte única. Confiança menor que a da ficha do Georgi. As proporções são
estimativa em cima de VSL de 30 minutos.

# Estrutura de mini VSL para quiz (modelada da Hannah Franklin)

A estrutura da VSL controle da Hannah Franklin, de 30 minutos, avaliada com
Georgi e Benson e adaptada pro funil de quiz. **Nada foi removido.** O que mudou
foi a forma de cada bloco e o tempo de cada um.

**8 minutos. 21 blocos. Um fechamento.**

Cada bloco traz o **original da Hannah** embaixo, pra você ver o que ela fez
naquele lugar antes de escrever o seu.

## A peculiaridade do quiz

Quem chega nessa VSL não é um estranho. Ela passou dois minutos respondendo
perguntas. Isso muda três blocos de forma, não de função:

| bloco | numa VSL fria | numa VSL de quiz |
|-------|---------------|------------------|
| Hook | Promessa numerada pra um estranho | A entrega do resultado |
| Callout | Descreve um perfil e ela se reconhece | Nomeia o resultado do quiz, direto |
| Agitação | Você constrói a dor e ela se identifica | Você devolve o que ela acabou de responder |

E cria um bloco que não existe em VSL fria: o **quiz como etapa do método**. É
ele que transforma o quiz em prova em vez de pedágio. Sem ele, a pessoa sente
que respondeu um formulário pra ganhar um anúncio.

## Os 21 blocos

| # | bloco | como adapta pro quiz | tempo |
|---|-------|----------------------|-------|
| 1 | Hook | O resultado é o hook: o diagnóstico dela está pronto | 0:00 · 12s |
| 2 | Callout | Nomeia o que o quiz apontou como causa | 0:12 · 15s |
| 3 | Agitação | Devolve os sinais que ela marcou no quiz | 0:27 · 28s |
| 4 | Mecanismo do PROBLEMA | Por que nada do que ela tentou funcionou. Batizado | 0:55 · 68s |
| 5 | Absolvição | A culpa não é dela nem do corpo dela | 2:03 · 15s |
| 6 | Backstory | De 4 minutos na Hannah para 25 segundos | 2:18 · 25s |
| 7 | Descoberta | A cena da virada, comprimida | 2:43 · 22s |
| 8 | Mecanismo da SOLUÇÃO | O que neutraliza a causa. Batizado | 3:05 · 68s |
| 9 | O quiz como etapa do método | O quiz não foi formulário, foi a etapa 1 | 4:13 · 18s |
| 10 | Prova | Casos, entremeados no mecanismo | 4:31 · 26s |
| 11 | Autoridade | Quem assina o método | 4:57 · 15s |
| 12 | Produto | O plano que ela já gerou, completo | 5:12 · 22s |
| 13 | Quebra de objeções | As dela, filtradas pelas respostas do quiz | 5:34 · 22s |
| 14 | Future pacing | Semana 1, semana 4, semana 8 | 5:56 · 20s |
| 15 | Escada de valor | Quanto custaria cada parte separada | 6:16 · 18s |
| 16 | Oferta e preço | O número | 6:34 · 15s |
| 17 | Bônus | | 6:49 · 15s |
| 18 | Garantia | | 7:04 · 14s |
| 19 | Escassez | | 7:18 · 15s |
| 20 | Recapitulação | Tudo que ela leva | 7:33 · 12s |
| 21 | Fechamento e CTA | Um só, no fim | 7:45 · 15s |

Os blocos 4, 5 e 8 vêm do Georgi. O resto é a estrutura da Hannah, na ordem
dela.

## Onde o tempo foi parar

**Mecanismo ocupa 136s dos 480, ou 28%.** É a proporção que o Georgi prescreve,
e é o número que não pode cair. Se precisar de mais espaço pra prova ou pra
oferta, tire de outro lugar.

**Cinco blocos encolheram muito** pra caber em 8 minutos: backstory, descoberta,
prova, autoridade e future pacing. Somam quase 4 minutos na Hannah e 1min48
aqui. É de onde saiu quase todo o corte.

**A backstory é o corte mais violento**, de 4 minutos para 25 segundos. Cabe
porque quem responde dois minutos de perguntas já concedeu a confiança que a
história existiria pra construir.

**Sobre o ritmo:** a controle roda a cerca de 265 palavras por minuto, e não as
180 que a gente usa nos criativos. Ela fala rápido e corta muito. Cronometre
pelo ritmo de quem vai gravar, não pelo dela.

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve a VSL. Você ajuda a pessoa a montar.**

O trabalho se divide em dois tipos, e eles não se tratam igual:

- **Mecânico** (cronometrar, contar palavras, checar se o bloco cabe no tempo): você faz e entrega pronto, para a pessoa conferir.
- **Escolha** (o nome do mecanismo, o ângulo, o que entra em cada bloco): você apresenta o que está em jogo e **pergunta**. Não decide no lugar dela. Se ela pedir sua opinião, dê uma curta, com o motivo.

Em todos os passos:

- Entregue exatamente o bloco do passo atual e **pare**.
- Nada de adiantar o bloco seguinte, nada de opções não pedidas. Cada passo é um turno dela, não seu.
- Se discordar de uma decisão dela sobre a estrutura, fale **uma vez**, curto. Se ela mantiver, execute a versão dela sem repetir o argumento.

## O processo

**Passo 1 · Contexto** · escolha

Antes de qualquer bloco você precisa saber:

- Qual é o produto e o que ele entrega
- Quem é o público e o que ele já tentou
- **O que o quiz pergunta e o que ele devolve no final**
- Preço, oferta, bônus e garantia
- Qual é o ritmo de fala de quem vai gravar

O terceiro item é o que separa essa estrutura das outras. Sem saber o que a
pessoa respondeu e o que ela recebeu, os blocos 1, 2, 3 e 9 não têm como
existir.

Pergunte o que faltar. Não invente nada disso.
→ um resumo do contexto, pra ela confirmar

**Passo 2 · Batizar o mecanismo do problema** · escolha

A causa escondida precisa de nome próprio. Sem nome ela é uma explicação; com
nome ela é uma descoberta. Na controle o nome é "a lista de rejeitados".
→ 3 nomes possíveis, com o motivo de cada um

**Passo 3 · Batizar o mecanismo da solução** · escolha

O mesmo, para o que neutraliza a causa. Os dois nomes precisam soar da mesma
família, porque um é a resposta do outro. Na controle o nome é "o loop
viciante".
→ 3 nomes possíveis, com o motivo de cada um

**Passos 4 a 24 · Um bloco por turno** · escolha

Na ordem da tabela, do bloco 1 ao 21. Em cada turno, e só para o bloco daquele
turno:

- Diga o que o bloco faz e quanto tempo ele tem
- **Mostre o original da Hannah daquele bloco**, que está na seção seguinte, e diga o que nele transfere e o que não transfere
- Liste os elementos que ele precisa conter
- Pergunte o que faltar pra escrever
- Escreva o bloco
- Conte as palavras e diga se cabe no tempo, no ritmo definido no passo 1
- Pare

Nos blocos 1, 2, 3 e 9, use o que veio do quiz. Escrever qualquer um dos quatro
sem as respostas dela é escrever uma VSL fria com abertura de quiz colada em

# Modelagem VSL (Hannah Franklin)

As outras fichas partem de uma estrutura pronta e constroem em cima. Esta parte

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve a VSL. Você ajuda a pessoa a montar.**

O trabalho se divide em dois tipos, e eles não se tratam igual:

- **Mecânico** (cronometrar, contar palavras, medir proporção, conferir se o bloco cabe no tempo): você faz e entrega pronto, para a pessoa conferir.
- **Escolha** (o que é espinha e o que é carne, a duração alvo, o nome dos mecanismos, como o produto entra): você apresenta o que está em jogo e **pergunta**. Não decide no lugar dela. Se ela pedir sua opinião, dê uma curta, com o motivo.

Em todos os passos:

- Entregue exatamente o artefato do passo atual e **pare**.
- Nada de adiantar o passo seguinte, nada de opções não pedidas. Cada passo é um turno dela, não seu.
- Se discordar de uma decisão dela sobre a estrutura, fale **uma vez**, curto. Se ela mantiver, execute a versão dela sem repetir o argumento.

## O processo

A transcrição já está fatiada e rotulada nesta ficha. Os passos abaixo partem
daí.

Antes de tocar em qualquer bloco você precisa saber:

- Qual é o produto que vai entrar no lugar do FCC, e o que ele entrega
- Quem é o público e o que ele já tentou
- Onde a VSL nova vai rodar: anúncio frio, funil de quiz, remarketing
- Qual é a duração alvo
- Preço, oferta, bônus e garantia

Pergunte o que faltar. Não invente nada disso.
→ um resumo do contexto, pra ela confirmar

**Passo 2 · Conferir a fatia** · mecânico

Mostre a lista dos blocos, só os rótulos, na ordem. É a chance de ela discordar
de um corte antes de o corte custar caro.
→ a lista dos blocos, sem a transcrição junto

**Passo 3 · Espinha e carne** · escolha

- **Espinha**: tira e a VSL desmonta
- **Carne**: dá pra encolher ou cortar sem quebrar

A ficha já traz a marcação da Hannah lá embaixo. Use como ponto de partida e

# Playbook do sistema de mini VSL

Três mini VSLs distribuídas dentro do funil de quiz, somando 12 minutos. Não é
uma VSL de 12 minutos cortada em três: é **uma função por VSL**, e cada uma
termina mandando a pessoa pra próxima etapa do quiz.

**12:00 · 3 VSLs · 25 blocos · um fechamento só.**

São 25 posições de roteiro. Três blocos aparecem duas vezes de propósito: o
mecanismo do problema parte em 4a e 4b, a prova volta na VSL de venda como 10b,
e o CTA de etapa fecha a VSL 1 e a VSL 2.

## De onde veio

Três fontes, nessa ordem de peso:

- A **VSL controle da Hannah Franklin**, de 30 minutos, que deu a lista de blocos e a ordem
- **Georgi**, que deu os dois mecanismos batizados e a proporção de 28%
- **Benson**, que deu o arco: história antes do produto, e a ordem dos atos
- Quatro **funis de quiz de concorrentes**, 15 VSLs medidas, que deram a lógica de fragmentação e as proporções de tempo

O que veio de fora da Hannah e entrou por causa dos concorrentes: o CTA de
etapa, a reancoragem que abre a VSL de venda, e a prova repetida dentro da
oferta.

## A gradualização

Cada VSL tem **um** trabalho. Não é bloco 1 ao 8 na primeira e 9 ao 16 na
segunda — é uma função inteira por etapa.

| VSL | o trabalho dela | como termina |
|-----|-----------------|--------------|
| 1 | Fazer entender **por que nada funcionou** | Num gancho: a causa foi nomeada, não explicada |
| 2 | Fazer acreditar **que isso resolve** | Com a prova na mão e o plano fazendo sentido |
| 3 | Fazer comprar | No botão |

**A VSL 1 não entrega o mecanismo inteiro.** Ela nomeia a causa e para. A
explicação completa fica na VSL 2. É o que a Hannah faz na controle: nomeia no
primeiro minuto, explica no minuto 17. Quem sai cedo leva o conceito; quem fica
recebe a explicação, e o gancho é o que faz clicar.

**A prova não é uma VSL separada.** Ela vive dentro da VSL 2, entremeada no
mecanismo da solução. É o "prova entremeada" do Georgi: cada afirmação sustentada
no momento em que é feita, e não empilhada num bloco no fim. Foi assim que o
único concorrente de saúde dos quatro montou a dele.

**Nenhuma VSL vende antes da terceira.** O CTA da 1 e da 2 aponta pra próxima
tela do quiz, nunca pro checkout. Nos quatro funis medidos, sem exceção. Dois
botões concorrentes na mesma tela fazem os dois perderem.

## O sistema em números

| VSL | função | tempo | % | palavras |
|-----|--------|-------|---|----------|
| 1 | Por que nada funcionou | 2:15 | 19% | ~350 |
| 2 | O que resolve, com prova | 3:45 | 31% | ~580 |
| 3 | Venda | 6:00 | **50%** | ~930 |
| | **total** | **12:00** | | **~1.860** |

Palavras a 155 por minuto, o mesmo ritmo medido nos concorrentes. Eles rodam
entre 1.013 e 2.276 palavras, então estamos dentro da faixa.

**Mecanismo ocupa 202s dos 720, ou 28,1%.** É a proporção que o Georgi
prescreve, e é o número que não pode cair. Se precisar de espaço, tire de outro
lugar.

**Oferta ocupa 50%.** É a mediana dos quatro funis medidos, que vão de 35% a
69%.

## VSL 1 · Mecanismo — 2:15

**A função.** Faz a pessoa **entender e querer**. Ela sai daqui sabendo que
existe uma causa específica por trás do problema dela, que essa causa tem nome,
e que ela nunca tinha ouvido falar dessa causa. Ao mesmo tempo, vende a
oportunidade: se a causa é essa, então existe um caminho, e o caminho é o que
ela recebe se terminar o quiz.

**O que ela argumenta:** existe uma causa por trás do problema que a pessoa
nunca tinha ouvido falar. Essa causa tem nome. E enquanto ela estiver ativa,
nada do que a pessoa tentar vai funcionar, porque tudo que ela tentou mira no
lugar errado.

**O que ela NÃO faz:** não explica a solução, não apresenta produto, não vende.
Termina com a causa nomeada e um gancho.

| # | bloco | tempo | palavras |
|---|-------|-------|----------|
| 1 | Hook, o resultado parcial | 10s | ~26 |
| 2 | Callout, nomeia o resultado do quiz | 15s | ~39 |
| 3 | Agitação, devolve os sinais do quiz | 30s | ~78 |
| 4a | Mecanismo do PROBLEMA, **nomeado** | 57s | ~147 |
| 5 | Absolvição | 13s | ~34 |
| 22 | CTA de etapa | 10s | ~26 |

O bloco 4a batiza a causa e mostra por que ela passou despercebida até agora.
Não explica como se resolve. Esse é o gancho.

## VSL 2 · Prova — 3:45

**A função.** Faz a pessoa **acreditar**. Completa a explicação da causa que a
VSL 1 nomeou, entrega o mecanismo da solução batizado, e prova cada afirmação no
momento em que ela é feita. Aqui também é onde a personalização deixa de ser
promessa e vira método: o quiz que ela respondeu é a etapa 1, e é ele que torna
a entrega aplicável ao caso dela.

**O que ela argumenta:** a causa funciona assim, por isso ela passou
despercebida, e é por isso que existe um jeito específico de resolver. Funciona
para outras pessoas na mesma situação. E o quiz que a pessoa acabou de responder
é o que torna isso aplicável ao caso dela.

**A prova entra colada em cada afirmação**, não num bloco separado no fim.

| # | bloco | tempo | palavras |
|---|-------|-------|----------|
| 4b | Mecanismo do PROBLEMA, **completo** | 40s | ~103 |
| 8 | Mecanismo da SOLUÇÃO, **batizado** | 105s | ~271 |
| 9 | O quiz como etapa do método | 20s | ~52 |
| 6 | Backstory como identificação | 18s | ~46 |
| 10 | Prova | 22s | ~57 |
| 11 | Autoridade + autoridade externa | 10s | ~26 |
| 22 | CTA de etapa | 10s | ~26 |

O bloco 6 são 18 segundos, e é identificação e não história: uma frase de "eu
passei por isso". Quanto mais cético o público, mais esse bloco pesa.

O bloco 9 é onde a personalização vira argumento: o quiz não foi formulário, foi
a etapa 1 do método.

## VSL 3 · Venda — 6:00

**A função.** Faz a pessoa **comprar**. Recoloca ela no ponto, mostra em detalhe
o que recebe, derruba as objeções que sobraram, ancora o valor, dá o preço, tira
o risco e recapitula de forma breve antes do fechamento.

**O que ela argumenta:** você já entendeu a causa e já viu que existe saída;
agora, isto é exatamente o que você recebe, isto é quanto custa, isto é o que
você arrisca, e este é o motivo de ser agora.

| # | bloco | tempo | palavras |
|---|-------|-------|----------|
| 23 | Reancoragem + absolvição | 25s | ~65 |
| 12 | **Produto e o que tem dentro** | 95s | ~245 |
| 13 | Quebra de objeções | 38s | ~98 |
| 14 | Future pacing | 30s | ~78 |
| 10b | Prova curta | 32s | ~83 |
| 15 | Ancoragem | 32s | ~83 |
| 16 | Oferta e preço | 26s | ~67 |
| 17 | Bônus, resumido | 20s | ~52 |
| 18 | Garantia, breve | 15s | ~39 |
| 19 | Escassez | 15s | ~39 |
| 20 | Recapitulação, breve | 15s | ~39 |
| 21 | Fechamento e CTA | 17s | ~44 |

O bloco 12 é o maior do sistema inteiro, com 95 segundos. É o que os quatro
funis fazem: a entrega detalhada domina a VSL de oferta.

O bloco 23 é o "se você chegou até aqui, é porque já entendeu uma coisa" que
abre a VSL de venda em dois dos quatro funis medidos. Recoloca a pessoa no ponto
antes de vender.

## As regras que não se negociam

- **Mecanismo em 28%.** É a proporção do Georgi. Se algo precisar crescer, tire de prova ou de oferta, nunca daqui
- **Nenhum fechamento antecipado.** Um fechamento só, na VSL 3. O quiz já resolve o problema que o fechamento antecipado do Benson resolvia: a pessoa clica entre etapas, nunca fica refém
- **CTA de etapa nas VSLs 1 e 2**, sempre apontando pra próxima tela do quiz. Nunca pro checkout
- **Os dois mecanismos têm nome próprio.** Sem nome, a solução chega como promessa em vez de consequência
- **Nenhuma promessa que o produto não sustenta.** Em nicho de saúde isso é regra dura: o Meta reprova
- **A VSL 1 não entrega a solução.** Se ela entregar, o clique pra VSL 2 perde o motivo

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve as VSLs. Você ajuda a pessoa a montar.**

O trabalho se divide em dois tipos, e eles não se tratam igual:

- **Mecânico** (cronometrar, contar palavras, checar se o bloco cabe no tempo, medir a proporção do mecanismo): você faz e entrega pronto, para a pessoa conferir.
- **Escolha** (o nome dos mecanismos, o ângulo, o que entra em cada bloco): você apresenta o que está em jogo e **pergunta**. Não decide no lugar dela. Se ela pedir sua opinião, dê uma curta, com o motivo.

Em todos os passos:

- Entregue exatamente o bloco do passo atual e **pare**.
- Nada de adiantar o bloco seguinte, nada de opções não pedidas. Cada passo é um turno dela, não seu.
- Se discordar de uma decisão dela sobre a estrutura, fale **uma vez**, curto. Se ela mantiver, execute a versão dela sem repetir o argumento.

## O processo

**Passo 1 · Contexto** · escolha

Antes de qualquer bloco você precisa saber:

- Qual é o produto e o que ele entrega
- Quem é o público e o que ele já tentou
- **O que o quiz pergunta e o que ele devolve no final**
- Preço, oferta, bônus e garantia
- Qual é o ritmo de fala de quem vai gravar

O terceiro item é o que separa este sistema de uma VSL comum. Sem saber o que a
pessoa respondeu e o que ela recebeu, os blocos 1, 2, 3 e 9 não têm como
existir.

Pergunte o que faltar. Não invente nada disso.
→ um resumo do contexto, pra ela confirmar

**Passo 2 · Batizar o mecanismo do problema** · escolha

A causa escondida precisa de nome próprio. Ela vai ser usada duas vezes: nomeada
na VSL 1 e explicada na VSL 2. Na controle o nome é "a lista de rejeitados".
→ 3 nomes possíveis, com o motivo de cada um

**Passo 3 · Batizar o mecanismo da solução** · escolha

O mesmo, para o que neutraliza a causa. Os dois nomes precisam soar da mesma
família, porque um é a resposta do outro. Na controle o nome é "o loop
viciante".
→ 3 nomes possíveis, com o motivo de cada um

**Passo 4 · A cadeia de gradualização** · escolha

Antes de escrever qualquer bloco de mecanismo, monte a cadeia de aceitações que
leva até ele. Monta-se de trás pra frente, começando pela conclusão. A ficha
**Gradualização** traz o processo inteiro.

Isso vale para os blocos 3, 4, 8 e 13. Escrever esses quatro sem cadeia é
escrever parágrafo em vez de argumento.
→ a cadeia numerada, com o motivo de cada degrau

**Passo 5 · O corte da VSL 1** · escolha

Decidir exatamente onde a VSL 1 para. Ela nomeia a causa e não explica a
solução. Definir isso antes evita reescrever os dois primeiros blocos depois.
→ a frase exata em que a VSL 1 termina, antes do CTA

**Passos 6 em diante · Um bloco por turno** · escolha

Na ordem das tabelas, VSL 1 do bloco 1 ao 22, depois VSL 2, depois VSL 3. Em
cada turno, e só para o bloco daquele turno:

- Diga o que o bloco faz, em qual VSL ele está e quanto tempo ele tem
- Liste os elementos que ele precisa conter
- Pergunte o que faltar pra escrever
- Escreva o bloco
- Conte as palavras e diga se cabe no tempo, no ritmo definido no passo 1
- Pare

Nos blocos 1, 2, 3 e 9, use o que veio do quiz. Escrever qualquer um dos quatro
sem as respostas dela é escrever uma VSL fria com abertura de quiz colada em
cima.

Nos blocos 4a e 4b, confira que 4a **não** entrega a solução.

→ um bloco escrito, com o tempo conferido

**Passo final · Leitura corrida** · mecânico

As três VSLs emendadas, cada uma com o tempo total e a marcação de onde
estourou. Confira também:

- Mecanismo em 28% do total, somando 4a, 4b e 8
- Oferta em 50%
- VSL 1 entre 1:30 e 2:30

→ as três VSLs fechadas

## Sobre esta ficha

Derivada da VSL controle da Hannah Franklin, com as fichas do Georgi e do Benson
como avaliação, e a lógica de fragmentação tirada de quatro funis de quiz
concorrentes, 15 VSLs medidas. Aprovada em 31/08/2026.

Os tempos vêm da estrutura de mini VSL de 21 blocos, redistribuídos em três
VSLs. A ficha **Modelagem VSL (Hannah Franklin)** traz a controle inteira,
fatiada em 44 blocos.

<script type="text/plain" id="proc-vsl-gradualizacao">
# Gradualização

A técnica do Eugene Schwartz, do Breakthrough Advertising, para fazer alguém
aceitar uma conclusão que ele rejeitaria se você começasse por ela.

## O que é

Nas palavras dele:

> Gradualização é a arte de começar seu anúncio com uma declaração que será
> imediata e inteiramente aceita, e então construir uma **cadeia de aceitações**
> sobre esta primeira declaração. O propósito desta cadeia é levar seu leitor a
> uma conclusão que ele então aceitará, mas que ele não teria aceitado tão
> prontamente sem as afirmações preliminares.

Cada degrau é pequeno o bastante para não gerar resistência. Somados, eles
chegam onde um salto sozinho não chegaria.

## O papel dela

Duas coisas que o Schwartz faz questão de separar, e que mudam como você usa
isso.

**Ela decide a arquitetura, não o conteúdo.**

> Gradualização determina — não o conteúdo do seu anúncio, mas sua **estrutura**,
> sua **arquitetura**, a maneira como você constrói.

Ou seja: não é uma coisa que você escreve. É a ordem em que você coloca o que já
ia escrever.

**Ela não é prova.**

> Este processo de Gradualização não tem nada a ver com o oferecimento de prova,
> ou explicação, ou testemunhos ou documentação.

Prova é outro capítulo do livro, a **Mecanização**: a demonstração de que o
produto faz o que você afirma. As duas se empilham, mas são trabalhos
diferentes. Gradualização faz a pessoa aceitar; mecanização mostra que funciona.

**Por que isso importa mais que empilhar promessa:**

> Uma promessa totalmente acreditada tem dez vezes mais poder de venda que dez
> promessas parcialmente acreditadas.

## Como montar a cadeia

Monta-se **de trás pra frente**. É contraintuitivo e é o único jeito que
funciona.

- Escreva a **conclusão** que você quer que ela aceite no fim
- Pergunte: ela aceitaria isso agora, do jeito que está? Se não, **o que ela precisaria aceitar antes** para que isso ficasse óbvio?
- Repita a pergunta sobre a resposta anterior
- Continue até chegar numa afirmação que ela aceita **sem pensar**
- Inverta a lista. Essa é a cadeia
- Passe degrau por degrau perguntando: aqui tem salto? Se tiver, falta um degrau no meio

O teste do primeiro degrau é duro: se a pessoa precisa **concordar**, ele ainda
não é o primeiro. O primeiro degrau é aquele em que ela nem percebe que
concordou.

## Exemplo trabalhado: a cadeia da Hannah Franklin

A VSL controle usa gradualização no bloco do mecanismo da solução. Oito degraus:

| # | o que ela afirma | por que é aceito |
|---|------------------|------------------|
| 1 | O cérebro tem parte consciente e subconsciente | Conhecimento comum |
| 2 | Aprender a dirigir usa a consciente | Todo mundo viveu |
| 3 | Com repetição, dirigir vira automático | Todo mundo viveu |
| 4 | É assim que hábitos se formam | Consequência dos anteriores |
| 5 | Escovar os dentes virou hábito assim | Cena da infância dela, e da sua |
| 6 | Hábito é gatilho, rotina e recompensa | Já foi demonstrado no degrau 5 |
| 7 | Conteúdo cria o mesmo loop | O salto, mas já preparado |
| 8 | Logo, o algoritmo premia quem repete formato | A conclusão que ela queria desde o início |

**O degrau 8 seria rejeitado se dito no degrau 1.** Dito no 8, é óbvio.

## Os sete movimentos dela

Vale copiar a mecânica, não só a ideia.

- **1 · Prepara o terreno** com uma divisão simples: mente consciente e subconsciente
- **2 · Primeira analogia**, dirigir: o que era consciente vira automático
- **3 · Segunda analogia**, escovar os dentes: uma cena de infância, não um conceito
- **4 · Só agora nomeia** os três passos: gatilho, rotina e recompensa
- **5 · Roda os três passos no exemplo banal**: mau hálito, escovar, frescor
- **6 · A pergunta que vira a chave**: "mas o que isso tem a ver com o problema?"
- **7 · Roda os mesmos três passos no contexto dela**

**Duas decisões dela que fazem isso funcionar:**

Ela **nomeia os passos depois do exemplo, não antes**. O exemplo compra a
crença; o nome só carimba. Abrir com o nome seria jargão.

Ela **roda a sequência duas vezes**. Uma em algo que ninguém contesta, outra no
problema que ela vende. A pessoa aceita a primeira sem resistência e a segunda
vem de carona.

## Onde isso entra numa mini VSL

Gradualização não é um bloco. Ela roda **dentro** de blocos. Numa estrutura de
21 blocos, os quatro onde ela pesa:

| bloco | a cadeia serve para |
|-------|----------------------|
| 3 · Agitação | Levar da dor que ela sente até a suspeita de que a causa é outra |
| 4 · Mecanismo do PROBLEMA | Fazer aceitar uma causa que ela nunca ouviu |
| 8 · Mecanismo da SOLUÇÃO | Fazer a solução parecer consequência, não promessa |
| 13 · Quebra de objeções | Derrubar a objeção com exemplos que ela não contesta |

O bloco 8 é onde ela pesa mais, e é o mais longo da estrutura justamente por
isso.

## Como trabalhar, leia antes de tudo

Copie esta ficha inteira e cole numa IA. O que vem daqui pra baixo é instrução
pra ela.

**Você não escreve a cadeia. Você ajuda a pessoa a montar.**

- **Mecânico** (inverter a lista, checar salto entre degraus, contar quantos degraus há): você faz e entrega pronto.
- **Escolha** (qual é a conclusão, qual analogia usar, onde começa a cadeia): você apresenta o que está em jogo e **pergunta**.

Entregue o artefato do passo atual e **pare**. Cada passo é um turno dela.

## O processo

**Passo 1 · A conclusão** · escolha

Qual é a única coisa que a pessoa precisa aceitar no fim desse bloco? Uma frase,
não três.
→ a conclusão, escrita como ela seria dita

**Passo 2 · A cadeia, de trás pra frente** · escolha

Pergunte o que ela precisaria aceitar antes, e repita sobre cada resposta, até
chegar numa afirmação que ela aceita sem pensar.
→ a lista, de baixo pra cima

**Passo 3 · A cadeia na ordem** · mecânico

Inverta e numere. Marque cada degrau com o motivo de ele ser aceito.
→ a cadeia numerada, com o motivo de cada degrau

**Passo 4 · Caça ao salto** · mecânico

Degrau por degrau: aqui a pessoa precisa acreditar em algo que ainda não foi
estabelecido? Se sim, falta degrau no meio.
→ a lista dos saltos, ou a confirmação de que não há

**Passo 5 · A analogia** · escolha

Se a cadeia for longa, uma analogia do cotidiano faz o trabalho de três degraus.
Ela precisa ser **cena**, não ilustração: "minha mãe me mandando escovar os
dentes" é cena; "imagine um rádio" não é.
→ 3 analogias possíveis, com o motivo de cada uma

**Passo 6 · A copy** · escolha

Só agora se escreve. A cadeia vira falas, na ordem, com o tempo do bloco.
→ o bloco escrito, com o tempo conferido

Baseada no capítulo de Gradualização do Breakthrough Advertising, de Eugene
Schwartz. As citações vêm de uma tradução automática do livro, então o
