/* Mapa de calor dia da semana × hora. A pergunta "qual dia e hora vende mais"
   é sobre a COMBINAÇÃO — dois gráficos separados, um por dia e um por hora,
   escondem exatamente o que se procura: um bolsão de quinta à noite soma pouco
   nos dois eixos separados e desaparece.

   E ele deixa a escassez à vista. Uma grade quase toda vazia se explica sozinha;
   barras somam tudo e parecem sólidas com três vendas. */
const DIAS_SEM = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function mapaHorario(linhas) {
  const m = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let total = 0, teto = 0;
  (linhas || []).forEach(l => {
    const d = Number(l.dia), h = Number(l.hora), v = Number(l.vendas) || 0;
    if (d >= 0 && d < 7 && h >= 0 && h < 24) { m[d][h] += v; total += v; }
  });
  m.forEach(r => r.forEach(v => { if (v > teto) teto = v; }));

  if (!total) {
    return '<div class="vazio">Nenhuma venda no período. Este mapa começa a se ' +
      'formar com as vendas que chegam pelo webhook da Kiwify — leva algumas ' +
      'semanas até um padrão de dia da semana significar alguma coisa.</div>';
  }

  const porDia  = m.map(r => r.reduce((a, v) => a + v, 0));
  const maiorDia = Math.max(...porDia);

  /* Um tom só, do claro ao escuro, proporcional à contagem. Escala de cor com
     várias matizes daria a impressão de categorias diferentes onde só existe
     "mais" e "menos". O piso de 12% garante que uma venda solitária apareça. */
  const cel = (v, d, h) => {
    const forca = teto ? (v ? 12 + (v / teto) * 88 : 0) : 0;
    const fundo = v ? 'color-mix(in srgb, var(--marca) ' + forca.toFixed(0) + '%, var(--surface-2))'
                    : 'var(--surface-2)';
    const dica = v
      ? v + (v > 1 ? ' vendas' : ' venda') + ' — ' + DIAS_SEM[d] + ', ' + String(h).padStart(2, '0') + 'h'
      : 'Nenhuma venda — ' + DIAS_SEM[d] + ', ' + String(h).padStart(2, '0') + 'h';
    return '<i class="mp-cel temdica" data-dica="' + esc(dica) + '" style="background:' + fundo + '"></i>';
  };

  /* Total do dia entra na MESMA grade, como colunas extras, e não numa lista ao
     lado. Duas listas de sete itens lado a lado sempre desalinham: a altura da
     linha do mapa vem da largura da célula (aspect-ratio), e nenhuma altura fixa
     na lista vizinha acompanha isso. Na mesma grade, alinhar deixa de ser algo
     que pode dar errado. */
  return '<div class="mp-grade">' +
      '<div class="mp-canto"></div>' +
      /* Rótulo a cada 3 horas: 24 números seguidos viram uma faixa cinza que
         ninguém lê, e de 3 em 3 ainda dá pra localizar qualquer coluna. */
      Array.from({ length: 24 }, (_, h) =>
        '<div class="mp-h">' + (h % 3 === 0 ? String(h).padStart(2, '0') : '') + '</div>').join('') +
      '<div class="mp-vao"></div><div class="mp-tit">por dia</div><div></div>' +

      m.map((linha, d) =>
        '<div class="mp-d">' + DIAS_SEM[d] + '</div>' +
        linha.map((v, h) => cel(v, d, h)).join('') +
        '<div class="mp-vao"></div>' +
        '<span class="mp-barra"><i style="width:' +
          (maiorDia ? (porDia[d] / maiorDia * 100).toFixed(0) : 0) + '%"></i></span>' +
        '<b class="mp-num">' + porDia[d] + '</b>'
      ).join('') +
  '</div>';
}

// ══════════════════════ TESTE A/B ══════════════════════
/* O que esta aba faz que uma tabela de porcentagens não faz: dizer QUANDO a
   diferença é real. Sem isso, 62% contra 58% com 80 sessões parece vitória e
   não é — é o intervalo de erro dos dois se sobrepondo. */

/* Normal acumulada, aproximação de Zelen & Severo (26.2.17). Erro abaixo de
   7,5e-8, muito além do que qualquer decisão aqui exige. */
function normalAcum(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
  return z > 0 ? 1 - p : p;
}

/* log(n!) com cache crescente. Multiplicar fatoriais direto estoura o ponto
   flutuante bem antes dos tamanhos que este dashboard alcança; somando
   logaritmos, não estoura nunca. */
const _logFat = [0, 0];
function logFat(n) {
  for (let i = _logFat.length; i <= n; i++) _logFat[i] = _logFat[i - 1] + Math.log(i);
  return _logFat[n];
}

/* Fisher exato, bicaudal. Vale em QUALQUER tamanho de amostra — não depende de
   aproximação nenhuma. Soma a probabilidade de todas as tabelas, com as mesmas
   margens, tão ou menos prováveis que a observada. */
function fisher(a, b, c, d) {
  const n = a + b + c + d;
  if (!n) return 1;
  const lp = (x) => logFat(a + b) + logFat(c + d) + logFat(a + c) + logFat(b + d) - logFat(n)
                  - logFat(x) - logFat(a + b - x) - logFat(a + c - x) - logFat(d - a + x);
  const p0 = Math.exp(lp(a));
  let soma = 0;
  for (let x = Math.max(0, a - d); x <= Math.min(a + b, a + c); x++) {
    const p = Math.exp(lp(x));
    if (p <= p0 * (1 + 1e-9)) soma += p;
  }
  return Math.min(1, soma);
}

/* Bicaudal porque a pergunta honesta é "as duas são diferentes?", não "a nova é
   melhor?" — a segunda já assume a resposta e dobra a chance de falso positivo.

   Qual dos dois testes: o z é rápido mas a aproximação normal só vale com pelo
   menos 5 sucessos E 5 fracassos em cada braço. Abaixo disso ele infla a
   confiança — nos primeiros dados reais deste experimento dava 91,3% onde o
   Fisher dava 81,8%, e 74,9% onde o Fisher dava 54,5%. Então o Fisher entra
   sempre que alguma célula for pequena, que é justamente quando a diferença
   entre os dois importa. */
function significancia(x1, n1, x2, n2) {
  if (!n1 || !n2) return null;
  const p1 = x1 / n1, p2 = x2 / n2;
  const miudo = Math.min(x1, n1 - x1, x2, n2 - x2) < 5;
  const pool = (x1 + x2) / (n1 + n2);
  const se = Math.sqrt(pool * (1 - pool) * (1 / n1 + 1 / n2));
  const z = se ? (p1 - p2) / se : 0;
  const p = miudo ? fisher(x1, n1 - x1, x2, n2 - x2)
                  : (se ? 2 * (1 - normalAcum(Math.abs(z))) : 1);
  return { z: p1 - p2 >= 0 ? Math.abs(z) : -Math.abs(z), p, p1, p2, exato: miudo,
           lift: p2 ? (p1 - p2) / p2 * 100 : null };
}

/* Piso de volume antes de qualquer veredito. Não é estatística, é prudência:
   com poucas dezenas de visitantes o Fisher já devolve um número honesto, mas
   um "tendência" nascido de 11 pessoas ensina a confiar em ruído. */
const MIN_BRACO = 30;

/* Piso do teste de PREÇO, em vendas por braço. Dez porque abaixo disso o erro
   da estimativa de R$/visitante é maior que a diferença que o teste procura:
   o erro relativo anda perto de 1/√vendas, ou seja ~32% com dez e ~45% com
   cinco. Comparar dois números com 45% de margem não é medir, é adivinhar. */
const MIN_VENDAS = 10;

/* Confiança exigida pra chamar um vencedor. 95% é o padrão científico; aqui é
   80%, por escolha dele — com o tráfego atual, esperar 95% significa nunca
   decidir, e nunca decidir também é uma decisão, só que sem ninguém assumir.

   O preço é real e está pago de propósito: a 80%, cerca de 1 em 5 vereditos
   vai apontar um vencedor que não existe. Em troca, a amostra necessária cai
   uns 43% e o teste conclui em tempo de servir pra alguma coisa.

   Pra voltar ao padrão, é trocar os dois números por 0.95 e 1.959964. */
const CONFIANCA = 0.80;
const Z_ALFA    = 1.281552;   // bicaudal, alfa = 0,20

/* Receita por visitante — a métrica que decide um teste de PREÇO, porque um
   preço maior pode converter menos e ainda faturar mais.

   Não dá pra usar o teste de proporção aqui: a comparação não é entre duas
   taxas, é entre duas médias em reais. Mas a variância não precisa vir da
   receita venda a venda — cada visitante rende o preço do braço ou rende zero,
   então a distribuição é Bernoulli vezes preço, e média e variância saem da
   conversão e do preço médio, que já estão na mão. */
function significanciaRPV(x1, n1, rec1, x2, n2, rec2) {
  if (!n1 || !n2) return null;
  const m1 = rec1 / n1, m2 = rec2 / n2;
  const p1 = x1 / n1, p2 = x2 / n2;
  const pr1 = x1 ? rec1 / x1 : 0, pr2 = x2 ? rec2 / x2 : 0;
  const v1 = p1 * (1 - p1) * pr1 * pr1, v2 = p2 * (1 - p2) * pr2 * pr2;
  const se = Math.sqrt(v1 / n1 + v2 / n2);
  if (!se) return null;
  const z = (m1 - m2) / se;
  /* v1 e v2 saem daqui porque o cálculo de "quantos visitantes faltam" precisa
     delas: comparação de médias usa variância, não proporção. */
  return { z, p: 2 * (1 - normalAcum(Math.abs(z))), m1, m2, v1, v2,
           lift: m2 ? (m1 - m2) / m2 * 100 : null };
}

/* Quantos visitantes POR BRAÇO pra enxergar a diferença que está aparecendo.
   Poder de 80% — a chance de detectar o efeito, se ele existir de verdade.
   Serve pra responder "já posso parar?" antes de parar por impaciência. */
function amostraNecessaria(p1, p2) {
  if (p1 === p2 || !isFinite(p1) || !isFinite(p2)) return null;
  const pm = (p1 + p2) / 2;
  const n = Math.pow(Z_ALFA * Math.sqrt(2 * pm * (1 - pm)) +
                     0.841621 * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2)), 2) /
            Math.pow(p1 - p2, 2);
  return Math.ceil(n);
}

const URL_QUIZ = 'https://protocolociclofertil.com.br/quiz/v2/';

/* A URL some do corpo do card, então precisa de um jeito de pegá-la sem
   selecionar texto pequeno com o mouse. O rótulo confirma na própria tecla —
   um alerta pra dizer "copiei" interromperia mais do que ajuda.

   Dois caminhos porque o primeiro falha em situações banais: navigator.clipboard
   recusa se o documento não estiver em foco, e não existe em http sem TLS. O
   execCommand é obsoleto mas funciona nesses casos, e a última reserva é deixar
   a URL selecionada na tela pra um Cmd+C manual — nunca um beco sem saída. */
async function copiarUrl(url, botao) {
  const antesDoChip = botao.textContent;
  botao.classList.add('copiando');
  const avisar = t => {
    const antes = botao.dataset.antes || botao.textContent;
    botao.dataset.antes = antes;
    botao.textContent = t;
    setTimeout(() => { botao.textContent = antes; botao.classList.remove('copiando'); }, 1600);
  };

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      return avisar('copiado');
    }
  } catch (e) { /* cai no plano B */ }

  const ta = document.createElement('textarea');
  ta.value = url;
  ta.setAttribute('readonly', '');
  /* Fora da tela, mas NÃO display:none nem visibility:hidden — o navegador não
     seleciona o conteúdo de um elemento que não ocupa espaço. */
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) return avisar('copiado');

  /* Nem um nem outro: mostra a URL selecionada, pra um Cmd+C resolver.

     O aviso vai num elemento à parte, e não trocando o texto do gatilho: agora
     o gatilho É o chip da URL, então avisar() aqui apagaria justamente a URL
     que a pessoa precisa selecionar. E o prazo é maior que o do 'copiado' —
     1,6s dá pra ler uma confirmação, não pra achar o teclado. */
  const cod = botao.matches('code') ? botao : botao.closest('.ab-pe').querySelector('code');
  /* Tira o verde do 'copiando'. Chegar aqui é o contrário de sucesso — a
     combinação ✓ verde com 'copie com Cmd+C' ao lado dizia as duas coisas ao
     mesmo tempo, e a que o olho pega primeiro é a errada. */
  botao.classList.remove('copiando');
  cod.classList.add('copiafalhou');
  cod.textContent = url;
  const faixa = document.createRange();
  faixa.selectNodeContents(cod);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(faixa);

  const dica = document.createElement('span');
  dica.className = 'ab-copia-dica';
  dica.textContent = 'copie com Cmd+C';
  cod.after(dica);
  setTimeout(() => {
    dica.remove();
    cod.classList.remove('copiafalhou');
    cod.textContent = antesDoChip;
  }, 8000);
}

/* Amostra necessária para uma diferença entre MÉDIAS, mesma dupla de sempre
   (95% de confiança, 80% de poder). É outra fórmula da de proporções, e usar a
   errada aqui daria número sem sentido — a de proporção espera dois valores
   entre 0 e 1, e receita por visitante é reais. */
function amostraNecessariaMedia(v1, v2, dif) {
  if (!dif || !isFinite(dif)) return null;
  return Math.ceil(Math.pow(Z_ALFA + 0.841621, 2) * (v1 + v2) / (dif * dif));
}

async function verAB() {
  const p = periodo();
  const { data: exps, error: eE } = await sb.from('experimentos').select('*').order('inicio', { ascending:false });
  if (eE) throw eE;
  if (!exps || !exps.length) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">Nenhum experimento cadastrado. ' +
      'Rode <b>supabase/12-experimentos.sql</b> no SQL Editor.</div></div>';
    return;
  }

  const partes = [];
  for (const ex of exps) {
    /* Promise.resolve em volta do rpc: o retorno do supabase-js é um thenable,
       não uma Promise — tem .then mas não tem .catch, e chamar .catch direto
       nele derruba a aba inteira. A tolerância existe porque fn_experimento_
       vendas pode não estar no banco ainda (13-vendas-kiwify.sql), e o funil
       não deveria sumir por causa disso. */
    const [rF, rV] = await Promise.all([
      sb.rpc('fn_experimento', { p_exp: ex.chave, p_de: p.de, p_ate: p.ate }),
      Promise.resolve(sb.rpc('fn_experimento_vendas', { p_exp: ex.chave, p_de: p.de, p_ate: p.ate }))
        .catch(() => ({ data: [] })),
    ]);
    if (rF.error) throw rF.error;
    partes.push(cartaoExperimento(ex, rF.data || [], (rV && rV.data) || []));
  }
  document.getElementById('conteudo').innerHTML = partes.join('');
}

function cartaoExperimento(ex, linhas, vendas) {
  const vazio = { sessoes:0, tela1:0, tela2:0, fim:0, checkout:0 };
  const bruto = (lado, rot) => linhas.find(l => l.lado === lado) || { ...vazio, rotulo: rot };

  /* Junta as duas fontes numa linha só por braço: o funil vem da `eventos`
     (quem passou por onde) e o dinheiro vem do webhook da Kiwify. Fontes
     diferentes, mesma linha — é o que permite ler o braço inteiro de uma vez.
     rpv fica calculado aqui e não no banco: ele é razão de duas coisas que
     chegam separadas, e a conta tem que ser a mesma dos dois lados. */
  const dinheiro = {};
  (vendas || []).forEach(v => { dinheiro[v.marca] = v; });
  const juntar = (l, marca) => {
    const d = dinheiro[marca] || { vendas:0, reembolsos:0, receita:0 };
    const n = Number(l.tela1) || 0;
    return { ...l, vendas: Number(d.vendas) || 0, reembolsos: Number(d.reembolsos) || 0,
             receita: Number(d.receita) || 0, rpv: n ? Number(d.receita) / n : 0 };
  };
  const A = juntar(bruto('a', ex.rotulo_a), ex.braco_a);
  const B = juntar(bruto('b', ex.rotulo_b), ex.braco_b);
  const nA = Number(A.tela1), nB = Number(B.tela1);
  const tot = nA + nB;

  const badge = (txt, cor) => '<span class="abtag" style="--c:' + cor + '">' + txt + '</span>';

  /* Desvio de divisão (SRM). O sorteio é 50/50: se a fatia real fugir muito
     disso, o problema é técnico — um braço quebrando, cache servindo sempre a
     mesma tela — e NENHUM número da tabela vale antes de achar a causa.
     Abaixo de 100 visitantes não dá pra distinguir desvio de acaso, então nem
     acusa: alarme falso no começo do teste ensina a ignorar o alarme. */
  const torta = tot >= 100 && Math.abs(nA - tot / 2) / Math.sqrt(tot * 0.25) > 3;
  const alerta = torta
    ? '<div class="erro" style="margin-top:10px;">Divisão fora do esperado: ' +
      nA + ' contra ' + nB + ', quando o sorteio é 50/50. Isso costuma ser falha técnica ' +
      '(um braço com erro, cache entregando sempre a mesma tela). Investigue antes de ler os números acima.</div>'
    : '';


  /* Uma coluna por número, uma linha por variante — assim cada braço se lê de
     uma vez, da esquerda pra direita, como uma ficha.

     `base` é o denominador da porcentagem. Visitantes não tem: ele É o
     denominador dos outros três, então ali a fração mostra a fatia do sorteio.
     Nos outros a base é sempre `tela1`, e não a etapa anterior — com a mesma
     população embaixo, as três porcentagens podem ser lidas em sequência. */
  /* Cada teste mostra só as colunas da SUA pergunta. Um teste de tela pergunta
     quantas pessoas seguem; um de preço pergunta quanto dinheiro entra. Juntar
     as duas listas não dá mais informação — dá mais coluna pra atravessar antes
     de achar a que importa. O `foco` vem do banco, então teste novo escolhe a
     leitura dele sem tocar em código. */
  const CAMPOS = {
    tela1:    { rotulo:'Visitantes',         base:null,    sorteio:true },
    tela2:    { rotulo:'Tela 1 → tela 2',    base:'tela1' },
    fim:      { rotulo:'Chegou ao fim',      base:'tela1' },
    checkout: { rotulo:'Clicou no checkout', base:'tela1' },
    vendas:   { rotulo:'Vendas',             base:'tela1' },
    receita:  { rotulo:'Receita',            base:null, moeda:true, semTeste:true },
    rpv:      { rotulo:'R$/visitante',       base:null, moeda:true, decide:true },
  };
  const FOCO = {
    tela:     ['tela1', 'tela2', 'fim', 'checkout'],
    dinheiro: ['tela1', 'checkout', 'vendas', 'receita', 'rpv'],
  };
  const COLS = (FOCO[ex.foco] || FOCO.tela).map(c => ({ campo: c, ...CAMPOS[c] }));

  /* Uma vez por coluna, reaproveitada pelas três linhas de comparação.
     Receita e R$/visitante não são proporção: comparar duas médias em reais
     pede outro teste, e é o que significanciaRPV faz. Receita sozinha não
     ganha teste nenhum — ela não é comparável entre braços de tamanho
     diferente, é o R$/visitante que normaliza isso. */
  const sig = {};
  COLS.forEach(c => {
    if (c.decide) sig[c.campo] = significanciaRPV(A.vendas, nA, A.receita, B.vendas, nB, B.receita);
    else if (c.base) sig[c.campo] = significancia(Number(A[c.campo]), nA, Number(B[c.campo]), nB);
  });

  /* A barra é o que faz esta tabela ser lida de relance: duas linhas empilhadas
     viram dois comprimentos, e comprimento se compara sem passar pelos dígitos.
     Todas partem da mesma borda esquerda da célula, senão não haveria o que
     comparar.

     A cor segue o BRAÇO, sempre a mesma, nunca quem está ganhando. Cor por
     posição faria a tabela se repintar a cada dado novo, e a memória visual do
     "azul é a nova" — que é o que permite ler rápido — se perderia. */
  /* Colunas em reais não têm base própria pra virar porcentagem, então a barra
     delas é relativa ao MAIOR dos dois braços — o que se quer ver ali é qual
     dos dois é maior e por quanto, não que fração de um todo cada um é. */
  const tetoR = {};
  COLS.filter(c => c.moeda).forEach(c => {
    tetoR[c.campo] = Math.max(Number(A[c.campo]) || 0, Number(B[c.campo]) || 0);
  });

  const linhaBraco = (L, rotulo, cor, venceu) =>
    '<tr' + (venceu ? ' class="abwin"' : '') + '>' +
    '<td class="nm"><b>' + esc(rotulo) + '</b></td>' +
    COLS.map(c => {
      const x = Number(L[c.campo]) || 0;
      if (c.moeda) {
        const larg = tetoR[c.campo] ? x / tetoR[c.campo] * 100 : 0;
        return '<td class="num"><b>' + (x ? moeda(x) : '—') + '</b>' +
               '<span class="abbar"><i style="width:' + larg.toFixed(1) + '%;background:' + cor + '"></i></span></td>';
      }
      const d = c.base ? Number(L[c.base]) : tot;
      const taxa = d ? x / d * 100 : 0;
      return '<td class="num"><b>' + x + '</b> <span class="abfrac">' +
             (d ? taxa.toFixed(1) + '%' : '—') + '</span>' +
             '<span class="abbar"><i style="width:' + taxa.toFixed(1) + '%;background:' + cor + '"></i></span>' +
             '</td>';
    }).join('') + '</tr>';

  /* As três linhas de baixo comparam os dois braços, então não pertencem a
     nenhum deles. A borda em cima da primeira separa "o que cada um fez" de
     "o que isso quer dizer". */
  /* Abaixo do piso, confiança e veredito ficam em branco. A diferença bruta
     continua aparecendo: ela é o que foi medido, não uma conclusão sobre ele. */
  /* O piso é medido na unidade que decide o teste, e ela muda com o tipo.
     Num teste de tela é o visitante: a passagem de tela se move a cada visita,
     então 30 visitas por braço já dão sinal.
     Num teste de preço é a VENDA. R$/visitante só se move quando alguém compra
     — 30 visitantes sem nenhuma venda não são "quase lá", são zero informação,
     e a barra enchendo até o piso dizia o contrário. */
  const porVenda = ex.foco === 'dinheiro';
  const PISO     = porVenda ? MIN_VENDAS : MIN_BRACO;
  const unidade  = porVenda ? 'vendas' : 'visitantes';
  const cA = porVenda ? Number(A.vendas) : nA;
  const cB = porVenda ? Number(B.vendas) : nB;
  const menor  = Math.min(cA, cB);
  const poucos = menor < PISO;

  /* Sem dizer "de quem em relação a quem", um -20,8% na coluna de R$/visitante
     lê como "a receita caiu", quando o que ele diz é que o primeiro braço rende



  /* Quanto falta, medido na métrica principal, com barra pra dar a distância de
     relance. Enquanto está abaixo do piso, o alvo é o próprio piso: estimar
     amostra a partir de uma diferença medida em 11 pessoas produzia frases como
     "faltam 15 visitantes" — animadora e sem qualquer base. */
  /* Qual métrica manda no "quanto falta". Ela sai do TIPO do teste, não de um
     padrão fixo: num teste de tela a pergunta é quem passa da primeira tela;
     num de preço é quanto entra por visitante. Medir a distância pela métrica
     errada dá um alvo que não responde a pergunta que o teste faz.

     No de preço é sempre o R$/visitante, mesmo com zero venda. Ele já caiu pro
     clique no checkout enquanto não houvesse venda, e isso mentia sobre o que
     está sendo testado: clique mede reação ao preço, não quanto entra. Um preço
     pode perder cliques e ainda assim ganhar dinheiro — é exatamente a aposta
     deste teste, e decidir pelo clique enterraria justamente o braço certo. */
  const campoPrim = porVenda ? 'rpv' : 'tela2';
  const nomePrim = (CAMPOS[campoPrim] || {}).rotulo || campoPrim;
  const sPrim = sig[campoPrim];
  let falta = '', alvo = 0;
  if (poucos) {
    alvo = PISO;
    falta = porVenda
      ? 'Teste começando: <b>' + cA + '</b> e <b>' + cB + '</b> vendas. Num teste de preço ' +
        'quem decide é a venda, não a visita — a conta passa a valer com ' + PISO + ' em cada braço.'
      : 'Teste começando: <b>' + cA + '</b> e <b>' + cB + '</b> visitantes. ' +
        'A estatística passa a valer a partir de ' + PISO + ' por braço.';
  } else if (sPrim && sPrim.p >= (1 - CONFIANCA)) {
    const nec = campoPrim === 'rpv'
      ? amostraNecessariaMedia(sPrim.v1, sPrim.v2, sPrim.m1 - sPrim.m2)
      : amostraNecessaria(sPrim.p1, sPrim.p2);
    /* amostraNecessariaMedia só serve pro R$/visitante, que compara médias em
       reais. Nas outras a conta é de proporção. */
    if (nec && isFinite(nec)) {
      alvo = Math.max(nec, MIN_BRACO);   /* daqui pra frente o alvo é em visitantes */
      falta = 'Para a diferença em <b>' + esc(nomePrim) +
              '</b> virar conclusão, são ~<b>' + alvo.toLocaleString('pt-BR') +
              '</b> visitantes por braço. Você tem ' + nA + ' e ' + nB + '.';
    } else {
      falta = 'Os dois braços estão praticamente iguais — nesse ritmo o teste não conclui.';
    }
  } else if (sPrim) {
    falta = 'Pode decidir.';   /* o resto já foi dito no subtítulo */
  }
  /* A barra muda de unidade junto com o alvo. Antes do piso ela mede a unidade
     que decide o teste (venda, no de preço); depois dele o alvo vem de
     amostraNecessaria*, que responde em VISITANTES nos dois casos. Dividir
     vendas por um alvo em visitantes daria uma barra parada perto do zero. */
  const feito = poucos ? menor : Math.min(nA, nB);
  const barraProg = alvo
    ? '<span class="abprog"><i style="width:' + Math.min(100, feito / alvo * 100).toFixed(1) + '%"></i></span>'
    : '';

  const decidido = !poucos && sPrim && sPrim.p < (1 - CONFIANCA);
  const venceuA = decidido && sPrim.z > 0;
  const venceuB = decidido && sPrim.z < 0;

  /* ── A resposta, em cima e em uma frase ──────────────────────────────────
     A tabela responde 'quem está ganhando' só se você cruzar linha com coluna
     de cabeça. Isso é trabalho que a tela devia fazer, não quem lê. Aqui em
     cima fica o estado do teste em texto: se dá pra concluir, quem venceu, e
     por quanto. A tabela passa a ser o detalhe de quem quiser conferir. */
  let tituloEstado, subEstado, corEstado;

  /* !tot é sobre TRÁFEGO e continua olhando visitante mesmo no teste de preço:
     "nenhuma venda" e "nenhum visitante" são problemas diferentes, e só o
     segundo quer dizer que a URL não está rodando. */
  if (!tot) {
    tituloEstado = 'Ainda não chegou ninguém';
    subEstado    = 'O teste começa a contar quando o tráfego entrar pela URL abaixo.';
    corEstado    = 'var(--ink-3)';
  } else if (poucos) {
    tituloEstado = 'Cedo demais pra concluir';
    subEstado    = porVenda
      ? '<b>' + cA + '</b> e <b>' + cB + '</b> vendas. Num teste de preço quem decide é a ' +
        'venda, não a visita — a conta passa a valer com ' + PISO + ' em cada braço.'
      : '<b>' + cA + '</b> e <b>' + cB + '</b> visitantes. A conta começa a valer ' +
        'com ' + PISO + ' em cada braço.';
    corEstado    = 'var(--ink-3)';
  } else if (decidido) {
    const venc = venceuA ? (A.rotulo || ex.rotulo_a) : (B.rotulo || ex.rotulo_b);
    const c = CAMPOS[campoPrim] || {};
    /* pct e não toFixed: toFixed devolve ponto decimal, e este trecho tinha
       escapado da correção de formato — saía "32.7%" num painel em português. */
    const vA = c.moeda ? moeda(A[campoPrim]) : pct(Number(A[campoPrim]) / (nA || 1) * 100);
    const vB = c.moeda ? moeda(B[campoPrim]) : pct(Number(B[campoPrim]) / (nB || 1) * 100);
    tituloEstado = esc(venc) + ' vence';
    /* O tamanho da amostra entra aqui porque é ele que responde "por que já
       concluiu". Sem o número, a confiança de 85% aparece como afirmação que a
       pessoa tem que aceitar; com ele, dá pra ver de onde veio. */
    subEstado    = 'Em <b>' + esc(nomePrim) + '</b>: ' + vA + ' contra ' + vB +
                   ', em <b>' + cA + '</b> e <b>' + cB + '</b> ' + unidade +
                   '. ' + ((1 - sPrim.p) * 100).toFixed(0) + '% de confiança.';
    corEstado    = 'var(--bom)';
  } else {
    const conf = sPrim ? ((1 - sPrim.p) * 100).toFixed(0) + '%' : '—';
    tituloEstado = 'Sem vencedor ainda';
    subEstado    = 'A diferença em <b>' + esc(nomePrim) + '</b> está com ' + conf +
                   ' de confiança, e o alvo é ' + (CONFIANCA * 100).toFixed(0) + '%.';
    corEstado    = 'var(--atencao)';
  }

  /* Na tela vai a versão curta; a frase inteira vira tooltip. O canto superior
     direito é espaço nobre e estreito — texto corrido ali empurra o card pra
     baixo e rouba largura da hipótese. `subEstado` e `falta` continuam existindo
     porque é deles que sai a dica. */
  const semTags = h => String(h).replace(/<[^>]+>/g, '');
  const curto =
      !tot      ? 'sem visitantes ainda'
    : poucos    ? cA + ' e ' + cB + ' ' + unidade + ' · piso ' + PISO
    : decidido  ? ((1 - sPrim.p) * 100).toFixed(0) + '% de confiança'
    : sPrim     ? ((1 - sPrim.p) * 100).toFixed(0) + '% · alvo ' + (CONFIANCA * 100).toFixed(0) + '%'
                : '—';

  const painel =
    '<div class="ab-estado temdica" style="--c:' + corEstado + '" data-dica="' +
        esc(semTags(subEstado) + (falta && !poucos ? ' ' + semTags(falta) : '')) + '">' +
      '<div class="ab-est-tit">' + tituloEstado + '</div>' +
      '<div class="ab-est-sub">' + curto + '</div>' +
      barraProg +
    '</div>';

  const estado = ex.fim ? badge('encerrado', 'var(--ink-3)') : badge('rodando', 'var(--bom)');

  return '<div class="card">' +
    /* Duas colunas: à esquerda o que o teste É (título, período, hipótese), à
       direita em que pé ele está. O estado ocupa a sobra que já existia ao lado
       do 'editar' em vez de virar uma faixa própria. */
    '<div class="ab-topo">' +
      '<div class="ab-topo-esq">' +
        '<div class="sec" style="margin:0;">' + ico('Teste A/B') +
          '<span>' + esc(ex.rotulo) + '</span> ' + estado +
          (ex.inicio ? '<span class="ab-desde">desde ' + brDate(ex.inicio) + '</span>' : '') +
          (ex.fim ? '<span class="ab-desde">até ' + brDate(ex.fim) + '</span>' : '') +
        '</div>' +
        /* A hipótese é a PERGUNTA e a tabela é a resposta — nessa ordem o card
           se lê como uma frase só. */
        (ex.hipotese ? '<div class="ab-hip">' + esc(ex.hipotese) + '</div>' : '') +
      '</div>' +
      '<div class="ab-topo-dir">' +
        '<button class="limpar" onclick="editarExperimento(' + JSON.stringify(ex.chave).replace(/"/g, '&quot;') + ')">editar</button>' +
        painel +
      '</div>' +
    '</div>' +
    '<div class="tbwrap"><table class="tb abtab">' +
      '<tr><th>Variante</th>' +
        COLS.map(c => '<th class="num' + (c.decide ? ' abdec' : '') + '">' +
                      rotuloTb(c.rotulo) + '</th>').join('') +
      '</tr>' +
      /* O destaque só entra quando existe vencedor de verdade na métrica
         principal. Marcar quem está na frente antes disso seria transformar
         ruído em decisão — que é o erro que esta aba inteira existe pra evitar. */
      linhaBraco(A, A.rotulo || ex.rotulo_a, 'var(--s1)', venceuA) +
      linhaBraco(B, B.rotulo || ex.rotulo_b, 'var(--s2)', venceuB) +
    '</table></div>' +
    /* URL e datas descem pro rodapé, pequenas. São referência: você abre o card
       pra ver quem está ganhando, não pra ler a URL — e ela estava ocupando uma
       linha inteira acima da tabela, empurrando pra baixo o que importa. */
    '<div class="ab-pe">' +
      /* O próprio chip copia. Um botão ao lado pra fazer o que o texto do lado
         dele já representa é um clique a mais e uma peça a mais na linha. */
      '<code class="ab-url" title="clique para copiar a URL do teste" ' +
        'onclick="copiarUrl(' + JSON.stringify(URL_QUIZ + '?ab=' + ex.chave).replace(/"/g, '&quot;') +
        ', this)">?ab=' + esc(ex.chave) + '</code>' +
      /* Troféu só quando alguém ganhou. Empate leva o traço: um troféu de
         empate premiaria a ausência de resultado, que é o oposto do que este
         card serve pra dizer. */
      (ex.vencedor
        ? (ex.vencedor === 'empate'
            ? '<span class="ab-venc empate">empate</span>'
            : '<span class="ab-venc">' + TROFEU + '<b>' +
              esc(ex.vencedor === 'a' ? ex.rotulo_a : ex.rotulo_b) + '</b></span>')
        : '') +
    '</div>' +
    alerta +
    '</div>';
}

async function editarExperimento(chave) {
  const { data, error } = await sb.from('experimentos').select('*').eq('chave', chave).single();
  if (error) return alert('Não deu pra abrir: ' + error.message);
  const e = data;
  document.getElementById('modal').innerHTML =
    '<div class="modal" onclick="if(event.target===this)fecharModal()"><div class="box">' +
      '<h2>' + esc(e.rotulo) + '</h2>' +
      '<div class="qual">Os braços e a divisão 50/50 vivem na página do quiz, não aqui — ' +
        'mudar a divisão no meio do teste inutiliza a comparação. Aqui você descreve, ' +
        'anota e encerra.</div>' +
      '<div id="exErro" class="erro" style="display:none;"></div>' +
      '<label class="fcampo">Rótulo<input id="ex_rotulo" value="' + esc(e.rotulo) + '" maxlength="80"/></label>' +
      '<label class="fcampo">Hipótese<textarea id="ex_hip" rows="2" maxlength="400">' + esc(e.hipotese || '') + '</textarea></label>' +
      '<label class="fcampo">Nota<textarea id="ex_nota" rows="2" maxlength="400">' + esc(e.nota || '') + '</textarea></label>' +
      '<label class="fcampo">Encerrado em<input id="ex_fim" type="date" value="' + esc(e.fim || '') + '"/></label>' +
      '<label class="fcampo">Vencedor<select id="ex_venc">' +
        ['','a','b','empate'].map(v => '<option value="' + v + '"' + (v === (e.vencedor || '') ? ' selected' : '') + '>' +
          esc(v === '' ? '— ainda rodando —' : v === 'a' ? e.rotulo_a : v === 'b' ? e.rotulo_b : 'Empate') +
        '</option>').join('') +
      '</select></label>' +
      '<div class="pfoot"><button class="limpar" onclick="fecharModal()">Cancelar</button>' +
      '<button class="prim" id="exSalvar" onclick="salvarExperimento(' + JSON.stringify(chave).replace(/"/g, '&quot;') + ')">Salvar</button></div>' +
    '</div></div>';
}

async function salvarExperimento(chave) {
  const btn = document.getElementById('exSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  const erro = document.getElementById('exErro');
  const v = id => document.getElementById(id).value.trim();
  const { error } = await sb.from('experimentos').update({
    rotulo:   v('ex_rotulo') || chave,
    hipotese: v('ex_hip')  || null,
    nota:     v('ex_nota') || null,
    fim:      v('ex_fim')  || null,
    vencedor: v('ex_venc') || null,
  }).eq('chave', chave);
  if (error) {
    erro.textContent = 'Não salvou: ' + error.message; erro.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Salvar'; return;
  }
  fecharModal(); await verAB();
}

// ══════════════════════ BALANÇO ══════════════════════
/* Responde a pergunta que nenhuma outra aba responde: "estou no lucro?".
   A Visão Geral mostra o período filtrado; aqui o mês é a unidade e o
   acumulado atravessa todos eles.

   Não respeita o filtro de data de propósito: um balanço filtrado por 7 dias
   não é um balanço. O acumulado precisa de tudo pra significar alguma coisa. */

const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nomeMes = d => MES_CURTO[Number(d.slice(5, 7)) - 1] + '/' + d.slice(2, 4);

async function verBalanco() {
  const rB = await Promise.resolve(sb.rpc('fn_balanco')).catch(() => ({ error: true }));
  if (!rB || rB.error) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">O balanço ainda não existe no banco. ' +
      'Rode <b>supabase/19-balanco.sql</b> no SQL Editor.</div></div>';
    return;
  }

  /* Do mais novo pro mais velho na tela, mas o acumulado se constrói do mais
     VELHO pro mais novo — ele é a soma de tudo que veio antes. */
  const meses = (rB.data || []).slice();
  let corrido = 0;
  const comAcumulado = meses.slice().reverse().map(m => {
    corrido += Number(m.lucro);
    return { ...m, acumulado: corrido };
  }).reverse();
  const total = corrido;

  const cor = v => v >= 0 ? 'var(--bom)' : 'var(--ruim)';
  const linha = m =>
    '<tr><td class="nm"><b>' + nomeMes(m.mes) + '</b></td>' +
    '<td class="num">' + moeda(m.faturamento) + '</td>' +
    '<td class="num">' + moeda(m.liquido) + '</td>' +
    '<td class="num">' + moeda(m.anuncio) + '</td>' +
    '<td class="num">' + moeda(m.operacional) + '</td>' +
    '<td class="num"><b style="color:' + cor(m.lucro) + '">' + moeda(m.lucro) + '</b></td>' +
    '<td class="num" style="color:' + cor(m.acumulado) + '">' + moeda(m.acumulado) + '</td></tr>';

  document.getElementById('conteudo').innerHTML =
    '<div class="kpis cinco">' +
      '<div class="kpi">' + rotulo('Resultado acumulado') +
        '<div class="val" style="color:' + cor(total) + '">' + moeda(total) + '</div>' +
        '<div class="ap">' + (meses.length ? meses.length + (meses.length > 1 ? ' meses' : ' mês') : '') + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="sec">' + ico('Balanço') + '<span>Mês a mês</span></div>' +
      (comAcumulado.length
        ? '<div class="tbwrap"><table class="tb"><tr><th>Mês</th>' +
            ['Faturamento','Líquido','Anúncio','Operacional','Lucro','Acumulado']
              .map(h => '<th class="num">' + rotuloTb(h) + '</th>').join('') + '</tr>' +
          comAcumulado.map(linha).join('') + '</table></div>' +
          /* O acumulado é o número que responde "estou no lucro"; sozinho na
             tabela ele se perde entre seis colunas. */
          '<div class="nota">' + (total >= 0
            ? 'O produto está <b>no lucro</b> em ' + moeda(total) + ' desde o começo.'
            : 'O produto está <b>no prejuízo</b> em ' + moeda(Math.abs(total)) + '. ' +
              'É esse o valor que precisa entrar de lucro pra empatar.') + '</div>'
        : '<div class="vazio">Nenhum mês com movimento ainda.</div>') +
    '</div>' +
    '';
}

// ══════════════════════ REGISTROS ══════════════════════
/* Um caderno de números, e só isso.

   Tinha linha do tempo e comparação automática antes. As duas saíram: a linha
   do tempo virou lugar nenhum quando as referências passaram a guardar também
   o que mudou, e a comparação só funcionava pras poucas métricas que o
   dashboard sabe recalcular — pro resto ("sem VSL", "na h=2") ela mostrava
   traço, que é ruído com cara de dado faltando.

   O que sobrou é o que ele usa: escreveu, guardou, acha depois. */
/* ── Registros ─────────────────────────────────────────────────────────────
   Caderno da operação: qualquer coisa que precise sobreviver ao dashboard.

   Três tipos, uma lista só. Separar em blocos obrigaria a olhar em três
   lugares pra saber o que aconteceu na semana, que é justamente a pergunta.

   - dado      um número que some do dash quando algo muda ("conversão sem VSL")
   - lembrete  algo pra fazer ou vigiar; ganha risco quando concluído
   - mudança   o que foi mexido e quando

   O `valor` é opcional no banco de propósito: a versão anterior exigia número
   em tudo, e por isso lembrete e mudança simplesmente não cabiam. */

const TIPOS = {
  dado:     { rot: 'Dado',     ico: 'M3 3v18h18M7 15l4-4 3 3 5-6' },
  lembrete: { rot: 'Lembrete', ico: 'M12 8v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
  mudanca:  { rot: 'Mudança',  ico: 'M4 4v6h6M20 20v-6h-6M20 9A8 8 0 006 5.3M4 15a8 8 0 0014 3.7' },
};

/* Reaproveita moeda e pct em vez de repetir a formatação: duas cópias da
   mesma regra é uma pra ser corrigida e a outra pra ficar errada. O `n` solto
   perde a casa decimal quando o número é inteiro — "12", não "12,0". */
const fmtRef = (v, u) =>
    u === 'R$' ? moeda(v)
  : u === '%'  ? pct(v)
  : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const curtaRef = d => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(2, 4);

let filtroReg = 'tudo';

function icoTipo(t) {
  const d = (TIPOS[t] || TIPOS.mudanca).ico;
  return '<svg class="rg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
}

async function verRegistros() {
  const { data, error } = await sb.from('registros').select('*')
    .order('data', { ascending: false }).order('id', { ascending: false });
  if (error) {
    document.getElementById('conteudo').innerHTML =
      '<div class="card"><div class="vazio">A tabela de registros ainda não existe. ' +
      'Rode <b>supabase/21-registros.sql</b> no SQL Editor.</div></div>';
    return;
  }
  /* Concluído vai pro fim: ele continua legível, mas para de disputar espaço
     com o que ainda está aberto. Some seria pior — apagaria o histórico do que
     você já resolveu. */
  const todos = (data || []).sort((a, b) => (a.feito ? 1 : 0) - (b.feito ? 1 : 0));
  const regs = filtroReg === 'tudo' ? todos : todos.filter(r => r.tipo === filtroReg);

  const conta = t => todos.filter(r => t === 'tudo' || r.tipo === t).length;
  const chip = (id, rot) =>
    '<button class="rg-chip' + (filtroReg === id ? ' on' : '') + '" onclick="filtrarReg(\'' + id + '\')">' +
      esc(rot) + ' <span class="rg-n">' + conta(id) + '</span></button>';

  const linha = r => {
    const t = TIPOS[r.tipo] || TIPOS.mudanca;
    /* "01/08/26 a 23/08/26" e nao um travessao: o travessao entre duas datas
       lê como sinal de menos, e num lugar onde a coluna do lado tem número
       isso confunde de verdade. */
    const periodo = r.ate && r.ate !== r.data
      ? curtaRef(r.data) + ' a ' + curtaRef(r.ate)
      : curtaRef(r.data);
    /* O número é o que o olho tem que achar primeiro numa lista onde a maioria
       das linhas não tem nenhum. Daí peso e cor da marca — o resto é texto. */
    const val = r.valor != null
      ? '<span class="rg-val">' + fmtRef(r.valor, r.unidade) + '</span>'
      : '<span class="rg-vazio">—</span>';
    return '<tr class="rg-l' + (r.feito ? ' feito' : '') + '">' +
      '<td class="rg-t" title="' + esc(t.rot) + '">' + icoTipo(r.tipo) + '</td>' +
      '<td class="nm"><b>' + esc(r.titulo) + '</b></td>' +
      '<td class="num">' + val + '</td>' +
      '<td class="rg-data">' + periodo + '</td>' +
      '<td class="livre">' + (r.nota ? esc(r.nota) : '—') + '</td>' +
      '<td class="num rg-acoes">' +
        (r.tipo === 'lembrete'
          ? '<button class="limpar" onclick="marcarReg(' + r.id + ',' + (r.feito ? 'false' : 'true') + ')">' +
            (r.feito ? 'reabrir' : 'concluir') + '</button>'
          : '') +
        '<button class="limpar" onclick="apagarReg(' + r.id + ')">excluir</button>' +
      '</td></tr>';
  };

  document.getElementById('conteudo').innerHTML =
    '<div class="card">' +
      '<div class="cabsec"><div class="sec" style="margin:0;">' + ico('Registros') +
        '<span>Registros</span></div>' +
        '<button class="prim" onclick="abrirReg()">Novo registro</button></div>' +
      '<div class="rg-filtros">' + chip('tudo', 'Tudo') +
        Object.keys(TIPOS).map(k => chip(k, TIPOS[k].rot + 's')).join('') + '</div>' +
      (regs.length
        /* colgroup e não deixar o navegador decidir: com largura automática o
           Valor (à direita) e o Período (à esquerda) encostavam um no outro,
           enquanto Nota e ações sobravam de espaço. */
        ? '<div class="tbwrap"><table class="tb rg-tb">' +
            '<colgroup><col class="c-ico"><col class="c-oque"><col class="c-val">' +
            '<col class="c-per"><col class="c-nota"><col class="c-acoes"></colgroup>' +
            '<tr><th></th><th>O quê</th>' +
            '<th class="num">Valor</th><th>Período</th><th>Nota</th><th></th></tr>' +
          regs.map(linha).join('') + '</table></div>'
        : '<div class="vazio" style="text-align:left;padding:20px 0 6px;">' +
          (filtroReg === 'tudo'
            ? 'Nada guardado ainda. Serve pra número que some do dashboard quando você ' +
              'muda algo, pra lembrete e pro que você mexeu.'
            : 'Nenhum registro desse tipo.') + '</div>') +
    '</div>';
}

function filtrarReg(t) { filtroReg = t; verRegistros(); }

      '<label class="fcampo">Tipo<select id="rgTipo" onchange="tipoReg()">' +

      '<div class="qual" id="rgQual"></div>' +
      '<label class="fcampo">O quê<input id="rgTit" maxlength="160"/></label>' +
      /* Valor e período só existem pro tipo 'dado'. Campo que não serve pro que
         você escolheu é campo que você tem que decidir ignorar. */
      '<div id="rgNum">' +
        '<div class="fdupla">' +
          '<label class="fcampo">Valor<input id="rgVal" type="text" inputmode="decimal" placeholder="21,2"/></label>' +
          '<label class="fcampo">Unidade<select id="rgUni">' +
            '<option value="%">%</option><option value="R$">R$</option><option value="n">número</option>' +
          '</select></label>' +
        '</div>' +
        '<div class="fdupla">' +
          '<label class="fcampo">De<input id="rgDe" type="date" value="' + hoje + '"/></label>' +
          '<label class="fcampo">Até<input id="rgAte" type="date" value="' + hoje + '"/></label>' +
        '</div>' +
      '</div>' +
      '<label class="fcampo" id="rgDataSo">Quando<input id="rgData" type="date" value="' + hoje + '"/></label>' +
      '<label class="fcampo">Nota<input id="rgNota" maxlength="200"/></label>' +
      '<div class="pfoot"><button class="limpar" onclick="fecharModal()">Cancelar</button>' +
      '<button class="prim" id="rgSalvar" onclick="salvarReg()">Guardar</button></div>' +

  setTimeout(() => { const e = document.getElementById('rgTit'); if (e) e.focus(); }, 30);

const DICA_TIPO = {
  dado:     'Escreva com o contexto: "sem VSL", "na h=2", "antes do teste".',
  lembrete: 'Algo pra fazer ou vigiar. Some do topo quando você concluir.',
  mudanca:  'O que você mexeu, pra saber depois o que explica a virada no número.',
};
const PLACE_TIPO = {
  dado:     'Ex.: conversão do funil sem VSL',
  lembrete: 'Ex.: subir criativo novo antes de sexta',
  mudanca:  'Ex.: troquei o checkout pra Kiwify',
};

function tipoReg() {
  const t = document.getElementById('rgTipo').value;
  document.getElementById('rgQual').textContent = DICA_TIPO[t] || '';
  document.getElementById('rgTit').placeholder = PLACE_TIPO[t] || '';
  document.getElementById('rgNum').style.display    = t === 'dado' ? '' : 'none';
  document.getElementById('rgDataSo').style.display = t === 'dado' ? 'none' : '';
}

async function salvarReg() {
  const btn = document.getElementById('rgSalvar');
  const erro = document.getElementById('rgErro');
  const falar = m => { erro.textContent = m; erro.style.display = 'block';
                       btn.disabled = false; btn.textContent = 'Guardar'; };
  const tipo = document.getElementById('rgTipo').value;
  const titulo = document.getElementById('rgTit').value.trim();
  if (!titulo) return falar('Escreve o que é esse registro.');

  const linha = { tipo, titulo, nota: document.getElementById('rgNota').value.trim() || null };

  if (tipo === 'dado') {
    const bruto = String(document.getElementById('rgVal').value).replace(',', '.');
    const valor = Number(bruto);
    if (!bruto.trim() || !isFinite(valor)) return falar('Dado precisa de um número.');
    const de = document.getElementById('rgDe').value || iso(hojeSP());
    Object.assign(linha, { valor, unidade: document.getElementById('rgUni').value,
                           data: de, ate: document.getElementById('rgAte').value || de });
  } else {
    linha.data = document.getElementById('rgData').value || iso(hojeSP());
  }

  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('registros').insert([linha]);
  if (error) return falar('Não deu pra guardar: ' + error.message);
  fecharModal();
  await verRegistros();
}

async function marcarReg(id, feito) {
  const { error } = await sb.from('registros').update({ feito }).eq('id', id);
  if (error) return alert('Não deu pra atualizar: ' + error.message);
  await verRegistros();
}

async function apagarReg(id) {
  if (!confirm('Apagar este registro?')) return;
  const { error } = await sb.from('registros').delete().eq('id', id);
  if (error) return alert('Não deu pra apagar: ' + error.message);
  await verRegistros();
}

// ══════════════════════ CALCULADORA DE ROI ══════════════════════
/* Projeção, não medição. Todo o resto do dashboard responde "o que aconteceu";
   esta aba responde "o que aconteceria se". Por isso não tem período nem toca
   no banco: os números saem dos campos, e mudar um recalcula tudo na hora.

   Dois modos sobre a mesma matemática. Na avançada o funil se abre em duas
   etapas, e a conversão final é o produto das duas — com Conv = ConvLP ×
   ConvCheck as duas calculadoras dão exatamente o mesmo resultado, o que é a
   garantia de que uma não está mentindo em relação à outra. */

/* Abre vazia. Número de exemplo na tela é número que você acredita sem querer:
   você olha o ROI de 100% e ele fica na cabeça como se fosse seu. */
const CALC = {
  modo: 'basica',
  investimento: null,
  cpc: null,
  aov: null,
  conv: null,       // % — só na básica
  convLp: null,     // % — só na avançada
  convCk: null,     // % — só na avançada
  metaRoas: 3,
  custosOn: false,
  taxa: 8.99,       // % do faturamento
  imposto: 0,       // % do faturamento
  custoUnit: 0,     // R$ por venda
  outros: 0,        // R$ fixo no período
};

const DEGRAUS = [100, 500, 1000, 2000, 5000, 10000];

/* Uma conta só, usada pelos dois modos e por cada linha da progressão. Recebe o
   investimento porque a tabela de progressão varia justamente ele, mantendo o
   resto constante. */
function calcular(inv) {
  const c = CALC;
  const conv = c.modo === 'basica'
    ? c.conv / 100
    : (c.convLp / 100) * (c.convCk / 100);

  const cliques   = c.cpc > 0 ? inv / c.cpc : 0;
  const checkouts = cliques * (c.modo === 'basica' ? 1 : c.convLp / 100);
  /* Vendas fracionárias ficam. 2,5 vendas é a projeção matemática correta;
     arredondar aqui propagaria o erro pro faturamento, pro CPA e pro ROI. O
     arredondamento é só na hora de mostrar. */
  const vendas    = cliques * conv;
  const fat       = vendas * c.aov;

  /* Taxa e imposto incidem sobre o faturamento; custo unitário, sobre cada
     venda; outros é valor fixo do período. É como cada um funciona de verdade,
     e misturar tudo num percentual só daria número errado em qualquer cenário
     que mude o volume. */
  const taxas  = c.custosOn ? fat * ((c.taxa + c.imposto) / 100) : 0;
  const custos = c.custosOn ? vendas * c.custoUnit + c.outros : 0;

  const lucro  = fat - inv - taxas - custos;
  const roas   = inv > 0 ? fat / inv : null;
  const roi    = inv > 0 ? (lucro / inv) * 100 : null;
  const cpa    = vendas > 0 ? inv / vendas : null;

  return { inv, conv, cliques, checkouts, vendas, fat, taxas, custos, lucro, roas, roi, cpa };
}

/* AOV líquido: o que sobra de cada venda depois de taxa, imposto e custo
   unitário. É ele que manda no ponto de equilíbrio — usar o AOV cheio com
   custos ligados diria que você empata numa conversão em que já está perdendo. */
function aovLiquido() {
  const c = CALC;
  if (!c.custosOn) return c.aov;
  return c.aov * (1 - (c.taxa + c.imposto) / 100) - c.custoUnit;
}

const n2 = v => (v == null || !isFinite(v)) ? '—'
  : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nInt = v => (v == null || !isFinite(v)) ? '—'
  : Math.round(v).toLocaleString('pt-BR');
const pctCalc = v => (v == null || !isFinite(v)) ? '—'
  : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const roasFmt = v => (v == null || !isFinite(v)) ? '—'
  : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'x';

function campoCalc(id, rot, val, sufixo, dica) {
  return '<label class="cc-campo">' +
    '<span class="cc-rot">' + esc(rot) +
      (dica ? '<span class="temdica ajuda" data-dica="' + esc(dica) + '">?</span>' : '') + '</span>' +
    '<span class="cc-input">' +
      (sufixo === 'R$' ? '<i>R$</i>' : '') +
      '<input type="number" id="' + id + '" value="' + (val == null ? '' : val) + '" ' +
        'step="any" min="0" placeholder="0" ' +
        'oninput="mudarCalc(' + JSON.stringify(id).replace(/"/g, '&quot;') + ', this.value)"/>' +
      (sufixo === '%' ? '<i class="fim">%</i>' : '') +
    '</span></label>';
}

function mudarCalc(id, valor) {
  const mapa = {
    cInv:'investimento', cCpc:'cpc', cAov:'aov', cConv:'conv',
    cLp:'convLp', cCk:'convCk', cMeta:'metaRoas',
    cTaxa:'taxa', cImp:'imposto', cUnit:'custoUnit', cOutros:'outros',
  };
  const k = mapa[id];
  if (!k) return;
  /* Vazio vira null, não zero. Zero é uma afirmação ("meu CPC é zero") e
     dispararia o aviso de divisão por zero antes de você ter digitado nada. */
  const t = String(valor).trim();
  const v = Number(t.replace(',', '.'));
  CALC[k] = t === '' ? null : (isFinite(v) && v >= 0 ? v : 0);
  pintarCalc();   /* só o resultado; os campos não são redesenhados */
}

/* Preenche com o que os anúncios entregaram de verdade nos últimos 14 dias.

   As conversões saem sobre CLIQUE, não sobre visitante do quiz, porque é assim
   que a calculadora encadeia: Cliques = Investimento ÷ CPC, e todo o resto
   pendura nos cliques. Usar visitante aqui daria um número maior e uma projeção
   otimista — nem todo clique vira visita.

   O investimento não vem: ele é a pergunta ("e se eu colocar X"), não o dado. */
async function puxarMeusNumeros(botao) {
  const antes = botao.textContent;
  botao.disabled = true;
  botao.textContent = 'Buscando…';
  const falhar = m => { botao.disabled = false; botao.textContent = antes;
                        alert(m); };

  const hoje = hojeSP();
  const de = new Date(hoje); de.setDate(de.getDate() - 13);
  const r = await Promise.resolve(
      sb.rpc('fn_criativos', { p_de: iso(de), p_ate: iso(hoje), p_fonte: null }))
    .catch(() => ({ error: true }));
  if (!r || r.error || !r.data) return falhar('Não deu pra buscar os números.');

  const t = r.data.reduce((a, c) => ({
    gasto:     a.gasto     + Number(c.gasto || 0),
    clicks:    a.clicks    + Number(c.clicks || 0),
    checkouts: a.checkouts + Number(c.checkouts || 0),
    vendas:    a.vendas    + Number(c.vendas || 0),
    valor:     a.valor     + Number(c.valor || 0),
  }), { gasto:0, clicks:0, checkouts:0, vendas:0, valor:0 });

  if (!t.clicks) return falhar('Sem cliques registrados nos últimos 14 dias.');
  if (!t.vendas) return falhar('Sem vendas nos últimos 14 dias, então não dá pra calcular conversão nem AOV.');

  const r2 = v => Math.round(v * 100) / 100;
  CALC.cpc = r2(t.gasto / t.clicks);
  CALC.aov = r2(t.valor / t.vendas);
  CALC.conv   = r2((t.vendas / t.clicks) * 100);
  CALC.convLp = t.checkouts ? r2((t.checkouts / t.clicks) * 100) : null;
  CALC.convCk = t.checkouts ? r2((t.vendas / t.checkouts) * 100) : null;
  /* Investimento sugerido é o que ele gastou de verdade no período. Serve de
     ponto de partida pra mexer, e deixa a primeira linha da projeção fazer
     sentido em vez de sair do nada. */
  if (CALC.investimento == null) CALC.investimento = Math.round(t.gasto);

  verCalculadora();
}

function modoCalc(m) { CALC.modo = m; verCalculadora(); }
function alternarCustos() { CALC.custosOn = !CALC.custosOn; verCalculadora(); }

/* Divisão por zero e valores impossíveis viram aviso, não NaN na tela. */
/* Quais campos ainda estão em branco. Separado dos problemas porque em branco
   não é erro: é o estado normal de quem acabou de abrir a aba. */
function faltandoCalc() {
  const c = CALC;
  const base = [['Investimento', c.investimento], ['CPC', c.cpc], ['AOV', c.aov]];
  const funil = c.modo === 'basica'
    ? [['Conversão do funil', c.conv]]
    : [['Do clique até o checkout', c.convLp], ['Do checkout até a compra', c.convCk]];
  return base.concat(funil).filter(([, v]) => v == null).map(([r]) => r);
}

function problemasCalc() {
  const c = CALC, p = [];
  if (!(c.investimento > 0)) p.push('O investimento precisa ser maior que zero.');
  if (!(c.cpc > 0))          p.push('O CPC precisa ser maior que zero, senão não dá pra saber quantos cliques o investimento compra.');
  if (!(c.aov > 0))          p.push('O AOV precisa ser maior que zero.');
  const convs = c.modo === 'basica' ? [['Conversão do funil', c.conv]]
    : [['Conversão até o checkout', c.convLp], ['Conversão do checkout', c.convCk]];
  convs.forEach(([rot, v]) => {
    if (v < 0 || v > 100) p.push(rot + ' precisa ficar entre 0% e 100%.');
    if (v === 0) p.push(rot + ' está em zero, então a projeção não gera venda nenhuma.');
  });
  if (c.custosOn && aovLiquido() <= 0)
    p.push('Com esses custos, cada venda sai no prejuízo antes do anúncio. Nenhuma conversão empata.');
  return p;
}

function verCalculadora() {
  const c = CALC;
  const av = c.modo === 'avancada';

  const inputs =
    '<div class="cc-bloco"><div class="cc-tit">Aquisição</div>' +
      campoCalc('cInv', 'Investimento', c.investimento, 'R$',
        'Quanto você vai colocar em anúncio no período.') +
      campoCalc('cCpc', 'CPC', c.cpc, 'R$',
        'Custo por clique. Quanto você paga, em média, por cada pessoa que clica no anúncio.') +
    '</div>' +

    '<div class="cc-bloco"><div class="cc-tit">Funil</div>' +
      (av
        ? campoCalc('cLp', 'Do clique até o checkout', c.convLp, '%',
            'De cada 100 pessoas que clicam no anúncio, quantas chegam a clicar em comprar.') +
          campoCalc('cCk', 'Do checkout até a compra', c.convCk, '%',
            'De cada 100 que clicam em comprar, quantas pagam.')
        : campoCalc('cConv', 'Conversão do funil', c.conv, '%',
            'De cada 100 pessoas que clicam no anúncio, quantas compram.')) +
    '</div>' +

    '<div class="cc-bloco"><div class="cc-tit">Oferta</div>' +
      campoCalc('cAov', 'AOV', c.aov, 'R$',
        'Quanto cada comprador gera, em média. Inclui order bump e upsell.') +
    '</div>' +

    '<div class="cc-bloco">' +
      '<label class="cc-check"><input type="checkbox" ' + (c.custosOn ? 'checked' : '') +
        ' onchange="alternarCustos()"/><span>Incluir outros custos</span></label>' +
      (c.custosOn
        ? campoCalc('cTaxa',   'Taxa da plataforma', c.taxa, '%',
            'Percentual que o checkout retém. Na Kiwify são 8,99%.') +
          campoCalc('cImp',    'Impostos', c.imposto, '%',
            'Percentual sobre o faturamento.') +
          campoCalc('cUnit',   'Custo por venda', c.custoUnit, 'R$',
            'Produto, entrega, suporte. O que sai a cada venda.') +
          campoCalc('cOutros', 'Outros custos', c.outros, 'R$',
            'Valor fixo do período: ferramentas, equipe, o que não varia com o volume.')
        : '') +
    '</div>' +

    '<div class="cc-bloco"><div class="cc-tit">Meta</div>' +
      campoCalc('cMeta', 'ROAS que eu quero', c.metaRoas, 'x',
        'Quantas vezes o faturamento tem que ser maior que o investimento.') +
    '</div>' +

    '<button class="limpar cc-puxar" onclick="puxarMeusNumeros(this)">Usar meus números</button>';

  document.getElementById('conteudo').innerHTML =
    '<div class="cc-abas">' +
      '<button class="cc-aba' + (av ? '' : ' on') + '" onclick="modoCalc(\'basica\')">Básica</button>' +
      '<button class="cc-aba' + (av ? ' on' : '') + '" onclick="modoCalc(\'avancada\')">Avançada</button>' +
    '</div>' +
    '<div class="cc-grade">' +
      '<div class="card cc-form">' + inputs + '</div>' +
      '<div id="ccRes"></div>' +
    '</div>';

  pintarCalc();
}

/* Só o lado do resultado se redesenha. Redesenhar os campos junto tiraria o
   foco do input no meio da digitação, e o número que você está escrevendo
   sumiria a cada tecla. */
function pintarCalc() {
  const c = CALC, av = c.modo === 'avancada';
  const alvo = document.getElementById('ccRes');
  if (!alvo) return;

  const falta = faltandoCalc();
  if (falta.length) {
    alvo.innerHTML =
      '<div class="card"><div class="cc-vazio">' +
        '<div class="cc-vazio-tit">Preencha os campos pra ver a projeção</div>' +
        '<div class="cc-vazio-sub">Faltam: ' + falta.map(esc).join(', ') + '.</div>' +
        '<button class="prim" onclick="puxarMeusNumeros(this)">Usar meus números</button>' +
        '<div class="cc-vazio-nota">Preenche CPC, AOV e conversão com o que os seus ' +
          'anúncios entregaram nos últimos 14 dias.</div>' +
      '</div></div>';
    limparGraficos();
    return;
  }

  const probs = problemasCalc();
  if (probs.length) {
    alvo.innerHTML = '<div class="card"><div class="erro">' +
      probs.map(esc).join('<br>') + '</div></div>';
    limparGraficos();
    return;
  }

  const r = calcular(c.investimento);
  const aovLiq = aovLiquido();
  const convBE = aovLiq > 0 ? (c.cpc / aovLiq) * 100 : null;
  const cpaMax = aovLiq;

  /* Meta de ROAS. Cada linha responde "o que teria que mudar, se tudo o mais
     ficasse igual" — por isso são quatro respostas e não uma. */
  const meta      = c.metaRoas;
  const cpaMeta   = meta > 0 ? c.aov / meta : null;
  const convMeta  = c.aov > 0 ? (meta * c.cpc / c.aov) * 100 : null;
  const cpcMeta   = meta > 0 ? (r.conv * c.aov) / meta : null;
  const aovMeta   = r.conv > 0 ? (meta * c.cpc) / r.conv : null;

  const cor = v => v == null ? 'var(--ink-3)' : v >= 0 ? 'var(--bom)' : 'var(--ruim)';

  const kpiG = (rot, val, cr) =>
    '<div class="cc-kpi"><div class="cc-kpi-rot">' + esc(rot) + '</div>' +
      '<div class="cc-kpi-val"' + (cr ? ' style="color:' + cr + '"' : '') + '>' + val + '</div></div>';

  const kpiP = (rot, val, extra) =>
    '<div class="cc-mini"><span class="cc-mini-rot">' + esc(rot) + '</span>' +
      '<span class="cc-mini-val">' + val + '</span>' +
      (extra ? '<span class="cc-mini-ex">' + extra + '</span>' : '') + '</div>';

  alvo.innerHTML =
    '<div class="card">' +
      '<div class="cc-kpis">' +
        kpiG('Investimento', moeda(r.inv)) +
        kpiG('Faturamento', moeda(r.fat), 'var(--bom)') +
        kpiG('Lucro', moeda(r.lucro), cor(r.lucro)) +
        kpiG('ROAS', roasFmt(r.roas), r.roas >= 1 ? 'var(--bom)' : 'var(--ruim)') +
        kpiG('ROI', r.roi == null ? '—' : n2(r.roi) + '%', cor(r.roi)) +
      '</div>' +
      '<div class="cc-minis">' +
        kpiP('Cliques', nInt(r.cliques)) +
        (av ? kpiP('Checkouts', nInt(r.checkouts)) : '') +
        /* Vendas com casa decimal: 2,5 é a projeção certa, e mostrar 2 ou 3
           esconderia que o número está no fio. */
        kpiP('Vendas', '≈ ' + n2(r.vendas)) +
        kpiP('CPA', moeda(r.cpa)) +
        (av ? kpiP('Conversão final', pctCalc(r.conv * 100)) : '') +
        (c.custosOn ? kpiP('Taxas e custos', moeda(r.taxas + r.custos)) : '') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="sec">' + ico('Ponto de equilíbrio') + '<span>Ponto de equilíbrio</span></div>' +
      '<div class="cc-be">' +
        '<div class="cc-be-item"><div class="cc-be-num">' + pctCalc(convBE) + '</div>' +
          '<div class="cc-be-rot">de conversão pra empatar</div>' +
          '<div class="cc-be-sub">Você está em ' + pctCalc(r.conv * 100) +
            (convBE != null && r.conv * 100 >= convBE
              ? ' <b style="color:var(--bom)">acima</b>' : ' <b style="color:var(--ruim)">abaixo</b>') + '</div></div>' +
        '<div class="cc-be-item"><div class="cc-be-num">' + moeda(cpaMax) + '</div>' +
          '<div class="cc-be-rot">de CPA máximo</div>' +
          '<div class="cc-be-sub">Acima disso cada venda dá prejuízo. Você está em ' + moeda(r.cpa) + '.</div></div>' +
      '</div>' +
      (c.custosOn
        ? '<div class="nota" style="margin:14px 0 0;">O ponto de equilíbrio usa o AOV <b>líquido</b> de ' +
          moeda(aovLiq) + ', não os ' + moeda(c.aov) + ' cheios. Com taxa e custo dentro, empatar exige ' +
          'mais conversão do que a conta sem eles diria.</div>'
        : '') +
    '</div>' +

    '<div class="card">' +
      '<div class="sec">' + ico('Meta de ROAS') + '<span>Pra bater ' + roasFmt(meta) + '</span></div>' +
      '<div class="cc-meta">' +
        '<div class="cc-meta-l"><span>CPA máximo</span><b>' + moeda(cpaMeta) + '</b></div>' +
        '<div class="cc-meta-l"><span>Conversão necessária</span><b>' + pctCalc(convMeta) + '</b></div>' +
        '<div class="cc-meta-l"><span>CPC máximo</span><b>' + moeda(cpcMeta) + '</b></div>' +
        '<div class="cc-meta-l"><span>AOV necessário</span><b>' + moeda(aovMeta) + '</b></div>' +
      '</div>' +
      '<div class="nota" style="margin:14px 0 0;">Cada linha responde o que teria que mudar <b>se todo o resto ' +
        'ficasse igual</b>. São quatro caminhos diferentes pro mesmo ROAS, não quatro condições ao mesmo tempo.</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="sec">' + ico('Progressão de investimento') + '<span>Se você escalar</span></div>' +
      '<div class="tbwrap"><table class="tb cc-tb"><tr>' +
        ['Investimento','Cliques', av ? 'Checkouts' : null, 'Vendas','CPA','Faturamento','Lucro','ROAS','ROI']
          .filter(Boolean).map(h => '<th class="num">' + h + '</th>').join('') + '</tr>' +
        DEGRAUS.map(v => { const d = calcular(v);
          return '<tr' + (v === c.investimento ? ' class="cc-atual"' : '') + '>' +
            '<td class="num"><b>' + moeda(d.inv) + '</b></td>' +
            '<td class="num">' + nInt(d.cliques) + '</td>' +
            (av ? '<td class="num">' + nInt(d.checkouts) + '</td>' : '') +
            '<td class="num">' + n2(d.vendas) + '</td>' +
            '<td class="num">' + moeda(d.cpa) + '</td>' +
            '<td class="num">' + moeda(d.fat) + '</td>' +
            '<td class="num" style="color:' + cor(d.lucro) + '">' + moeda(d.lucro) + '</td>' +
            '<td class="num">' + roasFmt(d.roas) + '</td>' +
            '<td class="num" style="color:' + cor(d.roi) + '">' + (d.roi == null ? '—' : n2(d.roi) + '%') + '</td>' +
          '</tr>'; }).join('') +
      '</table></div>' +
      '<div class="nota" style="margin:12px 0 0;">CPC, conversão e AOV ficam constantes na projeção. Na vida real ' +
        'o CPC sobe conforme você escala, então o lucro dos degraus de cima é o teto, não a previsão.</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="sec">' + ico('Investimento e retorno') + '<span>Investimento e retorno</span></div>' +
      '<div style="position:relative;height:300px;"><canvas id="cvCalc"></canvas></div>' +
    '</div>';

  desenharCalc(av);
}

function desenharCalc() {
  limparGraficos();
  const el = document.getElementById('cvCalc');

// ══════════════════════ ACADEMY ══════════════════════
/* Os processos da operação, escritos uma vez e consultados sempre.

   Todo processo é copiável: renderiza formatado pra ler, mas o botão copia a
   FONTE — com as quebras de linha e os marcadores intactos, que é do que a IA
   precisa, e não do que a tela mostra. Já houve aqui um campo `tipo` separando
   'prompt' de 'visual', com etiqueta no cartão; saiu porque a distinção não se
   sustenta na prática: qualquer documento daqui pode virar prompt no dia em que
   fizer falta, e a etiqueta só cobrava uma decisão adiantada.

   O texto mora em <script type="text/plain"> no fim do body, e não numa string
   de JavaScript: processo tem crase, chave e barra invertida no meio, e cada um
   deles precisaria de escape numa string — um escape errado quebraria o
   dashboard inteiro por causa de um documento. */

const ACADEMY = {
  produto:  { rot: 'Produto' },
  criativo: { rot: 'Criativo' },
  vsl:      { rot: 'VSL' },
  trafego:  { rot: 'Tráfego' },

const PROCESSOS = [
  { id: 'modelagem-criativo', cat: 'criativo',
    titulo: 'Modelagem de criativo',
    resumo: 'Pegar um roteiro que já funciona, extrair o que faz ele funcionar, e remontar com o nosso produto dentro.' },

  { id: 'vsl-georgi', cat: 'vsl',

  { id: 'vsl-benson', cat: 'vsl',

  { id: 'vsl-hibrida', cat: 'vsl',
    titulo: 'Estrutura de VSL · Híbrida',
    resumo: 'Os dois mecanismos do Georgi com os três fechamentos do Benson. 18 blocos.' },
  { id: 'vsl-gradualizacao', cat: 'vsl',

  { id: 'vsl-mini', cat: 'vsl',

  { id: 'vsl-sistema', cat: 'vsl',

  { id: 'vsl-modelagem', cat: 'vsl',

    resumo: 'A VSL de controle inteira, fatiada em 44 blocos rotulados, mais o processo pra remontar com o seu produto dentro.' },
];

let procAberto = null;

/* Abre na primeira categoria que TEM processo, não na primeira da lista. Cair
   numa aba vazia na entrada faz a tela parecer quebrada quando ela só está
   incompleta. */
let catAberta = null;

/* Markdown do necessário, não do padrão inteiro: título, lista, tabela, negrito,
   código e régua. É o que os processos usam. Um parser maior seria mais código
   pra manter e nenhuma linha a mais renderizada. */
function md(txt) {
  const ese = t => String(t).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

  /* Blocos de código saem primeiro e voltam no fim. O que está dentro deles é
     literal — deixar um `|` ou um `*` do exemplo passar pelo resto do parser
     estragaria justamente o exemplo. */
  const guardados = [];
  txt = txt.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, c) => {
    guardados.push('<pre class="ac-cod"><code>' + ese(c.replace(/\n$/, '')) + '</code></pre>');
    return '@@COD' + (guardados.length - 1) + '@@';
  });

  const linha = t => ese(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]/g, '<span class="ac-tag">[$1]</span>')
    .replace(/→/g, '<span class="ac-seta">→</span>');

  const ls = txt.split('\n');
  const fora = [];
  let i = 0;

  while (i < ls.length) {
    const t = ls[i].trim();

    if (!t) { i++; continue; }

    const g = t.match(/^@@COD(\d+)@@$/);
    if (g) { fora.push(guardados[+g[1]]); i++; continue; }

    if (/^---+$/.test(t)) { fora.push('<hr>'); i++; continue; }

    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const n = h[1].length + 1;
      fora.push('<h' + n + ' id="' + apelido(h[2]) + '">' + linha(h[2]) + '</h' + n + '>');
      i++; continue;
    }

    /* Tabela só é tabela se a linha seguinte for a régua de separação. Sem essa
       checagem, qualquer frase com barra vertical viraria uma tabela de uma
       coluna. */
    if (/^\|/.test(t) && /^\|[\s:|-]+\|$/.test((ls[i + 1] || '').trim())) {
      const cel = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const cab = cel(t);
      i += 2;
      const corpo = [];
      while (i < ls.length && /^\|/.test(ls[i].trim())) { corpo.push(cel(ls[i])); i++; }
      fora.push('<div class="ac-rola"><table class="ac-tb"><thead><tr>' +
        cab.map(c => '<th>' + linha(c) + '</th>').join('') + '</tr></thead><tbody>' +
        corpo.map(r => '<tr>' + r.map(c => '<td>' + linha(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }

    /* Citação. Entrou quando a ficha de Gradualização passou a citar o
       Breakthrough Advertising: sem isto o `>` virava texto e as linhas da
       citação se juntavam num parágrafo com sinais de maior no meio. */
    if (/^>\s?/.test(t)) {
      const ls2 = [];
      while (i < ls.length && /^>\s?/.test(ls[i].trim())) {
        ls2.push(ls[i].trim().replace(/^>\s?/, ''));
        i++;
      }
      fora.push('<blockquote class="ac-cit">' + linha(ls2.join(' ')) + '</blockquote>');
      continue;
    }

    if (/^[-*]\s/.test(t)) {
      const itens = [];
      /* Linha indentada depois de um item é continuação dele, não item novo — é
         assim que os princípios ficam escritos, com a explicação embaixo. */
      while (i < ls.length && (/^[-*]\s/.test(ls[i].trim()) || (/^\s{2,}\S/.test(ls[i]) && itens.length))) {
        if (/^[-*]\s/.test(ls[i].trim())) itens.push(ls[i].trim().replace(/^[-*]\s/, ''));
        else itens[itens.length - 1] += ' ' + ls[i].trim();
        i++;
      }
      fora.push('<ul class="ac-li">' + itens.map(x => '<li>' + linha(x) + '</li>').join('') + '</ul>');
      continue;
    }

    const par = [];
    while (i < ls.length && ls[i].trim() &&
           !/^(#{1,4}\s|[-*]\s|>|\||---+$|@@COD)/.test(ls[i].trim())) {
      par.push(ls[i].trim()); i++;
    }
    fora.push('<p>' + linha(par.join(' ')) + '</p>');
  }
  return fora.join('\n');
}

/* Mesmo apelido do título e do item do índice — os dois saem daqui, então não
   tem como um apontar pra âncora que o outro não criou. */
function apelido(t) {
  return 'sec-' + String(t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
}

function fonteProcesso(id) {
  const el = document.getElementById('proc-' + id);
  return el ? el.textContent.replace(/^\n/, '').replace(/\s+$/, '') : '';
}

function verAcademy() {

function abrirCat(k) { catAberta = k; verAcademy(); }

function verProcesso(id) {
  const pr = PROCESSOS.find(p => p.id === id);
  if (!pr) { procAberto = null; return verAcademy(); }
  procAberto = id;

  const fonte = fonteProcesso(id);
  /* O índice sai da FONTE e não do HTML já montado: ler o markdown é uma linha
     de regex, e vasculhar o DOM depois exigiria renderizar antes pra só então
     descobrir o que renderizar do lado. */
  const secoes = fonte.split('\n')
    .map(l => l.match(/^##\s+(.*)$/))
    .filter(Boolean)
    .map(m => m[1].trim());

  document.getElementById('conteudo').innerHTML =
    '<div class="card ac-doc">' +
      '<div class="ac-topo">' +
        '<button class="limpar" onclick="fecharProcesso()">← Processos</button>' +
        '<button class="prim" onclick="copiarProcesso(' +
          JSON.stringify(id).replace(/"/g, '&quot;') + ', this)">Copiar prompt</button>' +
      '</div>' +
      '<div class="ac-cols">' +
        '<div class="ac-corpo">' + md(fonte) + '</div>' +
        /* O índice ocupa a sobra que a medida de leitura deixa. Some abaixo de
           1000px, onde essa sobra não existe e ele viraria uma lista solta
           empurrando o texto pra baixo. */
        (secoes.length > 2
          ? '<nav class="ac-indice" aria-label="Seções"><div class="ac-ind-rot">Neste processo</div>' +
            secoes.map(t => '<a href="#' + apelido(t) + '" onclick="irSecao(event,' +
              JSON.stringify(apelido(t)).replace(/"/g, '&quot;') + ')">' + esc(t) + '</a>').join('') +
            '</nav>'
          : '') +
      '</div>' +
    '</div>';
  ligarSpy();
}

/* Marca no índice a seção em que a leitura está.

   Ouve o scroll em captura, como a dica flutuante faz, porque quem rola aqui
   pode ser a janela ou um container interno — e getBoundingClientRect responde
   em coordenada de tela nos dois casos. */
let spyProc = null;

function ligarSpy() {
  desligarSpy();
  const nav = document.querySelector('.ac-indice');
  if (!nav) return;
  /* As seções saem dos ids que o PRÓPRIO índice aponta, e não de um seletor de
     tag. A primeira versão procurava h2 enquanto o índice apontava pra h3 — as
     seções são '##' no markdown, e '##' vira h3 — então ela achava um elemento
     pra seis links e desistia calada. Amarrado ao href, não tem como divergir. */
  const links = [...nav.querySelectorAll('a')];
  const secs  = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  if (!links.length || secs.some(x => !x)) return;

  const marcar = () => {
    /* A seção atual é a ÚLTIMA cujo título já passou da linha de leitura, e não
       a primeira visível: com a primeira visível o marcador pula pra seção
       seguinte assim que o título dela aparece no rodapé da tela, antes de você
       ter chegado nela. */
    let atual = 0;
    secs.forEach((h, i) => { if (h.getBoundingClientRect().top <= 110) atual = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === atual));
  };

  /* O gatilho é o IntersectionObserver, não o evento de scroll. Ele é dirigido
     pelo motor de layout, então dispara mesmo onde o scroll não é despachado
     como evento — e não custa um cálculo a cada pixel rolado.

     O observador só AVISA que algo mudou; quem decide a seção continua sendo o
     marcar() acima. Deduzir a seção das entradas do observador dá buraco: nas
     transições não há nenhuma seção intersectando a faixa, e o marcador
     apagaria. */
  const olho = new IntersectionObserver(marcar, { threshold: [0, 1] });
  secs.forEach(h => olho.observe(h));

  spyProc = marcar;
  spyProc.olho = olho;
  window.addEventListener('scroll', marcar, { passive: true });
  document.addEventListener('scroll', marcar, true);
  window.addEventListener('resize', marcar);
  marcar();
}

function desligarSpy() {
  if (!spyProc) return;
  if (spyProc.olho) spyProc.olho.disconnect();
  window.removeEventListener('scroll', spyProc);
  document.removeEventListener('scroll', spyProc, true);
  window.removeEventListener('resize', spyProc);
  spyProc = null;
}

/* Rola sem carimbar a âncora na URL: o dashboard guarda a aba no localStorage e
   um #hash pendurado ali não significa nada quando você voltar. */
function irSecao(ev, id) {
  ev.preventDefault();
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fecharProcesso() { desligarSpy(); procAberto = null; verAcademy(); }

/* Copia a FONTE, não a seleção da tela. O que o navegador copiaria da tela vem
   sem as quebras de linha do original e com a formatação achatada — colar isso
   numa IA entrega um prompt diferente do que está escrito aqui. */
async function copiarProcesso(id, botao) {
  const texto = fonteProcesso(id);
  const avisar = t => {
    botao.textContent = t;
    setTimeout(() => { botao.textContent = 'Copiar prompt'; }, 1800);
  };
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
      return avisar('Copiado');
    }
  } catch (e) { /* cai no plano B */ }

  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  avisar(ok ? 'Copiado' : 'Não deu — selecione e Cmd+C');
}

/* Primeira aba que ESCREVE no banco. Quem pode é o RLS que decide (05-custos.sql):
   aqui não há checagem de permissão, e não deve haver — validação de acesso no
   navegador é decoração. */
/* Avulsos e ocorrências dos fixos numa lista só, montada no banco. Se a função
   ainda não existir (15-custos-fixos.sql não rodado), cai na leitura antiga —
   a Visão Geral não pode parar de abrir por causa disso. */
const custosDoPeriodo = async () => {
  const p = periodo();
  const r = await Promise.resolve(sb.rpc('fn_custos', { p_de:p.de, p_ate:p.ate }))
    .catch(() => ({ error: true }));
  if (r && !r.error) return r.data || [];

  let q = sb.from('custos').select('*').order('data', { ascending:false }).order('criado_em', { ascending:false });
  if (p.de)  q = q.gte('data', p.de);
  if (p.ate) q = q.lte('data', p.ate);
  const { data, error } = await q;
  if (error) throw error;
  return (data || []).map(c => ({ ...c, fixo: false }));
};

const custosFixos = async () => {
  const r = await Promise.resolve(
    sb.from('custos_fixos').select('*').is('fim', null).order('nome')
  ).catch(() => ({ error: true }));
  return (r && !r.error && r.data) ? r.data : [];
};

      '<div class="fcusto">' +
        '<label>Nome<input id="cNome" maxlength="120" placeholder="Ex.: edição de vídeo"/></label>' +
        /* text e não number: type=number descarta a vírgula em teclado
           brasileiro antes de o JS ver o que foi digitado — inputmode decimal
           mantém o teclado numérico no celular sem essa perda. */
        '<label>Valor<input id="cValor" type="text" inputmode="decimal" placeholder="0,00"/></label>' +

      '<div id="cErro" class="erro" style="display:none;"></div>' +
